# Lint and permalink check for every pull request and every push to main.
# On a push to main that passes, the advance job fast-forwards v<MAJOR> to the same commit.
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Generated files are up to date
        run: |
          python -B tools/reindex.py
          python -B tools/gen_cards.py
          git diff --exit-code || { echo "::error::run tools/reindex.py and tools/gen_cards.py and commit the result"; exit 1; }
      - name: Lint
        run: python -B tools/lint.py
      - name: Permalinks on v1 are kept
        run: |
          major=$(tr -d '[:space:]' < tools/MAJOR)
          git fetch --no-tags origin "refs/heads/v$major:refs/remotes/origin/v$major"
          python -B tools/permalinks.py check --base "origin/v$major" --ref HEAD

  # After main passes, fast-forward v<MAJOR> to it. A plain push: GitHub refuses it unless it
  # fast-forwards. Never creates or deletes a branch; a new major's branch is pushed by hand.
  advance:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: advance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Recheck against the current v1
        run: |
          major=$(tr -d '[:space:]' < tools/MAJOR)
          echo "major=$major" >> "$GITHUB_ENV"
          git fetch --no-tags origin "refs/heads/v$major:refs/remotes/origin/v$major"
          python -B tools/permalinks.py check --base "origin/v$major" --ref "$GITHUB_SHA"
      - name: Fast-forward v1
        env:
          TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_SHA}:refs/heads/v${major}"
