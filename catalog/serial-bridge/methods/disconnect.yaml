kind: method
name: disconnect
summary: Stop the serial-to-network bridge reader and close its serial file descriptor.
description: Registered in the guider's separate serial-to-network (ser2net) control table, not in the
  table of ordinary guider commands, so it is not part of the 105-name guider command set that the main
  imager relays. Served by the guider's ser2net control server on TCP 4040 (all interfaces; in the
  client-verification set). The raw bridge on 4030 accepts a client only while its IP is verified on
  4040. READ. No parameters are read. The handler stops the bridge reader, closes the serial descriptor
  and logs, then replies 0. The link reopens on the next write through the shared serial handler (from a
  4030 client or from the guider's own mount commands), using the stored settings; new 4030 input also
  restarts the reader. A failed reopen only logs, and the written bytes are dropped. READ.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider ser2net control table handler @0x1fe10 (64-bit guider
  build); fd close helper @0x24540; CFdHandler::fd_write @0x26140; ser2net handle_cli_input_complete @0x1ce40
side_effects: Stops the serial bridge reader and closes the serial file descriptor; the logger writes
  a diagnostic line.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: disconnect request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: disconnect
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x1fe10 (64-bit guider build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error branch was recovered.
examples:
- name: request
  of: request
  payload:
    id: 131
    method: disconnect
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: disconnect
    result: 0
    code: 0
    id: 131
see_also: []
spec:
- spec/guider/serial-bridge.md#disconnect
