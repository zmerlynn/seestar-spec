kind: event
name: GuidingDithered
summary: The guide target was dithered by the given offset.
description: 'Sent when a dither movement is applied; callback-driven, no helper throttle. Sent by the
  guider process (zwoair_guider) on its TCP 4400 event server to every retained connection (G/all). The
  main imager process, which is a client of 4400, recognises event lines and forwards them unchanged onto
  TCP 4700 (I/all), so 4700 clients also receive it; the auxiliary imager process deliberately does not
  forward 4400 events. The imager''s forwarding test is lexical (the exact text "Event":" in the line).
  Custom guider producer: no state, code or error member. The Android app defines this name as an event
  constant, but no consumer of its members is established. Typically between SettleBegin and the following
  settle events (INFERRED). Ordering against RPC replies and other guider events is not guaranteed; no
  sequence number, replay or fixed cadence exists. Runtime reachability of the retained guiding functionality
  on every model is unresolved.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, Mount::NotifyGuidingDithered @0x4f280 and GuidingLog::NotifyGuidingDithered
  @0x4a5d0 (64-bit guider build); 32-bit socket_json_guider_server_event::NotifyGuidingDithered counterpart
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: GuidingDithered event
  type: object
  discriminator: Event
  description: Custom guider producer with dx and dy.
  required:
  - Event
  - Timestamp
  - dx
  - dy
  properties:
    Event:
      type: string
      const: GuidingDithered
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, Mount::NotifyGuidingDithered @0x4f280 and GuidingLog::NotifyGuidingDithered
        @0x4a5d0 (64-bit guider build); 32-bit socket_json_guider_server_event::NotifyGuidingDithered
        counterpart
    Timestamp:
      type: string
      description: Decimal string <seconds>.<nine digits> from clock id 1 (monotonic, INFERRED); not a calendar
        time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider Ev constructor @0x15bc90 calls guider getTimestamp @0x13c100
        (clock_gettime clock id 1, format %ld.%09ld) (64-bit guider build)
    dx:
      type: number
      description: Horizontal dither offset; pixels INFERRED.
      x-confidence: READ (type); unit INFERRED
      x-basis: static analysis of firmware 9.31, Mount::NotifyGuidingDithered @0x4f280 and GuidingLog::NotifyGuidingDithered
        @0x4a5d0 (64-bit guider build); 32-bit socket_json_guider_server_event::NotifyGuidingDithered
        counterpart
    dy:
      type: number
      description: Vertical dither offset; pixels INFERRED.
      x-confidence: READ (type); unit INFERRED
      x-basis: static analysis of firmware 9.31, Mount::NotifyGuidingDithered @0x4f280 and GuidingLog::NotifyGuidingDithered
        @0x4a5d0 (64-bit guider build); 32-bit socket_json_guider_server_event::NotifyGuidingDithered
        counterpart
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, Mount::NotifyGuidingDithered @0x4f280 and GuidingLog::NotifyGuidingDithered
    @0x4a5d0 (64-bit guider build); 32-bit socket_json_guider_server_event::NotifyGuidingDithered counterpart
examples:
