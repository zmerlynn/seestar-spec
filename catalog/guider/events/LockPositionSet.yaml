        time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider Ev constructor @0x15bc90 calls guider getTimestamp @0x13c100
        (clock_gettime clock id 1, format %ld.%09ld) (64-bit guider build)
    X:
      type: number
      description: Lock position x coordinate. Pixel units are not established.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, GuidingLog::NotifySetLockPosition @0x4aad0 and socket_json_guider_server_event::NotifySetLockPosition
        @0x6d030 (64-bit guider build); 32-bit counterparts @0x4b840, @0x694a4
    Y:
      type: number
      description: Lock position y coordinate. Pixel units are not established.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, GuidingLog::NotifySetLockPosition @0x4aad0 and socket_json_guider_server_event::NotifySetLockPosition
        @0x6d030 (64-bit guider build); 32-bit counterparts @0x4b840, @0x694a4
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, GuidingLog::NotifySetLockPosition @0x4aad0 and socket_json_guider_server_event::NotifySetLockPosition
    @0x6d030 (64-bit guider build); 32-bit counterparts @0x4b840, @0x694a4
