kind: event
name: GuidingStopped
summary: Guiding has stopped.
description: 'Sent when guiding stops (transition notification, no periodic timer). The 64-bit build reaches
  the event server''s sender from a device-level stop notification; the 32-bit counterpart sits on the
  mount class instead (see the counterpart note in basis). Sent by the guider process (zwoair_guider)
  on its TCP 4400 event server to every retained connection (G/all). The main imager process, which is
  a client of 4400, recognises event lines and forwards them unchanged onto TCP 4700 (I/all), so 4700
  clients also receive it; the auxiliary imager process deliberately does not forward 4400 events. The
  imager''s forwarding test is lexical (the exact text "Event":" in the line). Family N (NotifyEvent):
  Event and Timestamp only, no state, code or error. No Android app consumer is established for this name.
  Ordering against RPC replies and other guider events is not guaranteed; no sequence number, replay or
  fixed cadence exists. Runtime reachability of the retained guiding functionality on every model is unresolved.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyGuidingStopped @0x6cca0;
  MyDev::NotifyGuidingStopped @0x93a00 (64-bit guider build); 32-bit counterpart present
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: GuidingStopped event
  type: object
  discriminator: Event
  description: Event and Timestamp only (family N).
  required:
  - Event
  - Timestamp
  properties:
    Event:
      type: string
      const: GuidingStopped
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyGuidingStopped
        @0x6cca0; MyDev::NotifyGuidingStopped @0x93a00 (64-bit guider build); 32-bit counterpart present
    Timestamp:
      type: string
      description: Decimal string <seconds>.<nine digits> from clock id 1 (monotonic, INFERRED); not a calendar
        time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider Ev constructor @0x15bc90 calls guider getTimestamp @0x13c100
        (clock_gettime clock id 1, format %ld.%09ld) (64-bit guider build)
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyGuidingStopped @0x6cca0;
    MyDev::NotifyGuidingStopped @0x93a00 (64-bit guider build); 32-bit counterpart present
examples:
