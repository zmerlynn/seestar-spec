kind: event
name: Temperature
summary: Guider notification of the guide camera temperature.
description: Custom emitter fed by a camera temperature update (a single float argument). Precise producer
  interval is unresolved. No state, code or error members. Sent by the guider (zwoair_guider) event server
  on TCP 4400 to every retained connection, with no verified or master/guest filter. The main imager process,
  which holds a client connection to 4400, recognizes peer event lines by the exact substring "Event":" and
  re-broadcasts the original line unchanged to all retained connections on TCP 4700, so ordinary 4700 clients
  see it too; the auxiliary imager process (4702) deliberately does not forward 4400 events, avoiding a duplicate
  copy. Because the forwarding test is lexical, the forwarded line is byte-identical to the guider's. No universal
  order relative to RPC replies or other events, no sequence number, no replay. The Android app defines an
  EVENT_TEMPERATURE constant but no event branch that consumes it is established. No getter returning the same
  value is established; in particular the imager's get_sensor_temperature reads the IMU/balance sensor and
  is not this camera temperature. 32-bit build matches (READ); its emitter fills the same members from the same callers.
grade: PURE GETTER (shape only; observation for the receiver)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyTemperature @0x6ac10 (64-bit
  guider build); 32-bit counterpart @0x67750
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: Temperature event
  type: object
  discriminator: Event
  description: Event, Timestamp and value.
  required:
  - Event
  - Timestamp
  - value
  properties:
    Event:
      type: string
      const: Temperature
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyTemperature @0x6ac10
        (64-bit guider build); 32-bit counterpart @0x67750
    Timestamp:
      type: string
      description: Decimal string <seconds>.<nine digits> from clock id 1 (monotonic, INFERRED); not a calendar
        time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider Ev constructor @0x15bc90 calls guider getTimestamp @0x13c100
        (clock_gettime clock id 1, format %ld.%09ld) (64-bit guider build)
    value:
      type: number
      description: Camera/guider temperature, a float widened for JSON. Degrees Celsius is INFERRED from the
        camera producer.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyTemperature @0x6ac10
        (64-bit guider build); 32-bit counterpart @0x67750
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyTemperature @0x6ac10 (64-bit
    guider build); 32-bit counterpart @0x67750
examples:
- name: reading
  summary: Temperature update (READ shape, values invented)
  of: payload
  payload:
    Event: Temperature
    Timestamp: '1234.123456789'
    value: 12.5
see_also: []
