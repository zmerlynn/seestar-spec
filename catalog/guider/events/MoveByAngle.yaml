kind: event
name: MoveByAngle
summary: Mount move-by-angle progress and result.
description: 'Guider-specific S-like helper (not the imager''s S family): it writes state and an optional
  numeric value and adds no error or code. Sent by the move-by-angle worker and by the direct shortcut
  in scope_move_left_by_angle (manual-complete branch). The moving update follows motion-worker progress
  checks; no fixed interval or rate cap is established. Emitted by the guider on TCP 4400 to every retained
  socket; the main imager process forwards the line unchanged onto TCP 4700 (the auxiliary imager process
  suppresses guider forwarding). The imager installs a local callback for this name. No Android event
  branch is established.'
grade: PURE GETTER (observation only; receiving the event changes nothing)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, guider NotifyState @0x6aea0, MoveByAngleFunc @0x6b080 (64-bit
  guider build), scope_move_left_by_angle handler @0x7d260; 32-bit counterparts present
side_effects: None for the receiver; the device sends this without a request.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: MoveByAngle event
  type: object
  discriminator: Event
  description: Move transition.
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: MoveByAngle
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider NotifyState @0x6aea0, MoveByAngleFunc @0x6b080
        (64-bit guider build)
    Timestamp:
      type: string
      description: Decimal string <seconds>.<nine digits> from clock id 1 (monotonic, INFERRED); not a calendar
        time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider Ev constructor @0x15bc90 calls guider getTimestamp @0x13c100
        (clock_gettime clock id 1, format %ld.%09ld) (64-bit guider build)
    state:
      type: string
      enum:
      - start
      - moving
      - complete
      - fail
      description: 'Caller-supplied: start, moving, complete or fail.'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider NotifyState @0x6aea0, MoveByAngleFunc @0x6b080
        (64-bit guider build)
    value:
      type: number
      description: Motion progress from a non-null float pointer on the worker's moving update; a null
        pointer omits it. Degrees is inferred.
      x-required-when: state is moving and the progress pointer is non-null
      x-confidence: READ; unit INFERRED (degrees)
      x-basis: static analysis of firmware 9.31, guider NotifyState @0x6aea0, MoveByAngleFunc @0x6b080
        (64-bit guider build)
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, guider NotifyState @0x6aea0, MoveByAngleFunc @0x6b080 (64-bit
    guider build)
examples:
- name: moving
  summary: Progress update (READ shape; value invented)
  of: payload
  payload:
    Event: MoveByAngle
    Timestamp: '1234.123456789'
    state: moving
    value: 12.5
- name: complete
  summary: Move finished (READ shape)
  of: payload
  payload:
    Event: MoveByAngle
    Timestamp: '1234.123456789'
    state: complete
see_also:
- scope_move_left_by_angle
- scope_is_moving
spec:
- spec/control/mount-and-motion/goto-and-manual-motion.md#fine-and-angle-moves
