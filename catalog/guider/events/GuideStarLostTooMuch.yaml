kind: event
name: GuideStarLostTooMuch
summary: The guide star was lost often enough to cross the guider's loss threshold.
description: 'Sent when the guide-star-loss threshold is crossed (transition notification, no
  periodic timer). The main imager process installs a local callback for this event name on its
  guider client (READ), so the imager can react to it besides forwarding it; what that callback does
  is not described here. The threshold value is unresolved. Sent by the guider process
  (zwoair_guider) on its TCP 4400 event server to every retained connection (G/all). The main imager
  process, which is a client of 4400, recognises event lines and forwards them unchanged onto TCP
  4700 (I/all), so 4700 clients also receive it; the auxiliary imager process deliberately does not
  forward 4400 events. The imager''s forwarding test is lexical (the exact text "Event":" in the
  line). Family N (notification): Event and Timestamp only, no state, code or error. No Android app
  consumer is established for this name. Ordering against RPC replies and other guider events is not
  guaranteed; no sequence number, replay or fixed cadence exists. Runtime reachability of the
  retained guiding functionality on every model is unresolved.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyGuideStarLostTooMuch @0x6ca20
  (64-bit guider build); 32-bit counterpart present
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: GuideStarLostTooMuch event
  type: object
  discriminator: Event
  description: Event and Timestamp only (family N).
  required:
  - Event
  - Timestamp
  properties:
    Event:
      type: string
      const: GuideStarLostTooMuch
      description: Discriminator.
      x-confidence: READ
