kind: event
name: MountConnection
summary: Guider notification that the mount serial device was removed or reconnected.
description: 'Custom emitter (not one of the N/S/F helper families). Sent when the guider''s serial
  refresh detects that the mount serial device disconnected or reconnected. No state, code or error
  members. Sent by the guider (zwoair_guider) event server on TCP 4400 to every retained connection,
  with no verified or master/guest filter. The main imager process, which holds a client connection
  to 4400, recognizes peer event lines by the exact substring "Event":" and re-broadcasts the
  original line unchanged to all retained connections on TCP 4700, so ordinary 4700 clients see it
  too; the auxiliary imager process (4702) deliberately does not forward 4400 events, avoiding a
  duplicate copy. Because the forwarding test is lexical, the forwarded line is byte-identical to
  the guider''s. No universal order relative to RPC replies or other events, no sequence number, no
  replay. The imager installs a local callback for MountConnection (its mount-connection handler);
  that local handling does not establish a different wire shape. No direct APK consumer is
  established. The connection members of scope_get_state overlap, but an identical result is not
  established. 32-bit payload parity beyond the counterpart emitter is unresolved.'
grade: PURE GETTER (shape only; observation for the receiver)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, CFdHandler::SerialRefresh @0x27a40 (64-bit guider build); 32-bit counterpart
  @0x2f854
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: MountConnection event
  type: object
  discriminator: Event
  description: Event, Timestamp, arrival and device. arrival distinguishes reconnection from removal.
  required:
  - Event
  - Timestamp
  - arrival
  - device
  properties:
    Event:
      type: string
      const: MountConnection
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, CFdHandler::SerialRefresh @0x27a40 (64-bit guider build);
        32-bit counterpart @0x2f854
    Timestamp:
      type: string
      description: Decimal string <seconds>.<nine digits> from clock id 1 (monotonic, INFERRED); not a calendar
        time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider Ev constructor @0x15bc90 calls guider getTimestamp @0x13c100
        (clock_gettime clock id 1, format %ld.%09ld) (64-bit guider build)
    arrival:
      type: boolean
      description: Serial reconnection (true) or removal (false). The true/false mapping is INFERRED from the
        member name.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, CFdHandler::SerialRefresh @0x27a40 (64-bit guider build);
        32-bit counterpart @0x2f854
    device:
      type: string
      description: Mount (serial device) identifier.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, CFdHandler::SerialRefresh @0x27a40 (64-bit guider build);
        32-bit counterpart @0x2f854
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, CFdHandler::SerialRefresh @0x27a40 (64-bit guider build); 32-bit
    counterpart @0x2f854
examples:
- name: removed
  summary: Mount serial device removed (READ shape, values invented)
  of: payload
  payload:
    Event: MountConnection
    Timestamp: '1234.123456789'
    arrival: false
    device: mount
- name: reconnected
  summary: Mount serial device back (READ shape, values invented)
  of: payload
  payload:
    Event: MountConnection
    Timestamp: '1234.123456789'
    arrival: true
    device: mount
see_also:
- scope_get_state
- select_serial_dev
- mount_scan_port
