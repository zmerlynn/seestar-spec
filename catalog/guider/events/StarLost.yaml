kind: event
name: StarLost
summary: The guider dropped a frame because the guide star was lost, with frame diagnostics.
description: 'Sent from the guider''s dropped-frame information when the star is lost; one per affected
  frame, callback-driven, no helper throttle. Repeated losses can lead to GuideStarLostTooMuch. Sent by
  the guider process (zwoair_guider) on its TCP 4400 event server to every retained connection (G/all).
  The main imager process, which is a client of 4400, recognises event lines and forwards them unchanged
  onto TCP 4700 (I/all), so 4700 clients also receive it; the auxiliary imager process deliberately does
  not forward 4400 events. The imager''s forwarding test is lexical (the exact text "Event":" in the line).
  Custom guider producer: no lowercase state, code or error; Status and ErrorCode are its own members.
  No Android app consumer is established. Ordering against RPC replies and other guider events is not
  guaranteed; no sequence number, replay or fixed cadence exists. Runtime reachability of the retained
  guiding functionality on every model is unresolved.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0 (64-bit
  guider build); 32-bit counterpart present
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: StarLost event
  type: object
  discriminator: Event
  description: Custom guider producer with seven dropped-frame members.
  required:
  - Event
  - Timestamp
  - Frame
  - Time
  - StarMass
  - SNR
  - AvgDist
  - Status
  - ErrorCode
  properties:
    Event:
      type: string
      const: StarLost
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
        (64-bit guider build); 32-bit counterpart present
    Timestamp:
      type: string
      description: Decimal string <seconds>.<nine digits> from clock id 1 (monotonic, INFERRED); not a calendar
        time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider Ev constructor @0x15bc90 calls guider getTimestamp @0x13c100
        (clock_gettime clock id 1, format %ld.%09ld) (64-bit guider build)
    Frame:
      type: integer
      description: Frame index.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
        (64-bit guider build); 32-bit counterpart present
    Time:
      type: number
      description: Frame time; whether a timestamp or a duration, and its unit, are unresolved. Not the
        Timestamp.
      x-confidence: READ (type); meaning and unit unresolved
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
        (64-bit guider build); 32-bit counterpart present
    StarMass:
      type: number
      description: Star signal mass; scale unresolved.
      x-confidence: READ (type); scale unresolved
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
        (64-bit guider build); 32-bit counterpart present
    SNR:
      type: number
      description: Signal-to-noise ratio.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
        (64-bit guider build); 32-bit counterpart present
    AvgDist:
      type: number
      description: Average distance; pixels INFERRED.
      x-confidence: READ (type); unit INFERRED
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
        (64-bit guider build); 32-bit counterpart present
    Status:
      type: string
      description: Reason/status text.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
        (64-bit guider build); 32-bit counterpart present
    ErrorCode:
      type: integer
      description: Dropped-frame error enum value; the enum is not established.
      x-confidence: READ (type); values unresolved
      x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
        (64-bit guider build); 32-bit counterpart present
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, socket_json_guider_server_event::NotifyStarLost @0x6ecd0
    (64-bit guider build); 32-bit counterpart present
