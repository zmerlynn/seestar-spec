title: get_ra_dec_history result
type: object
description: Cached guiding history as parallel arrays.
required:
- Number
- RADistanceRaw
- DECDistanceRaw
- RADuration
- RADirection
- DECDuration
- DECDirection
- IsSettle
- IsDither
properties:
  Number:
    type: integer
    description: Number of history entries.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0x77270 (64-bit guider build)
  RADistanceRaw:
    type: array
    description: 'Raw RA error distances, one number per history entry, copied without conversion (the same value as the GuideStep member of that name). Scale probably pixels (INFERRED).'
    items:
      type: number
      x-confidence: READ (type, no conversion); INFERRED (scale)
      x-basis: static analysis of firmware 9.31, handler @0x77270 (per-entry fill; serializers <<double @0x158e10, <<int @0x15b510, <<string @0x158ac0) and history push in NotifyGuideStep @0x6fc94-0x6fca8 (64-bit guider build); 32-bit not checked
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0x77270 (per-entry fill; serializers <<double @0x158e10, <<int @0x15b510, <<string @0x158ac0) and history push in NotifyGuideStep @0x6fc94-0x6fca8 (64-bit guider build); 32-bit not checked
  DECDistanceRaw:
