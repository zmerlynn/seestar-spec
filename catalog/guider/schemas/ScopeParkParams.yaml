$schema: https://json-schema.org/draft/2020-12/schema
title: scope_park params
description: Optional. An object {equ_mode} or a positional array [equ_mode]. A bare scalar is not bound
  and is treated as absent.
anyOf:
- type: object
  properties:
    equ_mode:
      type: &id001
      - boolean
      - integer
      description: Equatorial-mode selector for the park. true sends mode 1, false sends mode 2 (an integer
        is true when nonzero). A missing, null or wrong-typed value is ignored and mode 0 (keep the current
        mode) is sent. Physical meaning of the modes is INFERRED (equatorial versus alt-azimuth home orientation).
      x-default: 'omitted: keep current mode'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x7d700 (64-bit guider build)
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, guider handler @0x7d700 (64-bit guider build)
- type: array
  minItems: 1
  prefixItems:
  - type: *id001
    description: Equatorial-mode selector for the park. true sends mode 1, false sends mode 2 (an integer
      is true when nonzero). A missing, null or wrong-typed value is ignored and mode 0 (keep the current
      mode) is sent. Physical meaning of the modes is INFERRED (equatorial versus alt-azimuth home orientation).
    x-default: 'omitted: keep current mode'
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, guider handler @0x7d700 (64-bit guider build)
  description: 'Positional form: first element is equ_mode.'
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, guider handler @0x7d700 (64-bit guider build)
x-confidence: READ
x-basis: static analysis of firmware 9.31, guider handler @0x7d700 (64-bit guider build)
