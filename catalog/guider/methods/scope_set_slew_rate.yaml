kind: method
name: scope_set_slew_rate
summary: Select the mount slew-rate index.
description: 'Requires a connected mount that supports the operation, then selects the slew-rate index
  used by subsequent moves. The parameter is a bare integer or an array whose first element is an integer;
  a non-integer gives 104. The handler applies no list bound, clamp or default; the supported index list
  and whether the rate is sent to hardware immediately are unresolved. Via the imager command port (4700)
  the request reaches this handler only as a forwarded unknown method; see the control service for the
  relay. No serial traffic (firmware 9.31, READ): the rate is stored in the driver and sent as a rate
  command at the next move.'
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x72200 (64-bit build)
side_effects: Changes the cached slew-rate selection used by motion commands.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
