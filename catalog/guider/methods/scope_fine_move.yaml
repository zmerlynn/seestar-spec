kind: method
name: scope_fine_move
summary: Apply per-axis fine-move values and poll for stop with a timeout.
description: Firmware 9.31 and 9.75 (64-bit builds; READ). Requires a connected mount that reports motion
  support. The first two elements of the speed array supply the x/y values. If the coordinate read succeeds,
  the guider compensates x using the coordinate reported as altitude; a failed read skips compensation
  and continues. If the absolute coordinate exceeds 85 degrees, it is replaced with positive 85. When
  its degree cosine is greater than 0.1, the factor is the reciprocal rounded to single precision; otherwise
  the factor is 10. Only x is multiplied by it. When limit is enabled, comparable x/y values are then
  clamped to [-16, 16]. Each value is divided by the signed integer duration in double precision and narrowed
  to single precision. For finite divided rates, an absolute magnitude below the double-precision threshold
  0.01 requests an axis abort instead of a rate or timed move; the abort's return value is not checked.
  A JSON value written as 0.01 is not guaranteed to reach the rate path, because the value is stored in
  single precision. For other finite rates, each magnitude is capped at 1440 and sent to the controller
  as its native rate value with two decimals, followed by a timed move, with no unit conversion in the
  guider; this is the same rate output that scope_speed_move uses. Anti-resonance snapping is disabled.
  The physical rate unit is unresolved (needs a device test). For axes that reach the timed move, backlash_comp
  true selects the :MTD command family; false uses the normal timed-move path, whose checked AM5 implementation
  uses :MT. Both receive the same duration integer. If neither axis operation reports failure to the handler,
  the guider polls movement status with a wait budget of duration plus 6 seconds when backlash_comp is
  true, or duration plus 2 seconds otherwise. It then replies with integer result 0, including after a
  stop-wait timeout. The reply does not establish an observed stop, physical completion, or acceptance
  of an abort request. Controller-side backlash behaviour is unresolved. The reviewed handler emits no
  completion event. Whether the mount's serial work runs on a worker was not re-checked (unresolved).
grade: MUTATOR / established (native handler, 64-bit build)
side_effect_tier: C
confidence: READ
basis: 'static analysis of firmware 9.31, handler @0x7f850 (64-bit build); axis command helper speedMoveAxisCmd
  @0x68870 (rate command, timed-move command, 1440 clamp); wait for stop WaitScopeStop @0x68d10; formatter
  sites @0x7fa80 (210). Firmware 9.75 (64-bit build): handler @0x81030 (same instruction structure, relocated
  references); helper rate path @0x6a10c-0x6a3a4; wait @0x6a5dc-0x6a654'
side_effects: Requests per-axis aborts, or rate and timed moves, then polls movement status with a timeout
  when the handler reaches its success path.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_fine_move request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_fine_move
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      $ref: ../schemas/ScopeFineMoveParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler 0x7f850 (64-bit build); firmware 9.75, handler
        0x81030 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: scope_fine_move reply_success
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        type: integer
        const: 0
        description: Integer 0 after the handler reaches its success path and the stop wait returns, including
          after a timeout. Return values of small-rate aborts are not checked.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler 0x7f850 (64-bit build); firmware 9.75, handler
          0x81030 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 210
  trigger: The connected mount reports that motion is unsupported
  label: not supported
- code: 315
  trigger: The mount is absent or reports disconnected
  label: mount is not connected
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: Missing or invalid speed, invalid first-two numeric values, and reported axis-operation failures
  format the current thread-local error, substituting 207 when it is zero; they have no fixed parameter-error
  code. A coordinate-read failure instead skips compensation and continues. A small-rate abort's return
  is not checked, and a stop-wait timeout still reaches result 0. Dispatcher codes (200, 100, 101, 103)
  are from firmware 9.31.
examples:
- name: minimal
  summary: speed only; values invented
  of: request
  payload:
    id: 90
    method: scope_fine_move
    params:
      speed:
      - 4
      - -2
- name: full
  summary: All optional members; values invented
  of: request
  payload:
    id: 91
    method: scope_fine_move
    params:
      speed:
      - 8.5
      - 0
      dur_sec: 2
      limit: true
      backlash_comp: false
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_fine_move
    result: 0
    code: 0
    id: 90
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_fine_move
    error: mount is not connected
    code: 315
    id: 92
see_also:
- scope_abort_slew
- guide_pulse
