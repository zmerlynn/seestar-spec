kind: method
name: scope_fine_move
summary: Move the mount axes at a small commanded speed for a duration, then wait for it to stop.
description: 'Requires a connected mount that supports motion (INFERRED mapping of the not-supported check).
  Optionally compensates the x speed for altitude using a cosine factor, clamps to [-16, 16] when limit
  is true, divides each axis value by dur_sec and issues live speed-move axis commands with the anti-resonance
  flag false; the shared helper keeps an absolute magnitude cap of 1440 but its 900..1000 snapping is
  disabled for these calls. The handler then waits for the scope to stop, so a success reply (result 0)
  follows the motion. The values reach the controller as its native rate value, written raw with two decimals
  followed by a timed-move command, with no unit conversion in the guider; they share the number space
  of scope_speed_move speeds. The physical unit is unresolved (needs a device test). No completion event
  exists. Mount serial: runs on a worker; its commands were not traced beyond the axis-coordinate read
  (unresolved).'
grade: MUTATOR / established (native handler, 64-bit build)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0x7f850 (64-bit build); axis command helper speedMoveAxisCmd
  @0x68870 (rate command, timed-move command, 1440 clamp); wait for stop WaitScopeStop @0x68d10; formatter
  sites @0x7fa80 (210)
side_effects: Issues live axis speed commands to the mount and waits for the scope to stop.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_fine_move request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_fine_move
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      $ref: ../schemas/ScopeFineMoveParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler 0x7f850 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: scope_fine_move reply_success
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        type: integer
        const: 0
        description: Integer 0 after the axis commands and stop wait.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler 0x7f850 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 210
  trigger: Mount does not support motion (INFERRED mapping from the formatter site)
  label: not supported
- code: 315
  trigger: No mount connected
  label: mount is not connected
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: Move, x/y and altitude errors are diagnosed but their propagation is partly unresolved; thread-local
  errors may be forwarded with codes this table does not exhaust.
examples:
- name: minimal
  summary: speed only; values invented
  of: request
  payload:
    id: 90
    method: scope_fine_move
    params:
      speed:
      - 4
      - -2
- name: full
  summary: All optional members; values invented
  of: request
  payload:
    id: 91
    method: scope_fine_move
    params:
      speed:
      - 8.5
      - 0
      dur_sec: 2
      limit: true
      backlash_comp: false
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_fine_move
    result: 0
    code: 0
    id: 90
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_fine_move
    error: mount is not connected
    code: 315
    id: 92
see_also:
- scope_abort_slew
- guide_pulse
