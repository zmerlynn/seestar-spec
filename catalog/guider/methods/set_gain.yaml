kind: method
name: set_gain
summary: Set the guide camera gain.
description: Params is a scalar integer or a one-element array holding it. The handler applies no range
  or clamp; the camera device object validates the value and a refusal is reported as code 207.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x738d0 (64-bit build); MyDev::SetGain @0x927b0
side_effects: Changes the requested camera gain and camera configuration. When reached through an imager
  relay on the main table the same request can additionally trigger the reconnect callback described in
  the guider service notes (relay eligibility is a separate outer gate).
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_gain request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_gain
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table (command/event)
    params:
      $ref: ../schemas/SetGainParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x738d0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 104
  trigger: params is not an integer (or one-element array of integer)
  label: expected int param
- code: 207
  trigger: The device-level SetGain call reported failure (value not valid downstream)
  label: fail to operate
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: Valid gain range is unresolved.
examples:
- name: request
  of: request
  payload:
    id: 6
    method: set_gain
    params: 80
  summary: Scalar integer (shape READ; value invented)
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_gain
    result: 0
    code: 0
    id: 6
- name: rejected
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_gain
    error: fail to operate
    code: 207
    id: 7
see_also:
- set_exposure
spec:
- spec/guider/index.md#method-groups
