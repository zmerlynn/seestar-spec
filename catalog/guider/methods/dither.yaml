kind: method
name: dither
summary: Ask the guiding controller to dither the guide target by an amount and then settle.
description: Hands the amount and the settle criteria to the guiding controller, which changes the guide
  target and settle state. The reply is sent on controller acceptance, not at the end of the dither or
  the settling; progress is reported through guiding dither and settle notifications whose final event
  and error set is unresolved. Controller errors are forwarded. This is the guider's native dither command;
  it is unrelated to the main imager's set_dither and get_dither, which edit stored dither settings.
  The amplitude is |amount| in guide-camera pixels times /DitherScaleFactor (which must be above 0); the
  RA offset is a random fraction (-1 to 1) of it, or follows a spiral in spiral mode (/DitherMode). READ
  (arithmetic) / INFERRED (pixel unit). Dither is refused unless guiding. On success the lock position
  moves and GuidingDithered is emitted. READ. The imager calls dither with id 155, amount
  from its stored settings and settle pixels from settle_arcsec, waits up to 10 s for the reply, then
  waits for SettleDone. READ.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x7c490 (64-bit guider build); PhdController::Dither
  @0x5a200; MyDev::Dither @0x95a50; imager StartDither @0x182790
side_effects: Changes the guiding target and the controller's settle state; guide corrections follow asynchronously.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: dither request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: dither
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      $ref: ../schemas/DitherParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x7c490 (64-bit guider build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 107
  trigger: Malformed parameter shape (for example settle is not an object)
  label: expected object param
- code: 108
  trigger: amount missing or not a number
  label: expected float param
- code: 102
  trigger: A settle member (pixels, time or timeout) is missing
  label: invalid params
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: Controller refusals (including dither while not guiding) are forwarded with their own codes. Further branches forward an error
  code set by the mount driver or a helper; the codes are not exhausted by this table.
examples:
- name: named
  summary: Named form (values invented)
  of: request
  payload:
    id: 141
    method: dither
    params:
      amount: 5
      settle:
        pixels: 1.5
        time: 10
        timeout: 40
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: dither
    result: 0
    code: 0
    id: 141
- name: bad-amount
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: dither
    error: expected float param
    code: 108
    id: 142
see_also:
- control/set_dither
- control/get_dither
- deselect_star
