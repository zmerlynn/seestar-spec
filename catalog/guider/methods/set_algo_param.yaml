kind: method
name: set_algo_param
summary: Set a named parameter of the active guide algorithm on one axis.
description: Selects the X or Y guide algorithm object of the mount and invokes its set-parameter operation.
  value is numeric; the handler returns an int (result 0 on success). Values persist per axis in the stored
  configuration (X and Y algorithm sections). Parameter names per algorithm (READ) are hysteresis {hysteresis, aggression, minMove};
  lowpass {slopeWeight, minMove}; lowpass2 {aggressiveness, minMove}; resist-switch {aggression, fastSwitch,
  minMove}. minMove is in pixels (INFERRED).
  Limits (64-bit; 32-bit not checked; READ) are hysteresis.hysteresis 0..1; hysteresis.aggression above 0 up to 2; lowpass2.aggressiveness 0 or more, no upper limit; resist-switch.aggression above 0 up to 1 (a fraction, not scaled); resist-switch.minMove above 0; every other minMove and lowpass.slopeWeight 0 or more; fastSwitch is never rejected (non-zero means on).
  If the algorithm setter rejects the name or value ("invalid minMove", "invalid hysteresis", "invalid
  aggression", "invalid slopeWeight" or "invalid aggressiveness") the request fails (322). On an out-of-range
  value the setter first applies and persists a substitute (READ, 64-bit) - hysteresis.hysteresis clamped to 0
  or 1; hysteresis.aggression 0.1 if not above 0, 2.0 if above 2; hysteresis.minMove 0.1; lowpass.slopeWeight 5.0;
  lowpass.minMove 0.2; lowpass2.minMove 0.2; lowpass2.aggressiveness keeps its live value and persists 80.0;
  resist-switch.aggression 1.0; resist-switch.minMove 0.1. A client should read the value back after a 322. Via the imager command port (4700) the request reaches this handler
  only as a forwarded unknown method; see the control service for the relay.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x7ebd0 (64-bit build; 322 at 0x7eed8 after the virtual
  SetParam call at 0x7eec0); GetParamNames for Hysteresis @0xe25b0, Lowpass @0xe3a50, Lowpass2 @0xe4ee0, ResistSwitch
  @0xe6280; setters Hysteresis SetHysteresis @0xe2820, SetAggression @0xe2ac0, SetMinMove @0xe2350; Lowpass
  SetSlopeWeight @0xe4200, SetMinMove @0xe37f0; Lowpass2 SetAggressiveness @0xe54a0, SetMinMove @0xe4c80;
  ResistSwitch SetMinMove @0xe5fc0, SetAggression @0xe6d00, SetParam @0xe71f0 (fastSwitch @0xe72ec), GetParam
  @0xe5ea0 (no scaling)
side_effects: Writes the active guide-algorithm parameter and its per-axis stored configuration.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_algo_param request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_algo_param
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/SetAlgoParamParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x7ebd0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 105
  trigger: axis or name is not a string
  label: expected string param
- code: 108
  trigger: value is not a number
  label: expected float param
- code: 322
  trigger: No guide algorithm is available, the algorithm does not know the name, or the value is out of range
    (a substitute value is then applied and persisted)
  label: could not set param
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
examples:
- name: request
  summary: Example request (values invented)
  of: request
  payload:
    id: 49
    method: set_algo_param
    params:
      axis: ra
      name: minMove
      value: 0.2
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_algo_param
    result: 0
    code: 0
    id: 49
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_algo_param
    error: could not set param
    code: 322
    id: 50
see_also:
- set_connected
