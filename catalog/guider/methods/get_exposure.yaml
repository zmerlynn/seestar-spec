kind: method
name: get_exposure
summary: Read the requested guide exposure duration.
description: Params are not consumed. Returns the requested exposure in milliseconds from cached camera
  state. A disconnected or unusable camera yields 0 rather than an error. The method is registered in
  the guider command table (TCP 4400); a request that reaches the main imager and is relayed to the guider
  is a separate route with its own side effects, outside this entry's tier.
grade: PURE GETTER / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: A
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x74970 (64-bit build), MyDev::RequestedExposureDuration
  @0x93c40
side_effects: None. Reads cached camera request state.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_exposure request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_exposure
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x74970 (64-bit build)
reply_success:
  title: get_exposure success reply
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        type: integer
        minimum: 0
        description: Requested exposure duration in milliseconds; 0 when the camera is disconnected or
          unusable.
        x-unit: ms
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, guider handler @0x74970 (64-bit build), MyDev::RequestedExposureDuration
          @0x93c40
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
examples:
- name: request
  of: request
  payload:
    id: 10
    method: get_exposure
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_exposure
    result: 1000
    code: 0
    id: 10
see_also:
- get_camera_binning
spec:
- spec/guider/index.md#method-groups
