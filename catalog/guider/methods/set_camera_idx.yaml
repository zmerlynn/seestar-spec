kind: method
name: set_camera_idx
summary: Select which camera from the camera list is the guide camera.
description: Refused with 312 while the camera is connected. Otherwise logs and selects the camera through
  the equipment dialog logic. The parameter is a bare integer or the first element of an array. The wrong-shape
  error is labelled expected object param (107) although an integer is expected; this is recorded as in
  the source. Index bounds are delegated to the selection list and are unresolved. Via the imager command
  port (4700) the request reaches this handler only as a forwarded unknown method; see the control service
  for the relay.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x73130 (64-bit build)
side_effects: Changes the selected camera.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_camera_idx request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_camera_idx
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/SetCameraIdxParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x73130 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 107
  trigger: Parameter is not of the accepted shape or type (label says object although an integer is expected)
  label: expected object param
- code: 312
  trigger: The camera is currently connected
  label: cannot select if equipment are connected
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
