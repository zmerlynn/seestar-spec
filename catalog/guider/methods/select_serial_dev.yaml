kind: method
name: select_serial_dev
summary: Select the active serial device from the enumerated serial list.
description: Enumerates the serial devices, matches the supplied name or id and changes the active serial
  device through the file-descriptor handler setting. Exact name validation, rescan ordering and reconnect
  side effects are unresolved. Via the imager command port (4700) the request reaches this handler only
  as a forwarded unknown method; see the control service for the relay.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x829c0 (64-bit build)
side_effects: Changes the active serial device configuration.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: select_serial_dev request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: select_serial_dev
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/SelectSerialDevParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x829c0 (64-bit build)
