kind: method
name: scope_goto
summary: Start a slew of the mount to the given equatorial coordinates; the reply reports acceptance,
  not arrival.
description: 'Requires a connected, slew-capable mount. The handler stops the mount-movement watcher,
  then asks the mount driver to slew asynchronously: the driver sets the target, issues the slew command,
  reads the controller''s acceptance and starts a movement-watcher function. It may first query the main
  imager for pod status and compass data and send charge or azimuth set-up commands. Reply code 0 means
  the slew was accepted and the watcher started; the slew then runs on a worker and the function events
  ScopeGoto and (via tracking checks) ScopeTrack describe its progress, in an order relative to the reply
  that is not established. The watcher handles terminal status and may turn tracking on at arrival. Only
  certain movement states admit a new goto; other states give 203. RA is in hours (the driver multiplies
  by 15 internally) and declination in degrees; epoch is unresolved. Mount serial (firmware 9.31, READ;
  see the mount serial chapter): :SZ (azimuth, alt-az mode only), :CE or :CD, :Sr, :Sd, then :MS; the
  one-byte reply 0 starts the watcher.'
grade: 'MUTATOR / established (64-bit build; 32-bit build: C / MUTATOR established independently, full
  contract parity unresolved)'
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x7aba0 (64-bit guider build); driver slew helper
  @0xf52a0; 32-bit handler @0x75af8
side_effects: Sets the mount target coordinates, writes the slew command to the mount controller, starts
  the movement-watcher worker and may send charge or azimuth set-up commands first. Emits function events
  asynchronously.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_goto request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_goto
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      $ref: ../schemas/ScopeGotoParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x7aba0 (64-bit guider build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 108
  trigger: ra or dec missing or not a number
  label: expected float param
- code: 203
  trigger: The mount is moving in a state that does not admit a new goto (only movement types 0, 5 and
    7 are accepted)
  label: equipment is moving
- code: 210
  trigger: The mount or its driver does not support slewing
  label: not supported
- code: 315
  trigger: No mount is connected
  label: mount is not connected
- code: 527
  trigger: Mount replied e13# to the slew command
  label: alt exceed limit
- code: 270
  trigger: Mount replied e5# or e6# to the slew command
  label: below horizon
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: Further branches forward an error code set by the mount driver or a helper; the codes are
  not exhausted by this table.
examples:
- name: named
  summary: Named form (values invented)
  of: request
  payload:
    id: 21
    method: scope_goto
    params:
      ra: 5.5
      dec: 20.25
- name: positional
  summary: Positional form (values invented)
  of: request
  payload:
    id: 22
    method: scope_goto
    params:
    - 18.0
    - -10.5
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_goto
    result: 0
    code: 0
    id: 21
- name: no-mount
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_goto
    error: mount is not connected
    code: 315
    id: 23
see_also:
- scope_sync
- scope_park
- scope_speed_move
- can_goto
