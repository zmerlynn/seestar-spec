kind: method
name: stop_capture
summary: Stop the guide camera acquisition activity.
description: No parameters are read. The handler calls the camera device stop routine and always reports
  success; the helper return value is not converted into an error. Result 0 does not guarantee that frame
  draining or worker termination has finished.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x73ea0 (64-bit build); MyDev::StopCapturing
  @0x924b0
side_effects: Stops the camera capture activity. When reached through an imager relay on the main table
  the same request can additionally trigger the reconnect callback described in the guider service notes
  (relay eligibility is a separate outer gate).
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: stop_capture request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: stop_capture
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table (command/event)
    params:
      description: Not read. Omission, null and any other shape take the same path. Clients SHOULD omit
        it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x73ea0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: No explicit handler error is reachable.
examples:
- name: request
  of: request
  payload:
    id: 21
    method: stop_capture
  summary: Shape READ; example invented
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: stop_capture
    result: 0
    code: 0
    id: 21
see_also:
- set_paused
- set_exposure
spec:
- spec/guider/guiding.md#guiding-workflow
