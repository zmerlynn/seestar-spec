kind: method
name: get_ra_dec_history
summary: Return the cached guiding telemetry history.
description: Params are not read. Returns an object with the entry count Number and eight parallel arrays
  copied under lock from the cached guide telemetry. An empty history is reported as error 321. Distances
  are numbers, durations integers, directions strings, and IsSettle and IsDither integers 0 or 1 (not
  booleans) (READ); distance scale (pixels) and duration unit (milliseconds) are INFERRED.
grade: PURE GETTER / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: A
confidence: READ
basis: static analysis of firmware 9.31, handler @0x77270 (64-bit guider build)
side_effects: Locks and copies cached guide telemetry; no acquisition or mount call.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_ra_dec_history request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_ra_dec_history
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x77270 (64-bit guider build)
reply_success:
  title: get_ra_dec_history success reply
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        $ref: ../schemas/GetRaDecHistoryResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0x77270 (64-bit guider build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 321
  trigger: The history is empty
  label: history is empty now
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
examples:
- name: request
  of: request
  payload:
    id: 21
    method: get_ra_dec_history
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_ra_dec_history
    result:
      Number: 2
      RADistanceRaw:
      - 0.4
      - -0.2
      DECDistanceRaw:
      - 0.1
      - 0.3
      RADuration:
      - 120
      - 80
      RADirection:
      - West
      - East
      DECDuration:
      - 60
      - 0
      DECDirection:
      - North
      - North
      IsSettle:
      - 0
      - 1
      IsDither:
      - 0
      - 0
    code: 0
    id: 22
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_ra_dec_history
    error: history is empty now
    code: 321
    id: 23
see_also: []
spec:
