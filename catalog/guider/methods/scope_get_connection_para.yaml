kind: method
name: scope_get_connection_para
summary: Report the mount driver's connection parameters (baud rate for Serial, address and port for TCP).
description: Reads the driver's connection description through the connection chooser and the cached settings
  getter, with a diagnostic print. The getter passes a null string-output pointer, so the serial auto-selection
  and its log line are bypassed (those belong to callers such as mount_scan_port). The remaining refresh
  and diagnostic still make this a strict MUTATOR at tier B. Params are not consumed.
grade: MUTATOR / established (strict; native handler, 64-bit build)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0x74dd0 (64-bit build); ScopeAM5::GetConnectionPara
  @0xf2df0, log print @0xf2ecc; formatter sites @0x74ee4 (207), @0x74e84 (300)
side_effects: Refreshes the connection-description cache and writes a diagnostic log line; no serial setter,
  read or write.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_get_connection_para request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_get_connection_para
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x74dd0 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: scope_get_connection_para reply_success
  allOf:
