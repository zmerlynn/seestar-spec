kind: method
name: scope_get_horiz_coord
summary: 'Guider: query the mount for its current horizontal (alt/az) coordinates.'
description: 'Guider getter for horizontal coordinates. Registered in the guider dispatcher table; on
  4700 it is reached through the imager method-not-found relay (mount-and-motion R1, R2). READ: the handler
  needs a connected mount (315) that reports horizontal coordinates (210), reads alt and az from the controller
  and replies with the array [alt, az], or {"alt_az": [alt, az]} when params hold ret_obj true. A read
  failure replies with the driver''s error code. INFERRED: degrees, from the controller''s degrees-minutes-seconds
  replies. No side effect beyond the controller reads; graded MUTATOR / tier C with the other scope_get_*
  coordinate readers because the query goes through the shared driver. Mount serial (firmware 9.31, READ):
  :GA, :GZ.'
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider dispatcher table, handler @0x7ff20 (64-bit guider build),
  @0x792a4 (32-bit build); static analysis of app 3.3.2, BaseDeviceViewModel.getHorCoordination, GetHoriCoordinateParams,
  GetHoriCoordinateResult
side_effects: Reads alt and az from the live mount controller; no other side effect and no persisted configuration
  write. READ.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_get_horiz_coord request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_get_horiz_coord
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table (64-bit build, entry @0x1f18c0)
    params:
      description: 'Optional. Only ret_obj is read: {"ret_obj": true} wraps the result as {"alt_az": [alt,
        az]}. The app sends {"ret_obj": true}.'
      type: object
      properties:
        ret_obj:
          type: boolean
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, guider handler @0x7ff20 (64-bit guider build)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x7ff20, MethodRetSwitch<JSeq[]> (64-bit
        guider build); static analysis of app 3.3.2, BaseDeviceViewModel.getHorCoordination, GetHoriCoordinateParams
reply_success:
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - properties:
      result:
        description: '[alt, az], or {"alt_az": [alt, az]} with ret_obj true. Degrees (INFERRED), in the
          controller''s horizontal frame.'
        oneOf:
        - type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
        - type: object
          required:
          - alt_az
          properties:
            alt_az:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              x-confidence: READ
              x-basis: static analysis of firmware 9.31, guider handler @0x7ff20 (64-bit guider build)
        x-confidence: READ (shape); INFERRED (degrees)
        x-basis: static analysis of firmware 9.31, guider handler @0x7ff20, driver GetHoriCoords @0xee730
          (64-bit guider build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 315
  trigger: No mount is connected
  label: mount is not connected
- code: 210
  trigger: The mount driver does not report horizontal coordinates
  label: not supported
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: A failed controller read replies with the driver's error code; those codes are not exhausted
  by this table.
examples:
- name: app-form
  summary: The form the app sends
  of: request
  payload:
    id: 111
    method: scope_get_horiz_coord
    params:
      ret_obj: true
- name: ok-object
  summary: Reply to the app form (values invented)
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_get_horiz_coord
    result:
      alt_az:
      - 42.5
      - 181.75
    code: 0
    id: 111
see_also:
- scope_get_equ_coord
- scope_get_axle_coord
- scope_get_state
spec:
- spec/control/mount-and-motion/tracking-park-and-state.md#position-and-connection-state
- spec/guider/mount-serial-commands.md#the-scope_-method-to-command-mapping
