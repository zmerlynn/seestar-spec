kind: method
name: scope_move
summary: Guider directional mount move or stop; the app sends ["none"] to cancel arm motion.
description: 'Guider mount-motion command. Registered in the guider dispatcher table; on 4700 it is reached
  through the imager method-not-found relay (mount-and-motion R1, R2). READ: params are positional or
  keyed: direction (north, south, east, west or none) and optional duration_sec (integer 1..9). The handler
  needs a connected mount (315) with motion capability (210). A missing or non-string direction gives
  105 and an unknown word 209. none while the guider movement watcher runs a goto, home or horizon move
  commands motion NONE, waits up to about 5 s for the watcher to end, stops the watcher thread and replies
  0; the cancelled worker then reports its own terminal event. Otherwise none follows the direction path
  with direction NONE: a stop command, or a timed NONE move when duration_sec is given. INFERRED: motion
  NONE is a controller stop. A compass direction while a goto, home or horizon move runs gives 203. Without
  duration_sec it starts continuous motion and replies 0 (a repeat of the last continuous direction is
  skipped). With duration_sec, a non-integer gives 104 and a value outside 1..9 gives 204; it then makes
  a timed move when the driver supports one, else continuous motion. A driver failure replies with the
  driver''s error code. The app sends ["none"] from its arm-cancel control. Mount serial (firmware 9.31,
  READ): a rate command (:R2 to :R8) and :MT<dir>NN; needs mount firmware 1.1.9 or later.'
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider dispatcher table, handler @0x7af10 (64-bit guider build;
  movement watcher CheckMoveThr @0x1f7be0, driver Motion slot +584, MotionTimed slot +600, 5000 ms wait),
  @0x7657c (32-bit build); static analysis of app 3.3.2, BaseDeviceViewModel.setArmCancel
side_effects: Commands mount motion or a stop through the driver. none during a goto, home or horizon
  move also stops the guider movement watcher, which then emits its terminal ScopeGoto, ScopeHome or ScopeMoveToHorizon
  event. READ; the physical stop is INFERRED.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_move request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_move
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table (64-bit build, entry @0x1f1950)
    params:
      description: Positional [direction, duration_sec] or keyed {direction, duration_sec}. direction
        is one of north, south, east, west, none (required; 105 if missing or not a string, 209 if unknown).
        duration_sec is an optional integer 1..9 (104 if not an integer, 204 if out of range); seconds
        INFERRED from the name. The app sends ["none"].
      oneOf:
      - type: array
        minItems: 1
        maxItems: 2
        prefixItems:
        - type: string
          enum:
          - north
          - south
          - east
          - west
          - none
        - type: integer
          minimum: 1
          maximum: 9
      - type: object
        required:
        - direction
        properties:
          direction:
            type: string
            enum:
            - north
            - south
            - east
            - west
            - none
            x-confidence: READ
            x-basis: static analysis of firmware 9.31, guider handler @0x7af10 (64-bit guider build)
          duration_sec:
            type: integer
            minimum: 1
            maximum: 9
            x-confidence: READ
            x-basis: static analysis of firmware 9.31, guider handler @0x7af10 (64-bit guider build)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x7af10 (64-bit guider build); static
        analysis of app 3.3.2, BaseDeviceViewModel.setArmCancel
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 315
  trigger: No mount is connected
  label: mount is not connected
- code: 210
  trigger: The mount driver has no motion capability
  label: not supported
- code: 105
  trigger: direction missing or not a string
  label: expected string param
- code: 209
  trigger: direction is not one of north, south, east, west, none
  label: invalid value
- code: 203
  trigger: A compass direction while the movement watcher runs a goto, home or horizon move
  label: equipment is moving
- code: 104
  trigger: duration_sec present but not an integer
  label: expected int param
- code: 204
  trigger: duration_sec outside 1..9
  label: out of limit
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: A driver motion failure replies with the driver's error code; those codes are not exhausted
  by this table.
examples:
- name: app-cancel
  summary: The form the app sends
  of: request
  payload:
    id: 91
    method: scope_move
    params:
    - none
- name: timed-move
  summary: Timed move to the north (values invented)
  of: request
  payload:
    id: 92
    method: scope_move
    params:
      direction: north
      duration_sec: 3
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_move
    result: 0
    code: 0
    id: 91
