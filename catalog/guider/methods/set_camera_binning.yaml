kind: method
name: set_camera_binning
summary: Set the guide camera binning factor.
description: Sets the guide camera binning, valid from 1 up to the camera maximum binning, and updates
  the camera configuration. The value is a bare integer or the first element of an array; a non-integer
  gives 104. Out-of-range values give 204 with no clamping. With no camera connected the reply is 318.
  Via the imager command port (4700) the request reaches this handler only as a forwarded unknown method;
  see the control service for the relay.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x73a20 (64-bit build)
side_effects: Changes the guide camera binning and its stored configuration.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_camera_binning request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_camera_binning
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/SetCameraBinningParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x73a20 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 104
  trigger: Parameter is not an integer
  label: expected int param
- code: 204
  trigger: Binning outside 1..camera maximum
  label: out of limit
- code: 318
  trigger: Guide camera not connected
  label: device not connected
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
