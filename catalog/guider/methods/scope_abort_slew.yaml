kind: method
name: scope_abort_slew
summary: Send a stop command to the connected mount to abort a slew.
description: 'Needs a connected mount (315). Calls the driver''s stop-motion helper with no
  direction selected, which sends the controller''s general stop command, ignores the driver result
  and always replies 0, even if the write fails. It does not stop the guider''s own movement workers
  (the goto, home and horizon watcher, the speed-move repeat worker, the move-by-angle worker), so a
  running worker may command motion again or report its own terminal event. Which motions the
  controller halts, and the final mechanical stop, are unresolved (needs a device test). To end a
  watcher-driven goto, home or horizon move a client SHOULD also send scope_move ["none"]. Params
  are not consumed. Mount serial (firmware 9.31, READ): :Q (all), :Qe (east/west), :Qn
  (north/south); no reply is read.'
grade: MUTATOR / established (native handler, 64-bit build)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0x720c0 (64-bit build; no CMyThread stop calls; reply
  0 regardless of the driver result), driver AbortSlew @0xef920 (":Q#" for direction NONE)
side_effects: Sends the general stop command to the mount controller. Guider movement workers are not
  stopped.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_abort_slew request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_abort_slew
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x720c0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 315
  trigger: No mount connected
  label: mount is not connected
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: A failed stop write still replies 0.
examples:
- name: abort
  summary: Params omitted
  of: request
  payload:
    id: 80
    method: scope_abort_slew
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_abort_slew
    result: 0
    code: 0
    id: 80
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_abort_slew
    error: mount is not connected
    code: 315
    id: 81
see_also:
- scope_fine_move
