  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
- code: 104
  trigger: params not an integer or one-element-array integer
  label: expected int param
- code: 207
  trigger: Mount setter failed
  label: fail to operate
- code: 300
  trigger: Internal object unavailable
  label: internal error
