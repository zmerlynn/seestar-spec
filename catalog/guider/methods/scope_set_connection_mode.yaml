kind: method
name: scope_set_connection_mode
summary: Select the mount connection mode (serial or network choice).
description: Calls the mount connection-mode setter, which changes the serial/network connection choice.
  Success returns integer 0. The mode-index list is unresolved. Served by the guider process (TCP 4400);
  a client on the main command port reaches it through the imager unknown-method relay, which is unavailable
  to guest-table clients. The native-handler grade below does not describe the relay.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0x71ab0 (64-bit build)
side_effects: Changes the mount serial/network connection choice.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_set_connection_mode request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_set_connection_mode
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/ScopeSetConnectionModeParams.yaml
      description: Mode index.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x71ab0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
