      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_auto_load_calibration
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/SetAutoLoadCalibrationParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x70f60 (64-bit build)
