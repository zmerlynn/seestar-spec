kind: method
name: set_auto_load_calibration
summary: Enable or disable automatic loading of the stored guider calibration.
description: Sets the auto-load-calibration option on the guider device object and persists it in the
  configuration. Unlike set_all_connected, an integer is accepted as a boolean. Downstream validation
  and event ordering are unresolved. Via the imager command port (4700) the request reaches this handler
  only as a forwarded unknown method; see the control service for the relay.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x70f60 (64-bit build)
side_effects: Changes the operational auto-load-calibration setting and the persisted configuration.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_auto_load_calibration request
  required:
