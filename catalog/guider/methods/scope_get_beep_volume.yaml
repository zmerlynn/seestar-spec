kind: method
name: scope_get_beep_volume
summary: Query the connected mount for its beep-volume choices and current selection.
description: 'Performs a live device query and formats the choice list plus the current index.
  Params are not consumed. Mount serial (firmware 9.31, READ): :GBu.'
grade: MUTATOR / established (strict; native handler, 64-bit build)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0x808a0 (64-bit build); mount-controller volume query
  (ScopeAM5) @0xf0d50
side_effects: Live sound-volume query to the mount controller; no setting is changed.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_get_beep_volume request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_get_beep_volume
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x808a0 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: scope_get_beep_volume reply_success
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        $ref: ../schemas/ScopeGetBeepVolumeResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler 0x808a0 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 315
  trigger: No mount connected
  label: mount is not connected
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
examples:
- name: query
  summary: Params omitted
  of: request
  payload:
    id: 110
    method: scope_get_beep_volume
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_get_beep_volume
    result:
      list:
      - 'off'
      - low
      - high
      index: 1
    code: 0
    id: 110
  summary: Invented values
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_get_beep_volume
    error: mount is not connected
    code: 315
    id: 111
see_also:
- scope_get_cap
spec:
- spec/guider/index.md#method-groups
- spec/guider/mount-serial-commands.md#the-scope_-method-to-command-mapping
