  label: fail to operate
- code: 210
  trigger: Connected scope reports no guide-rate support (all supplied scope types)
  label: not supported
- code: 315
  trigger: No mount connected
  label: mount is not connected
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
