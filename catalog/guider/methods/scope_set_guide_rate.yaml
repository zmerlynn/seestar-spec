kind: method
name: scope_set_guide_rate
summary: Set the mount guide rate; the supplied scope implementations always reject it.
description: 'Despite the set_ name the native handler is established as a PURE GETTER: on every supplied
  scope type the guide-rate capability returns false and the setter stubs only record an error. A disconnected
  mount gives 315; a connected one gives 210 before the parameters are parsed. The declared numeric parameter
  is therefore latent and a success reply is not produced by these builds. Clients SHOULD NOT rely on
  this method. Via the imager command port (4700) the request reaches this handler only as a forwarded
  unknown method; see the control service for the relay. No serial traffic (firmware 9.31, READ).'
grade: PURE GETTER / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: A
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x71ea0 (64-bit build)
side_effects: 'None in the supplied scope types: the capability and setter bodies are error-only stubs.'
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_set_guide_rate request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_set_guide_rate
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/ScopeSetGuideRateParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x71ea0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
