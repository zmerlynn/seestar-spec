kind: method
name: scope_set_track_state
summary: Turn the mount's sidereal tracking on or off.
description: 'Requires a connected mount that supports tracking control. The driver writes the track-on
  or track-off command to the controller and checks the response characters. Whether that succeeds or
  not, the handler then runs a forced tracking-state check, which updates shared tracking status and can
  emit a ScopeTrack event (members include state, tracking and manual, with a conditional error, code
  and route). The success fragment is built before that check and the event can precede the reply; ordering
  is not established. The reply is sent synchronously after the controller acknowledgment, with no long-running
  wait. Mount serial (firmware 9.31, READ): :Te or :Td; with mount firmware 1.1.0 or later :GAT follows
  and maps e5# to 270, e7# to 502, e8# to 272, e13# to 527, other e..# to 207.'
grade: 'MUTATOR / established (64-bit build; 32-bit build: C / MUTATOR established independently, full
  contract parity unresolved)'
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x71c50 (64-bit guider build); driver SetTrackState
  @0xf18e0; 32-bit handler @0x6c818
side_effects: Writes the track-on or track-off command to the mount controller, updates shared tracking
  status and may emit a ScopeTrack event.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_set_track_state request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_set_track_state
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      $ref: ../schemas/ScopeSetTrackStateParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x71c50 (64-bit guider build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 106
  trigger: The tracking value is not a boolean or an integer
  label: expected bool param
- code: 210
  trigger: The mount or its driver does not support tracking control
  label: not supported
- code: 315
  trigger: No mount is connected
  label: mount is not connected
- code: 270
  trigger: Tracking-reason query replied e5#
  label: below horizon
- code: 502
  trigger: Tracking-reason query replied e7#
  label: mount sync failed
- code: 272
  trigger: Tracking-reason query replied e8#
  label: meridian flip failed
- code: 527
  trigger: Tracking-reason query replied e13#
  label: alt exceed limit
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: When the driver reports failure the handler forwards its error code. Further branches forward
  an error code set by the mount driver or a helper; the codes are not exhausted by this table.
examples:
- name: scalar
  summary: Bare boolean, as the app sends it
  of: request
  payload:
    id: 61
    method: scope_set_track_state
    params: true
- name: named
  of: request
  payload:
    id: 62
    method: scope_set_track_state
    params:
      tracking: false
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_set_track_state
    result: 0
    code: 0
    id: 61
- name: no-mount
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_set_track_state
    error: mount is not connected
    code: 315
    id: 63
see_also:
- scope_goto
- scope_park
