kind: method
name: get_flip_calibration
summary: Report the mount flip-calibration flag held by the guider.
description: Params are not read. Returns a boolean copied from a stored byte of the mount object. The
  meaning of the flag (whether a meridian-flip calibration exists) is INFERRED from the name only. Freshness
  and atomicity of the snapshot are not guaranteed.
grade: PURE GETTER / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: A
confidence: READ
basis: static analysis of firmware 9.31, handler @0x781c0 (64-bit guider build)
side_effects: Reads cached state only; no hardware or operational command.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_flip_calibration request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_flip_calibration
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x781c0 (64-bit guider build)
reply_success:
  title: get_flip_calibration success reply
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        type: boolean
        description: Stored flip-calibration flag.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0x781c0 (64-bit guider build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
examples:
- name: request
  of: request
  payload:
    id: 21
    method: get_flip_calibration
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_flip_calibration
    result: false
    code: 0
    id: 22
see_also: []
