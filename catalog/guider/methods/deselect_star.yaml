kind: method
name: deselect_star
summary: Reset the guider so that no guide star is selected or locked.
description: No parameters are read. Calls the guider reset (with its state-clearing option set), which
  clears the selected star and the guiding state. The reset descends into guider state and lock notification
  paths, so events may follow; which ones depend on the previous state and are unresolved. If the guider
  object does not exist the request fails with 300.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x74a40 (64-bit guider build); guider reset @0xea660
side_effects: Clears the selected guide star and guider state; may emit guider state or lock notifications.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: deselect_star request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: deselect_star
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x74a40 (64-bit guider build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 300
  trigger: No guider object exists
  label: internal error
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
examples:
- name: request
  of: request
  payload:
    id: 121
    method: deselect_star
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: deselect_star
    result: 0
    code: 0
    id: 121
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: deselect_star
    error: internal error
    code: 300
    id: 122
see_also:
- clear_calibration
- dither
