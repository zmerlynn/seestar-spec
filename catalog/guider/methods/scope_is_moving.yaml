kind: method
name: scope_is_moving
summary: Read the mount motion status as a string.
description: 'Needs a connected mount (315). While the guider movement watcher runs, returns the name
  of the watcher''s stored move type (type 0 reported as move); otherwise the name of the type the driver''s
  IsMoving reports. The value is one of none, ScopeGoto, ScopeHome, ScopeMoveToHorizon, move_home_horizon,
  clear_backlash or move; manual and angle moves, and any unlisted type, report move. A client MUST treat
  any value other than none as moving. Served by the guider process (TCP 4400); a client on the main command
  port reaches it through the imager unknown-method relay, which is unavailable to guest-table clients.
  The native-handler grade below does not describe the relay. Mount serial (firmware 9.31, READ): :GU,
  last digit mapped to a movement type.'
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0x7a330 (64-bit build), movement watcher CheckMoveThr
  @0x1f7be0, mount_move_type_str @0x41000
side_effects: Live query of the connected mount through the native mount layer; no motion or setting change
  is established. Tier C rests on the supplied native mount query path; other runtime-selected mount implementations
  are unresolved. Reads shared motion/worker flags.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_is_moving request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_is_moving
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x7a330 (64-bit build)
reply_success:
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - properties:
      result:
        $ref: ../schemas/ScopeIsMovingResult.yaml
        description: Motion status name string.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0x7a330 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
- code: 315
  trigger: No mount is connected
  label: mount is not connected
errors_note: No other handler-specific error exists.
examples:
- name: request
  of: request
  payload:
    id: 5
    method: scope_is_moving
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_is_moving
    result: none
    code: 0
    id: 5
- name: moving
  summary: A goto is running
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_is_moving
    result: ScopeGoto
    code: 0
    id: 7
- name: err-315
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_is_moving
    error: mount is not connected
    code: 315
    id: 6
see_also:
- scope_get_state
- scope_move_left_by_angle
- scope_get_slew_rate
spec:
- spec/control/mount-and-motion/goto-and-manual-motion.md#raw-slew-scope_goto
- spec/guider/index.md#method-groups
- spec/guider/mount-serial-commands.md#the-scope_-method-to-command-mapping
