kind: method
name: get_calibrated
summary: Read whether the mount is calibrated.
description: Params are not consumed. Queries the primary mount and, if present, the secondary mount for
  calibration state. false when no mount is present or not calibrated; when the primary is calibrated
  and a secondary exists the secondary predicate is returned. No handler error. Value freshness and atomicity
  are not guaranteed. The method is registered in the guider command table (TCP 4400); a request that
  reaches the main imager and is relayed to the guider is a separate route with its own side effects,
  outside this entry's tier.
grade: PURE GETTER / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: A
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x77ec0 (64-bit build), mount IsCalibrated virtual
  calls
side_effects: None. Reads calibration and mode flags only.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_calibrated request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_calibrated
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x77ec0 (64-bit build)
reply_success:
  title: get_calibrated success reply
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        type: boolean
        description: Calibration state as described.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, guider handler @0x77ec0 (64-bit build), mount IsCalibrated
          virtual calls
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
examples:
- name: request
  of: request
  payload:
    id: 10
    method: get_calibrated
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_calibrated
    result: false
    code: 0
    id: 10
see_also:
- flip_calibration
- get_auto_load_calibration
spec:
