kind: method
name: scope_get_ra_dec
summary: Read the mount's current right ascension and declination, falling back to the last synchronised
  pair when no live position is available.
description: 'No parameters are read. With a connected, position-capable mount the handler queries the
  controller for the coordinates, updates tracking state (so a ScopeTrack event can follow) and reads
  a third value, appended to the result unless it is the -999 sentinel (local sidereal time, INFERRED).
  Otherwise it returns the cached pair from the last sync, provided the cached values are not within 0.1
  of the -999 sentinel; if there is neither, the request fails with 207. A failed live read increments
  shared failure counters; after repeated or elapsed failures the guider asks the main imager whether
  autosave is running and can install a callback that stops capture and marks the mount disconnected,
  or run the communication-failure handler. This getter therefore has operational recovery paths and is
  graded as a mutator. Live-versus-cached reliability and the coordinate epoch are unresolved. Mount serial
  (firmware 9.31, READ): :GR and :GD.'
grade: 'MUTATOR / established (64-bit build; 32-bit build: C / MUTATOR established independently, full
  contract parity unresolved)'
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x79040 (64-bit guider build); driver GetCoordinates
  @0xeeb20, GetRaDec @0x698f0; 32-bit handler @0x72b9c
side_effects: Reads the mount controller; updates shared tracking state and failure counters; after repeated
  failures may trigger capture stop, a mount-disconnected notice or the communication-failure handler.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_get_ra_dec request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_get_ra_dec
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x79040 (64-bit guider build)
reply_success:
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - properties:
      result:
        description: 'Array [ra, dec] or [ra, dec, lst]: RA in hours, declination in degrees, and a third
          value (INFERRED sidereal time) only when it is not the -999 sentinel.'
        $ref: ../schemas/ScopeGetRaDecResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, guider handler @0x79040 (64-bit guider build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 207
  trigger: No live coordinates and no valid cached pair (the failure code is unassigned by the handler)
  label: fail to operate
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: The handler has no explicit numeric error branch of its own; driver errors are forwarded.
  Further branches forward an error code set by the mount driver or a helper; the codes are not exhausted
  by this table.
examples:
- name: request
  of: request
  payload:
    id: 71
    method: scope_get_ra_dec
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_get_ra_dec
    result:
    - 5.5
    - 20.25
    - 7.125
    code: 0
    id: 71
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_get_ra_dec
    error: fail to operate
    code: 207
    id: 72
see_also:
- scope_sync
- scope_goto
