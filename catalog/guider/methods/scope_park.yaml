kind: method
name: scope_park
summary: Send the mount to its home (park) position, optionally selecting the equatorial or alt-azimuth
  home mode.
description: 'Requires a connected mount that supports homing. When equ_mode parses, the handler first
  asks the main imager whether a ViewPlan is running and fails with 536 if so; omitting or mistyping equ_mode
  skips that query. The driver then sends the home command, records the requested mode and starts the
  movement-watcher function. The reply is sent on acceptance; arrival is not awaited. The ScopeHome function
  event reports working and terminal states, and the watcher can change the equatorial mode after the
  move; ordering against the reply is not established. The handler returns result 0 when the driver''s
  go-home call reports its success convention, otherwise it forwards the driver''s error. Mount serial
  (firmware 9.31, READ): :hC, then a watcher polls :GU every 500 ms and sends :Q on exit.'
grade: 'MUTATOR / established (64-bit build; 32-bit build: C / MUTATOR established independently, full
  contract parity unresolved)'
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x7d700 (64-bit guider build); driver GoHome
  @0xf0050; 32-bit handler @0x79040
side_effects: Sends the home command to the mount controller, records the requested mode, starts the movement-watcher
  worker; may switch the equatorial mode when the move ends.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_park request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_park
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      $ref: ../schemas/ScopeParkParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x7d700 (64-bit guider build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 210
  trigger: The mount or its driver does not support homing
  label: not supported
- code: 315
  trigger: No mount is connected
  label: mount is not connected
- code: 536
  trigger: equ_mode parsed and a ViewPlan is working
  label: view plan is already running
- code: 203
  trigger: The driver finds the movement watcher busy (reported by the driver's go-home path, not in the
    handler's explicit list)
  label: equipment is moving
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: Further branches forward an error code set by the mount driver or a helper; the codes are
  not exhausted by this table.
examples:
- name: bare
  summary: No parameters
  of: request
  payload:
    id: 51
    method: scope_park
- name: equatorial
  summary: Select equatorial home mode
  of: request
  payload:
    id: 52
    method: scope_park
    params:
      equ_mode: true
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_park
    result: 0
    code: 0
    id: 51
- name: plan-running
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_park
    error: view plan is already running
    code: 536
    id: 53
see_also:
- scope_goto
- scope_set_track_state
spec:
- spec/control/mount-and-motion/tracking-park-and-state.md#park-home-and-the-arm
- spec/guider/index.md#method-groups
- spec/guider/mount-serial-commands.md#the-scope_-method-to-command-mapping
