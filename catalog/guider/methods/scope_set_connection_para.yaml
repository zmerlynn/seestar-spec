kind: method
name: scope_set_connection_para
summary: Change the mount connection settings (index or baud rate, address and port).
description: Parses the optional members index, baud_rate, address and port and, when at least one yielded
  a value, calls the mount connection-parameter setter, which changes the operational device connection
  settings and the serial/network chooser. Success returns integer 0. Persistence, reconnect effects and
  subtype-specific meanings are unresolved. Served by the guider process (TCP 4400); a client on the main
  command port reaches it through the imager unknown-method relay, which is unavailable to guest-table
  clients. The native-handler grade below does not describe the relay.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0x71700 (64-bit build)
side_effects: Changes operational mount connection settings (serial or network selection, address, port).
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_set_connection_para request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_set_connection_para
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/ScopeSetConnectionParaParams.yaml
      description: Connection parameters.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x71700 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
