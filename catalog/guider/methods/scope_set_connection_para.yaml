  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
- code: 107
  trigger: params (after unwrapping) is not an object
  label: expected object param
- code: 209
  trigger: 'No usable member: integer slot is -1 and both strings are empty'
  label: invalid value
- code: 207
  trigger: Mount setter failed (including a failed address set while connected)
  label: fail to operate
- code: 300
