kind: method
name: scope_set_target_pierside
summary: Set the target pier side; the supplied scope implementations always reject it.
description: 'Despite the set_ name the handler is established as a PURE GETTER with no hardware or shared-state
  write: a disconnected mount gives 315, a non-string parameter gives 105, and otherwise the supplied
  scope types reject with 210. No accepted pier-side labels exist in these builds, and the declared list/current-selection
  and integer-0 reply paths are not produced. Via the imager command port (4700) the request reaches this
  handler only as a forwarded unknown method; see the control service for the relay.'
grade: PURE GETTER / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: A
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x71250 (64-bit build)
side_effects: None in the supplied scope types.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_set_target_pierside request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_set_target_pierside
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider command table
    params:
      $ref: ../schemas/ScopeSetTargetPiersideParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x71250 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 105
  trigger: Parameter is not a string
  label: expected string param
- code: 210
  trigger: Setter failure mapped to not supported (all supplied scope types)
  label: not supported
- code: 315
  trigger: No mount connected
  label: mount is not connected
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
examples:
- name: request
  summary: Example request (values invented)
  of: request
  payload:
    id: 44
    method: scope_set_target_pierside
    params: east
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_set_target_pierside
    result: 0
    code: 0
    id: 44
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: scope_set_target_pierside
    error: not supported
    code: 210
    id: 45
see_also:
