kind: method
name: scope_get_cap
summary: List the capabilities reported by the connected mount driver.
description: Calls the scope's capability test slots and returns the names of the supported ones. No hardware
  write is seen in the handler, but the virtual target set and its effect closure are not fully bounded,
  hence tier D. Driver-specific members and errors are unresolved. Params are not consumed.
grade: PURE GETTER / probable (native handler, 64-bit build)
side_effect_tier: D
confidence: READ
basis: static analysis of firmware 9.31, handler @0x78ae0 (64-bit build)
side_effects: No direct hardware write in the handler; the virtual capability slots' full callee effects
  are not proved.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: scope_get_cap request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: scope_get_cap
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x78ae0 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: scope_get_cap reply_success
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        $ref: ../schemas/ScopeGetCapResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler 0x78ae0 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
