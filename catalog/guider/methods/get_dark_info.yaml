kind: method
name: get_dark_info
summary: List dark-frame files with their camera and gain metadata.
description: Params are not consumed. Enumerates the dark-image directory, reads FITS axes and keywords
  from each file, and returns an array of metadata objects. The enumeration logs a diagnostic after the
  directory opens. Further error paths forward a thread-local code and are not enumerated. The method
  is registered in the guider command table (TCP 4400); a request that reaches the main imager and is
  relayed to the guider is a separate route with its own side effects, outside this entry's tier.
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: D
confidence: READ
basis: static analysis of firmware 9.31, guider handler @0x83770 (64-bit build)
side_effects: Diagnostic logging during enumeration; filesystem reads and FITS-library effects are not
  fully bounded.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_dark_info request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_dark_info
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, guider handler @0x83770 (64-bit build)
reply_success:
  title: get_dark_info success reply
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        $ref: ../schemas/GetDarkInfoResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, guider handler @0x83770 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request is not an object, is an empty object, or has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: no method of type string (a non-string method counts as missing)'
  label: invalid request
- code: 101
  trigger: 'Dispatcher: text fails to parse'
  label: 'invalid JSON request: <reason> on line <n> ...'
- code: 103
  trigger: 'Dispatcher: unregistered method'
  label: method not found
errors_note: Forwarded native or driver codes are not exhausted by this table.
examples:
- name: request
  of: request
  payload:
    id: 10
    method: get_dark_info
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_dark_info
    result:
    - camera: Example camera
      gain: 100
      file_name: dark_001.fits
    code: 0
    id: 10
see_also:
