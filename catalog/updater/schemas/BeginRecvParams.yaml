$schema: https://json-schema.org/draft/2020-12/schema
title: begin_recv params
description: The upload descriptor as an object, or a one-element array whose element is that object
  (the app sends the array form). Missing params give 107; a missing or mistyped member gives 1.
anyOf:
- $ref: '#/$defs/Descriptor'
- type: array
  minItems: 1
  prefixItems:
  - $ref: '#/$defs/Descriptor'
x-confidence: READ
x-basis: static analysis of firmware 9.31, updater begin_recv @0x26e10 (json_array2obj); app 3.3.2
  DeviceFwFragment.handleVersionEvent
$defs:
  Descriptor:
    type: object
    description: Upload descriptor. All four members are read; a missing or mistyped member gives 1.
    required:
    - file_name
    - run_update
    - file_len
    - md5
    properties:
      file_name:
        type: string
        maxLength: 255
        pattern: ^[A-Za-z0-9_-]+$
        description: Name of the target file in the updater's private directory. It must not begin with
          a dot, contain "..", exceed 255 bytes or contain characters other than letters, digits, "-"
          and "_" (102 otherwise). The app always sends "air".
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, updater begin_recv @0x26e10; app 3.3.2 DeviceFwFragment.handleVersionEvent
      run_update:
        type:
        - integer
        - boolean
        description: Firmware 9.31 reads it as an integer (nonzero is true); acceptance of a JSON boolean
          by that read is INFERRED. Firmware 9.75 (64-bit build) accepts only the JSON literals true and
          false; a numeric 1 is not accepted and the flag stays false. The app always sends JSON true.
          True selects the legacy update package directory and the legacy update lock; that it gates
          installation after a complete receive is INFERRED.
        x-confidence: READ (firmware 9.75 literal read, integer read in 9.31); INFERRED (9.31 boolean acceptance, effect)
        x-basis: static analysis of firmware 9.31, updater begin_recv @0x26e10; app 3.3.2 DeviceFwFragment.handleVersionEvent
      file_len:
        type: integer
        minimum: 0
        description: Firmware 9.75 accepts only a JSON integer (a float or the string 123.0 is ignored and the
          value stays 0, and 0 gives error 1). Integer copied into the receive record; the app sends the byte length of the file it
          then streams on TCP 4361. That the device uses it as the expected byte count is INFERRED.
        x-confidence: READ (integer read, app emitter); INFERRED (device use)
        x-basis: static analysis of firmware 9.31, updater begin_recv @0x26e10 and prepareRecv @0x28840;
          app 3.3.2 DeviceFwFragment.handleVersionEvent
      md5:
        type: string
        description: MD5 digest of the file as a hex string (32 characters). After the transfer the updater
          compares the received file's MD5 with it; a mismatch gives the Receive state "md5 verify_fail".
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, updater begin_recv @0x26e10 and networkThread @0xf150;
          app 3.3.2 DeviceFwFragment.handleVersionEvent
