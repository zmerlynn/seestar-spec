title: popen params
description: The shell command, as an object {cmd} or a one-element array [cmd] (further elements ignored).
  `cmd` is required and must be a string (an empty string passes the type check); absent, null, scalar,
  or wrong-typed cmd gives 105. No command allow-list, sanitisation, length limit, timeout or argument
  key exists.
oneOf:
- type: object
  required:
  - cmd
  properties:
    cmd:
      type: string
      description: Command line passed to the host's popen in read mode.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe4fc0, run_popen @0x6d7500 (64-bit build)
- type: array
  minItems: 1
  items:
    type: string
  description: '[cmd].'
x-confidence: READ
x-basis: static analysis of firmware 9.31, handler @0xe4fc0, run_popen @0x6d7500 (64-bit build)
