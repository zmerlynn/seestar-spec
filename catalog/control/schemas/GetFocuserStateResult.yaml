title: get_focuser_state result
type: object
required:
- state
properties:
  state:
    type: string
    enum:
    - close
    - moving
    - idle
    description: 'Focuser state: close when the focuser is not open; moving when the motion poll
      succeeds and reports motion; otherwise idle (a motion-poll failure silently maps to idle).'
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xbf800 (64-bit build)
  name:
    type: string
    description: 'Focuser name; present only when the focuser is open and the property query
      succeeds. Observed constant in the code: a GPIO EAF name string.'
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xbf800 (64-bit build)
  id:
    type: integer
    description: 'Focuser id (0 in the inspected path); present only when open and the property
      query succeeds.'
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xbf800 (64-bit build)
  max_step_range:
    type: integer
    description: 'UI maximum step; present only when open and the property query succeeds.'
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xbf800 (64-bit build)
x-confidence: READ
x-basis: static analysis of firmware 9.31, handler @0xbf800 (64-bit build)
