title: pi_output_set2 params
type: object
description: 'Object only; no positional wrapper. Each member is an object keyed by output name. Names
  are matched by case-sensitive substring, in order: port, dslr, beep, wide_heater, heater (heater is
  redirected to wide_heater when the device process type is 2). port<N> takes the first run of decimal
  digits as a zero-based port index. There is no gpio<N> fallback in this method. A member that is not
  an object fails with 107 even if its name is unrecognised; unrecognised names are otherwise ignored.
  An empty object succeeds.'
