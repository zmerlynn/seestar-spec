title: pi_station_remove params
description: 'Station-network profile to remove. Three equivalent spellings: an object with ssid, an array
  whose first element is the SSID string, or the bare SSID string.'
oneOf:
- type: object
  required:
  - ssid
  properties:
    ssid:
      type: string
      description: SSID of the saved station-mode network profile to remove. Must be non-empty (an empty
        string is rejected with 217). Matching is exact and case-sensitive. The remove command line has
        a 255-byte limit; the SSID is shell-escaped. No other length or character validation.
      minLength: 1
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcda90 (64-bit build), ns_net::pi_station_remove
        @0x6fc9d0 and its remove script
- type: array
  minItems: 1
  items:
    type: string
    description: First element is the SSID; further elements are ignored (selected by json_array2obj with
      key ssid).
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xcda90 (64-bit build)
- type: string
  description: Bare SSID string, accepted as the scalar form.
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, handler @0xcda90 (64-bit build)
x-confidence: READ
x-basis: static analysis of firmware 9.31, handler @0xcda90 (64-bit build), json_array2obj @0x6fa450
