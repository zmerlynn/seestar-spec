    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  timelapse:
    type: object
    description: Timelapse settings.
    properties:
      solar_sys:
        type: object
        description: Solar-system timelapse config.
        properties:
          delay_sec:
