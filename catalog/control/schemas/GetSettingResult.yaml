        properties:
          src_dura_min:
            type: integer
            description: Source duration in minutes, unscaled.
            x-confidence: READ
            x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit
              build); unit confirmed by StartWriteAvi @0x2eb8f0, which prints this same saved value
              unscaled under a debug format string naming it "durMinutes"
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  wide_cross_offset:
    type: array
    description: 'Wide camera only: [x, y] sensor pixels (INFERRED).'
    prefixItems:
    - type: integer
    - type: integer
    minItems: 2
    maxItems: 2
    x-confidence: READ; unit INFERRED
