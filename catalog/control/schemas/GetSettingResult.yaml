      angle:
        type: number
        description: Degrees (INFERRED).
        x-confidence: READ; unit INFERRED
        x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build);
          32-bit GetSetting @0x7f420 builds and streams this field the same way
      estimated_hours:
        type: number
        description: Hours (INFERRED). Estimate for one round of the live planner's centers, not a timeout.
        x-confidence: READ; unit INFERRED
        x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build),
          where the value is a stack float widened to double with no scaling before being streamed under
          the key string. 32-bit GetSetting @0x7f420 does the same float-to-double widen, same key, same
          field order, confirmed via the literal-pool loads feeding the key-string constructor
      star_map_angle:
        type: number
        description: Degrees (INFERRED).
        x-confidence: READ; unit INFERRED
        x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build),
          unscaled float-to-double widen before streaming; 32-bit GetSetting @0x7f420 matches (same widen,
          key and field order)
      star_map_ratio:
        type: number
        description: Dimensionless (INFERRED).
        x-confidence: READ; unit INFERRED
        x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build),
          unscaled float-to-double widen before streaming; 32-bit GetSetting @0x7f420 matches (same widen,
          key and field order)
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build); the
      mosaic field-emission block (scale, angle, estimated_hours, star_map_angle, star_map_ratio, in that
