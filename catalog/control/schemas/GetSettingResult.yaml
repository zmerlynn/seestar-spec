    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  password:
    type: string
    description: Connection password in clear. Treat as sensitive; not redacted or enc1 encoded by the device. Firmware 9.75 omits it when get_setting is sent with include_sensitive false.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  connect_lock:
    type: boolean
    description: Connection-lock flag.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  preview:
    type: object
    description: Preview settings.
    properties:
      rtsp_quality:
        type: string
        description: 'Preview stream quality. The getter maps the enum: 0 Smooth, 1 HighQuality; any other
          value yields the literal string unknown.'
        enum:
        - Smooth
        - HighQuality
        - unknown
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600, getPreviewRtspQualityName
          @0x2e7470 (64-bit build)
      image_transfer_mode:
        type: string
        description: 'Image transfer mode. The getter maps the enum: 0 Jpg, 1 Raw; any other value yields
          the literal string unknown. Built-in default Raw, overridden by the stored config. Governs 4800/4804
          image encoding (READ); no effect on RTSP (INFERRED).'
        enum:
        - Jpg
        - Raw
        - unknown
        x-confidence: READ; RTSP effect INFERRED
        x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600, getImageTransferModeName
          @0x2e7500 (64-bit build); shouldTransferJpg (mode 0), name table, config loader (finding
      raw_bin2:
        type: boolean
        description: 'Firmware 9.75: binned raw preview option. Emitted whenever the preview object is emitted, in either process, after image_transfer_mode and before rtsp_width. Not present in firmware 9.31.'
        x-confidence: READ; meaning INFERRED
        x-basis: static analysis of firmware 9.75, resolver reports, GetSetting (64-bit build)
      rtsp_width:
        type: integer
        description: Preview stream width (smaller dimension), pixels INFERRED; present only if the size
          calculation succeeds.
        minimum: 0
        x-confidence: READ; unit INFERRED
        x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
      rtsp_height:
        type: integer
        description: Preview stream height (larger dimension), pixels INFERRED; present only if the size
          calculation succeeds.
        minimum: 0
        x-confidence: READ; unit INFERRED
