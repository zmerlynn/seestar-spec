      firmware 9.31. The firmware applies no index-to-resolution enum; the mapping is device/app defined
      and not established here.'
    x-confidence: READ; never emitted in 9.31 (capability stub)
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600, CanSetRecRes stub
      @0x14fca0 (64-bit) / @0xd4400 (32-bit) both return 0, value from GetRtmpSetting()+0x40 (64-bit build)
  ap_changed:
