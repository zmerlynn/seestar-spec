  light_brightness:
    type: integer
    description: LED brightness. Full output, or when the key is selected in a filtered Setting event;
      setter accepts 0, 50, 100. Absent on the 32-bit build.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  remote_joined:
    type: boolean
    description: Full formatter only.
    x-confidence: READ
