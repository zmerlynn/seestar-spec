title: get_setting result
type: object
description: 'Settings object. Open: members are conditional on process type, camera, capability and helper
  success, and a few are D64-only. Unselected or failed members are omitted. Duplicate keys (beep_volume,
  ae_bri_percent, effect_offset_deg) can occur in the serialized text; consumers must tolerate them. The
  key rtsp_roi_index appears only in filtered Setting events, never here. Firmware 9.75 adds
  annotation (object), sky_replay, can_encrypt, comet_max_frame_num, enable_dark_library, motion_monitor
  (object), preview.raw_bin2, exp_ms.more_exposure, stack.startrails_duration_min and stack.startrail_mode;
  see the members. Several of them are gated by process type or by the wide camera. The 32-bit build
  was not compared member by member (it has no motion monitor).'
properties:
  calib_location:
    type: integer
    description: 'Full non-P2 output only. Location-calibration source (the persisted test setting calibrate_location):
      1 ordinary location-offset calibration, 2 offset derived from three-point polar alignment; other
      values (0) mean no calibration offset is applied. The location-offset routines only read it as a
      mode gate (ordinary path requires 1, the three-point path requires 2). It is held in the S_TEST_SETTING
      struct and persisted as an integer under config key setting2/imager/test/calibrate_location by the
      test-setting serializer. set_setting and set_test_setting do not assign it, and no runtime routine
      that assigns 1 or 2 to the in-memory field was located by static reading; how it comes to be set
      remains unresolved.'
    x-confidence: READ (1, 2; persisted key; read-as-gate); off meaning INFERRED; runtime writer unresolved
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600, PrintClibLoc @0xafcd0,
      GetCalibLocatOffset @0x160fe0 (==1, else 210), GetCalibLocatOffset3PPA @0x160ea0 and SetCalibLocatOffset3PPA
      @0x160f30 (==2), test-setting serializer SetTestSetting @0x11fef0 writing config key setting2/imager/test/calibrate_location
      via SettingConfig::Write, only string xref (64-bit build)
  effect_offset_deg:
    type: array
    description: Full non-P2 output only. Pair of numbers. The key can appear twice in one reply (ordinary
      pair, then 3PPA pair); the two pairs may differ. JSON object parsers that keep only one occurrence
      will lose one of them.
    prefixItems:
    - type: number
    - type: number
    minItems: 2
    maxItems: 2
    x-confidence: READ; unit INFERRED
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  offset_deg:
    type: array
    description: Full non-P2 output only. Ordinary calibration offset pair, present when both components
      differ from the -999 sentinel.
    prefixItems:
    - type: number
    - type: number
    minItems: 2
    maxItems: 2
    x-confidence: READ; unit INFERRED
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  offset_deg_3ppa:
    type: array
    description: Full non-P2 output only. Three-point polar alignment offset pair, present when both components
      differ from the -999 sentinel.
    prefixItems:
    - type: number
    - type: number
    minItems: 2
    maxItems: 2
    x-confidence: READ; unit INFERRED
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  center_xy:
    type: array
    description: Full non-P2 output only. Autofocus centre [x, y] in display pixels (unit INFERRED); present
      only if the query succeeds.
    prefixItems:
    - type: integer
    - type: integer
    minItems: 2
    maxItems: 2
    x-confidence: READ; unit INFERRED
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  temp_unit:
    type: string
    description: Full non-P2 output only. Temperature unit.
    enum:
    - C
    - F
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  beep_volume:
    type: string
    description: 'Full non-P2 output only. Beep volume name. The key is emitted twice on full non-P2 output.
      The getter maps the stored volume via a code-name table: 0 close, 60 backyard, 90 field; any other
      value yields the literal string unknown. Setter accepts close, backyard, field (mapping to 0, 60,
      90).'
    enum:
    - close
    - backyard
    - field
    - unknown
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600, GPIOController::GetBeepVolume
      @0x324cc0, get_code_name @0x6d6790, p_volume_name table @0xaadae8, default p_str_unknown (64-bit
      build)
  lang:
    type: string
    description: 'Full non-P2 output only. Language code. The getter maps the stored id via a code-name
      table: 0 zh, 1 en, 2 fr, 3 ja, 4 ko; any other id yields the literal string unknown.'
    enum:
    - zh
    - en
    - fr
    - ja
    - ko
    - unknown
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600, GetLang @0x122fc0,
      get_lang_name @0x6e10c0, lang name table @0xae94c8, default p_str_unknown (64-bit build)
  stack_lenhance:
    type: boolean
    description: Full non-P2 output only. True when the filter wheel position is 2.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  heater_enable:
    type: boolean
    description: Full non-P2 output only. Present only if the heater GPIO read succeeds.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  expt_heater_enable:
    type: boolean
    description: Full non-P2 output only. Exposure-heater flag (setter key is expt_set_heater_enable).
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  auto_power_off:
    type: boolean
    description: Full non-P2 output only. Test setting.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  auto_af:
    type: boolean
    description: Full non-P2 output only. Test setting.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  frame_calib:
    type: boolean
    description: Full non-P2 output only. Test setting, not persisted, starts false. While true, dark,
      bias and flat calibration is applied in place to each frame read for viewing, exposure or stacking.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600, set_setting @0xedf40,
      CalibImage @0x3ba090, img_cam_mipi::ReadCamImg @0x1593c0 (64-bit build)
  wide_cam:
    type: boolean
    description: Full non-P2 output only. Whether this camera is the wide camera; present only if camera
      info query succeeds.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  stack_after_goto:
    type: boolean
    description: Full non-P2 output only. Stack setting.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  wide_4k:
    type: boolean
    description: Full non-P2 output only. Test setting. 64-bit build only.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  main_8k:
    type: boolean
    description: Full non-P2 output only. Test setting. 64-bit build only.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  guest_mode:
    type: boolean
    description: Full non-P2 output only. Server guest-mode state.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  user_stack_sim:
    type: boolean
    description: Full non-P2 output only. Stack setting.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  auto_master_dark:
    type: boolean
    description: 'Full non-P2 output only. Stack setting, persisted. Only on S30 Plus-class, S30 Pro,
      S50 Pro and S80 (the can_dark_correction models): with expert_mode also on, stack start ensures
      a master dark for the stack exposure; with stack.wide_denoise on, the master dark is subtracted
      during frame calibration. No effect on the S50, which always ensures a master dark at stack start.
      Changing it clears the live stack. Frame calibration itself runs only while frame_calib is on.'
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600, ShouldMinusDark
      @0x195420, NeedInitAutoMasterDarkForDesignatedModel @0x195470, SkipInitAutoMasterDarkForDesignatedModel
      @0x1954e0, InitialiseFunc @0x3c0000, CalibImage @0x3ba090, IsStackMoved @0x1941b0 (64-bit build)
  usb_en_eth:
    type: boolean
    description: Full non-P2 output only. Storage hotplug flag.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  dark_mode:
    type: boolean
    description: Full non-P2 output only. Dark mode flag.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  plan_target_af:
    type: boolean
    description: Full non-P2 output only. Focus setting.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xf23c0, GetSetting @0xea600 (64-bit build)
  viewplan_gohome:
    type: boolean
    description: Full non-P2 output only. Test setting.
    x-confidence: READ
