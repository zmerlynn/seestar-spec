title: set_view_plan_wide_setting params
type: object
description: 'Object required (an array is not accepted). Unknown members are ignored. The four optional
  members form one group: either all absent (the held value is kept) or all four supplied. Integer members
  use signed 32-bit storage; acceptance of larger integer tokens is unresolved.'
required:
- capt_type
- wide_size_index
dependentRequired:
  scene_separate:
  - scene_separate
  - scene_shooting_duration_min
  - exp_ms
  - auto_exp_enable
  scene_shooting_duration_min:
  - scene_separate
  - scene_shooting_duration_min
  - exp_ms
  - auto_exp_enable
  exp_ms:
  - scene_separate
  - scene_shooting_duration_min
  - exp_ms
  - auto_exp_enable
  auto_exp_enable:
  - scene_separate
  - scene_shooting_duration_min
  - exp_ms
  - auto_exp_enable
properties:
  capt_type:
    type: integer
    enum:
    - 0
    - 4
    - 5
    description: Capture type of the wide-camera plan. Other integers are rejected with 209; a missing
      or non-integer value with 104. The meaning of each value is not established.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xdf0c0, SetViewPlanStackSetting @0x1a0ce0, SetStackSetting
      @0x19b230 (64-bit build only)
  wide_size_index:
    type: integer
    minimum: 0
    maximum: 3
    description: Wide-camera frame size index. Outside 0..3 is rejected with 204; missing or non-integer
      with 104.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xdf0c0, SetViewPlanStackSetting @0x1a0ce0, SetStackSetting
      @0x19b230 (64-bit build only)
  scene_separate:
    type:
    - boolean
    - integer
    description: Optional group member. Integer 0 is false, nonzero true; a wrong type is rejected with
      106. Meaning inferred from the key name only.
    x-required-when: any other member of the optional group is present
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xdf0c0, SetViewPlanStackSetting @0x1a0ce0, SetStackSetting
      @0x19b230 (64-bit build only)
  scene_shooting_duration_min:
    type: integer
    minimum: 1
    description: Optional group member, minutes (unit INFERRED). Below 1 is rejected with 204; no upper
      bound in the handler.
    x-required-when: any other member of the optional group is present
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xdf0c0, SetViewPlanStackSetting @0x1a0ce0, SetStackSetting
      @0x19b230 (64-bit build only); unit INFERRED from key and storage naming
  exp_ms:
    type: integer
    minimum: 1
    description: 'Optional group member, milliseconds (unit INFERRED). Below 1 is rejected with 204. Acceptance
      does not mean the value is retained: a changed exposure goes through state-dependent normalisation
      (on the inspected wide-camera path the allowed set is 10000, 20000, 30000 and 60000 ms and any other
      value becomes 10000; other routes differ), so a code-0 reply does not prove the requested exposure
      was kept.'
    x-required-when: any other member of the optional group is present
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xdf0c0, SetViewPlanStackSetting @0x1a0ce0, SetStackSetting
      @0x19b230 (64-bit build only); unit INFERRED from key and storage naming
  auto_exp_enable:
    type:
    - boolean
    - integer
    description: Optional group member. Integer 0 is false, nonzero true; a wrong type is rejected with
      106.
    x-required-when: any other member of the optional group is present
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xdf0c0, SetViewPlanStackSetting @0x1a0ce0, SetStackSetting
      @0x19b230 (64-bit build only)
x-confidence: READ
x-basis: static analysis of firmware 9.31, handler @0xdf0c0, SetViewPlanStackSetting @0x1a0ce0, SetStackSetting
  @0x19b230 (64-bit build only)
