title: set_wifi_country params
description: 'Wi-Fi regulatory country code. Three spellings: a bare string, a one-element array holding
  a string, or an object with country.'
oneOf:
- type: string
  description: Bare country code string.
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, handler @0xcdd70, ns_net::set_wifi_country @0x6fc4c0 (64-bit
    build)
- type: array
  minItems: 1
  items:
    type: string
    description: First element is the country code; further elements are ignored.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xcdd70, ns_net::set_wifi_country @0x6fc4c0 (64-bit
      build)
- type: object
  required:
  - country
  properties:
    country:
      type: string
      description: Country code text. No enumeration, minimum length, maximum length or case check; the
        text is placed unquoted in a 255-byte shell command line (truncation possible), and validation is
        left to the wireless driver, whose result is not reported. An empty string resets to the factory
        default. Clients MUST send only an uppercase ISO 3166-1 alpha-2 code and no whitespace or shell
        metacharacters.
      x-confidence: READ; shell effects INFERRED
      x-basis: static analysis of firmware 9.31, handler @0xcdd70, ns_net::set_wifi_country @0x6fc4c0
        (64-bit build)
x-confidence: READ
x-basis: static analysis of firmware 9.31, handler @0xcdd70, ns_net::set_wifi_country @0x6fc4c0 (64-bit
  build)
