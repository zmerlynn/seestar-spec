        - type: number
        minItems: 2
        maxItems: 2
        x-confidence: READ; units unresolved
        x-basis: static analysis of firmware 9.31, handler @0xc4d90 (64-bit build)
      target_ra_dec:
        type: array
        description: '[number, number]; units unresolved.'
        prefixItems:
