title: set_setting params
type: object
description: 'All members optional; omitted means unchanged. Members are processed in input order
  (INFERRED); the first checked failure stops later members with no rollback. Unknown top-level keys
  give 109 (except the wide_cross_offset substring family). An empty object succeeds with 0.
  Wrong-typed members are either ignored or rejected as listed. Setting names also exist in
  get_setting output but the getter names heater_enable and expt_heater_enable are not setter
  aliases. Firmware 9.75, app 3.4.0 adds the top-level keys sky_replay, annotation (object),
  enable_dark_library, can_encrypt and motion_monitor, the preview member raw_bin2,
  exp_ms.more_exposure and the stack members startrail_mode and startrails_duration_min (nested, not
  top-level), and removes expert_mode (it now gives 109 as an unknown key). annotation and
  sky_replay sent in the same request as wide_cam give 102. An unknown name inside the annotation
  object gives 109; unknown members inside exp_ms and stack are ignored. Handling of unknown members
  inside the nested preview object is unresolved. The temperature-dark library notes are in
  calibration-frames.md; reset_setting resets a subset of the keys.'
properties:
  wide_cam:
    type:
    - boolean
    - integer
    description: 'Routing gate: true in process type 1 forwards the whole original request to the peer
      and exits locally. Otherwise ignored. Boolean or integer (nonzero is true).'
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  temp_unit:
    type: string
    description: C or F. Other string 102; other type 109.
    enum:
    - C
    - F
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  beep_volume:
    type: string
    description: close, backyard, field (0, 60, 90). Any other string is not rejected and maps to 81.
      Other type 109. Helper failure 207.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  lang:
    type: string
    description: zh, en, fr, ja, ko, ASCII case-insensitive. Unknown 210; nonstring 109. Process type
      1 forwards the request after the local change.
    enum:
    - zh
    - en
    - fr
    - ja
    - ko
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  beep_sec:
    type: integer
    description: Beep length, seconds (INFERRED). Noninteger 109; no limit.
    x-confidence: READ; unit INFERRED
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  offset_deg_3ppa:
    type: array
    description: '[lon, lat] in degrees (INFERRED); neither may be within 0.1 of -999 and the calibration
      mode must be 2, otherwise failure (207 when the internal code is zero). Missing or non-numeric component
      108; nonarray 109.'
    prefixItems:
    - type: number
    - type: number
    minItems: 2
    x-confidence: READ; unit INFERRED
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  stack_lenhance:
    type:
    - boolean
    - integer
    description: Invalid type ignored. Wheel busy 203; wheel unavailable 318. Boolean or integer (nonzero
      is true). True moves the filter wheel to slot 2 (LP), false to slot 1 (IRCUT); the move is asynchronous,
      is not restored, and nothing else is stored.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (SetWheelPosition at 0xee434-0xee450)
      (64-bit build)
  center_xy:
    type: array
    description: '[x, y] display pixels (INFERRED); both integers required, else 104; nonarray 102.'
