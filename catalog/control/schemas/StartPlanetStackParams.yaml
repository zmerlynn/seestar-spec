      key literal @0x944b18 (64-bit build)
  rect:
    type: array
    description: Region of interest as four integers [x, y, width, height]; all four required if rect
      is given, extra elements ignored, no range check. A null or non-array rect gives 102. Integers are
      signed 32-bit.
    minItems: 4
    items:
      type: integer
    x-default: absent; all four values -1 (no region)
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, start_planet_stack @0xe2120, key literal @0x730188 (64-bit
      build)
