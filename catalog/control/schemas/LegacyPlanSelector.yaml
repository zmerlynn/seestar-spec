title: legacy plan selector
type: object
description: Optional plan_id, target_id, seq_id, each a JSON integer narrowed to signed 32 bits; absent
  means unspecified (internal sentinel INT_MIN, -2147483648). Unknown keys and keys of any other type
  are ignored. No range check. A target_id requires plan_id and a seq_id requires target_id (dependency
  checked by the operation, not the parser).
properties:
  plan_id:
    type: integer
    minimum: -2147483648
    maximum: 2147483647
    x-default: unspecified (internal sentinel -2147483648)
    description: Legacy plan id.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, parse_id @0xab7f0 (64-bit build); key literals in the handler
      constant pool
  target_id:
    type: integer
    minimum: -2147483648
    maximum: 2147483647
    x-default: unspecified (internal sentinel -2147483648)
    description: Target id within the plan; requires plan_id.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, parse_id @0xab7f0 (64-bit build); key literals in the handler
      constant pool
  seq_id:
    type: integer
    minimum: -2147483648
    maximum: 2147483647
    x-default: unspecified (internal sentinel -2147483648)
    description: Sequence id within the target; requires target_id.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, parse_id @0xab7f0 (64-bit build); key literals in the handler
      constant pool
