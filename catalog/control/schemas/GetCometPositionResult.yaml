title: get_comet_position result
type: array
minItems: 1
description: Non-empty list of comet records from the supplied ephemeris script. An empty or unmatched
  result is an error (207), never an empty array.
items:
  type: object
  required:
  - id
  - name
  - mag
  - ra
  - dec
  - size
  description: One comet. All six members are always present together.
  properties:
    id:
      type: integer
      description: Zero-based ordinal of successfully parsed comet records, counting records later removed
        by the name filter. Comment and malformed lines do not advance it. Not a line number or stable
        catalog identifier. The 32-bit build matches (READ).
      minimum: 0
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb3680, GetCometData @0x13a3b0 (64-bit build),
        GetCometData @0xbf02c (32-bit build, same parse and counter)
    name:
      type: string
      description: Comet name.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb3680, GetCometData @0x13a3b0 (64-bit build)
    mag:
      type: number
      description: Magnitude (INFERRED dimensionless), a strtod value from the script output.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb3680, GetCometData @0x13a3b0 (64-bit build)
    ra:
      type: number
      description: Right ascension parsed from an HMS string. INFERRED hours (h+m/60+s/3600). Apparent
        topocentric coordinate of date for the saved site at the current time, not J2000 (INFERRED from the
        ephemeris library the device uses); a client that needs J2000 MUST convert.
      x-confidence: READ (pipeline); INFERRED (unit and epoch)
      x-basis: static analysis of firmware 9.31, handler @0xb3680, GetCometData @0x13a3b0 (64-bit build); packaged
        comet ephemeris script (identical in both builds)
    dec:
      type: number
      description: Declination parsed from a DMS string. INFERRED degrees. Apparent topocentric coordinate
        of date, not J2000 (INFERRED, as for ra).
      x-confidence: READ (pipeline); INFERRED (unit and epoch)
      x-basis: static analysis of firmware 9.31, handler @0xb3680, GetCometData @0x13a3b0 (64-bit build); packaged
        comet ephemeris script (identical in both builds)
    size:
      type: number
      description: Apparent diameter in arcseconds, a strtod value from the script output (INFERRED from the
        ephemeris library the device uses).
      x-confidence: INFERRED
      x-basis: static analysis of firmware 9.31, handler @0xb3680, GetCometData @0x13a3b0 (64-bit build); packaged
        comet ephemeris script (identical in both builds)
x-confidence: READ
x-basis: static analysis of firmware 9.31, handler @0xb3680, GetCometData @0x13a3b0 (64-bit build)
