  startrail_mode:
    type: integer
    minimum: 0
    maximum: 2
    description: 'Firmware 9.75, app 3.4.0: star-trail output mode, 0 maximum-image video, 1 decay video, 2
      both. Non-integer 104; wide camera only (210 otherwise); a value above 2 or a negative value gives
      209. No running-stack check: a change clears the stack. The video is written only when save_video
      is true. Persisted as stack.startrail_mode. Not in firmware 9.31; no 32-bit counterpart string found
      (string-level only).'
    x-confidence: READ
    x-basis: static analysis of firmware 9.75, app 3.4.0, resolver report E, set_setting handler @0x10c238,
