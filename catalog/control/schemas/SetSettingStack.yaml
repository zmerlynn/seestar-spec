  capt_type:
    type: string
    description: stack, cont_capt, photometry, startrails, timelapse. Nonstring 105; unknown string is
      silently ignored (and skips the cont_capt fallback); a recognised type not allowed for the camera
      gives 209; 259 while stacking; 536 during a view plan. Wide camera allows ids 0, 4, 5.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  cont_capt:
