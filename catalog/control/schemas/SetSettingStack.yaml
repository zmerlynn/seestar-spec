type: object
description: 'Applied in D64 order: adjustment/dbe_enable, dbe, star_correction, drizzle2x, wide_denoise,
  wide_size_index, scene_separate, scene_shooting_duration_min, capt_type (cont_capt only if capt_type
  absent), capt_num, save_*, goto, move_sleep_sec, light_duration_min, auto_lenhance, airplane_line_removal.
  An empty object is a no-op success. The 32-bit build supports a reduced member set and ignores unknown
  nested keys.'
properties:
  brightness:
    type:
    - integer
    - number
    description: Image adjustment. brightness, contrast and saturation must all be valid to apply the
      adjustment; a partial triple is silently skipped (the internal 108 is not returned).
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  contrast:
    type:
    - integer
    - number
    description: See brightness.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  saturation:
    type:
    - integer
    - number
    description: See brightness.
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  dbe_enable:
    type:
    - boolean
    - integer
    description: Applied with the adjustment triple only; default false. Boolean or integer (nonzero is
      true).
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  dbe:
    type:
    - boolean
    - integer
    description: Malformed 106. Queues a Setting event. Boolean or integer (nonzero is true).
    x-confidence: READ
    x-basis: static analysis of firmware 9.31, handler @0xedf40 (64-bit build)
  star_correction:
