title: get_app_setting params
description: 'Optional selector: an array of strings naming the keys to read (intended form, INFERRED
  from the traversal and the companion setter). With no params, no child list, or an empty array or object,
  every stored key is enumerated. In a nonempty list only string children are used and everything else
  is skipped, including object member names; a lone scalar string is not treated as a selector. Behaviour
  for malformed scalar params other than these safe cases is unresolved.'
type:
- array
- object
- 'null'
