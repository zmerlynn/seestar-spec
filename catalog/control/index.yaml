transport:
  stream: TCP port 4700, one bidirectional JSON stream
  notes:
    - Requests, replies and events share the stream; replies are matched by id, events carry Event and no id.
    - Framing is specified in a separate chapter and is out of scope for the pilot.
    - Not JSON-RPC 2.0. Errors are a flat string plus integer code.
envelope:
  request: {$ref: '../common/schemas/RequestEnvelope.yaml'}
  success_reply: {$ref: '../common/schemas/ReplySuccess.yaml'}
  error_reply: {$ref: '../common/schemas/ReplyError.yaml'}
  event: {$ref: '../common/schemas/EventEnvelope.yaml'}
