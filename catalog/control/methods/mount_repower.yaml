kind: method
name: mount_repower
summary: Power-cycle the mount through a fixed sequence of GPIO writes with delays.
description: 'No parameters are read. The handler issues GPIO writes in order: selector 11 low then a
  100 ms sleep, selector 7 low then a 100 ms sleep, selector 7 high. The reply is sent after the sequence
  (at least about 200 ms of requested delay plus GPIO latency). INFERRED: this toggles the power of the
  mount; the selector-to-rail mapping was not audited. There is no parked or mode gate. If a write fails
  the error code of the GPIO layer is forwarded and earlier writes may already have happened.'
grade: MUTATOR / established (64-bit build and 32-bit build, command-socket invocation)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xc8830 (64-bit build); helper MountRepower (64-bit
  build). Power-toggle interpretation INFERRED
side_effects: Drives GPIO lines in a fixed sequence, probably power-cycling the mount electronics (INFERRED);
  the mount may disconnect or lose position knowledge (INFERRED). Full command-socket calls also incur
  the shared diagnostic (logging) writes; this is why the strict grade is MUTATOR even for the read-only
  calls.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: mount_repower request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: mount_repower
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xc8830 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: A failed GPIO write forwards the GPIO layer error code, which is unresolved (no mount_repower-specific
  code is assigned).
examples:
- name: request
  of: request
  payload:
    id: 29
    method: mount_repower
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: mount_repower
    result: 0
    code: 0
    id: 29
see_also:
- not_move
- can_move
spec:
- spec/control/mount-and-motion/tracking-park-and-state.md#position-and-connection-state
