kind: method
name: get_dither
summary: Read the dither settings, refreshing ra_only from the guider first.
description: 'Queries the guider for its ra_only setting (waiting up to 10 s), overwrites the cached ra_only
  if the guider reply contains the expected compact literal, then returns the whole shared dither settings
  object. A failed or unrecognised guider reply is logged only: the call still succeeds with the cached
  values.'
grade: MUTATOR / established (64-bit build; 32-bit build probable)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xbaf50, GetDitherSettlePara @0x17b720 (64-bit build)
side_effects: Overwrites the cached ra_only value and the guider request/wait bookkeeping; no motion or
  persistent setting change.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_dither request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_dither
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xbaf50 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_dither success reply
  required:
  - method
  - result
  - code
  - id
  properties:
    jsonrpc:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/jsonrpc
    Timestamp:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/Timestamp
    method:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/method
    result:
      $ref: ../schemas/GetDitherResult.yaml
    code:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/code
    id:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/id
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is reachable; a guider failure does not fail the call.
examples:
- name: read
  of: request
  payload:
    id: 31
    method: get_dither
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_dither
    result:
      enable: true
      ra_only: false
      amount: 5
      settle_timeout_sec: 40
      settle_arcsec: 1.5
      settle_time_sec: 10
      interval: 3
      timeout_stop: false
      wait_guide_settle: true
    code: 0
    id: 31
see_also:
- set_dither
spec:
- spec/guider/guiding.md#imager-dither-settings
