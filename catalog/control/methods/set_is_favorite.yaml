kind: method
name: set_is_favorite
summary: Add or remove image files in the favorites database.
description: Params must be an object with name (string or array of strings) and is_favorite (boolean);
  optional storage selects the storage the names are relative to. The database work is synchronous. A
  success reply has integer result 0; error paths omit result. The app sends name as a string array without
  storage.
grade: MUTATOR / established (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xe1d00, AddImages @0xae600 (64-bit build)
side_effects: Updates the favorites database for the collected full file names. Does not emit an event
  or an image. Database transaction atomicity and file existence validation are unresolved.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_is_favorite request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_is_favorite
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/SetIsFavoriteParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe1d00, AddImages @0xae600 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 102
  trigger: Params not an object, or is_favorite absent or not a boolean
  label: invalid params
- code: 100
  trigger: name absent or neither string nor array
  label: invalid request
- code: 204
  trigger: storage names no known storage (including unrecognized names)
  label: out of limit
- code: 531
  trigger: Adding or removing the favorites fails
  label: operate database fail
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: mark
  of: request
  payload:
    id: 41
    method: set_is_favorite
    params:
      name:
      - Example_001.fit
      is_favorite: true
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_is_favorite
    result: 0
    code: 0
    id: 41
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_is_favorite
    error: operate database fail
    code: 531
    id: 42
see_also: []
spec:
