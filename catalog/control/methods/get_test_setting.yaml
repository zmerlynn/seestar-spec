kind: method
name: get_test_setting
summary: Read the device test/hot settings.
description: Returns the cached test settings. As a side effect it checks access to the solver executables
  (access check only, nothing is run); a missing executable is logged and silently drops new_solve_exec
  from the result while the call still succeeds. No params are read. The 32-bit build matches (READ).
grade: MUTATOR / established (64-bit build; 32-bit build matches (READ))
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xb9500, GetTestSetting @0x11fe50, GetHotSetting @0x120350,
  CheckSolveExec @0x1fb810 (64-bit build); 32-bit handler compared statically (same callees and strings)
side_effects: Copies global settings; the executable check logs when a file is missing and sets the per-request
  error code (not reported). No hardware or setting change.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_test_setting request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_test_setting
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb9500 (64-bit build)
reply_success:
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    title: get_test_setting reply (success)
    properties:
      result:
        $ref: ../schemas/GetTestSettingResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xb9500 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is reachable.
examples:
- name: read
  summary: Bare request
  of: request
  payload:
    id: 52
    method: get_test_setting
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_test_setting
    result:
      autogoto_threshold: 0.5
      auto_open_heater: true
      auto_open_cooler: false
      station_5g: false
      plan_simulate: 0
      goto_simulate: false
      new_solve_exec: true
    code: 0
    id: 52
see_also:
- set_test_setting
spec:
- spec/control/device-state-and-settings.md#app-and-test-settings
