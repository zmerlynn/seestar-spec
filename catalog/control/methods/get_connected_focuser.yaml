kind: method
name: get_connected_focuser
summary: List the focusers in the cached focuser list.
description: No parameters are read. The result is an array copied from the cached focuser list; it does
  not scan, open or move anything. An empty list gives an empty array. There is no path member.
grade: PURE GETTER / probable (64-bit build; 32-bit build probable)
side_effect_tier: A
confidence: READ
basis: static analysis of firmware 9.31, handler @0xd3bd0, GetList @0x15cd20 (64-bit build); tier INFERRED
side_effects: None; the cached list is copied into request-local storage.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_connected_focuser request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_connected_focuser
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xd3bd0 (64-bit build)
reply_success:
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - properties:
      result:
        type: array
        items:
          $ref: ../schemas/GetConnectedFocuserEntry.yaml
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xd3bd0 (64-bit build)
        description: Array of focuser records; empty when none is cached.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xd3bd0 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error branch exists; the dispatcher errors still apply.
examples:
- name: request
  of: request
  payload:
    id: 7
    method: get_connected_focuser
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_connected_focuser
    result:
    - name: Example focuser
      id: 0
    code: 0
    id: 7
- name: ok-empty
  summary: No focuser cached
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_connected_focuser
    result: []
    code: 0
    id: 8
see_also:
- get_focuser_state
- open_focuser
spec:
- spec/control/focus-and-filter.md#lifecycle
