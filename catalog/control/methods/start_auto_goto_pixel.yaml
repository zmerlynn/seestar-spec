kind: method
name: start_auto_goto_pixel
summary: Start the auto-goto worker towards an image pixel target.
description: Same worker as start_auto_goto but stores a pixel target (function 2) and has no View-mode
  gate. The sentinel, horizon and CannotGoto checks of the shared start helper still run first, on the raw
  pixel numbers before any solve; the horizon check on pixel values looks like a firmware quirk (INFERRED),
  so a valid pixel request can be refused with 270. The worker first plate-solves the current live frame,
  hands the {x, y} point to the solver and uses the solved sky position as the goto target. READ. Success
  means the worker thread was started, not that the target was reached. The app 3.3.2 never sends this
  method; its tap-to-centre uses start_func GoPixel (READ, bounded search of app 3.3.2).
grade: MUTATOR / established (D64 and D32 command-socket invocation)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xe74e0, StartAutoGoto @0x16d5b0, AutoGotoFunc pixel branch
  @0x17534c, RetrySolve @0x172500, solved target stored @0x175a38-0x175a54 (64-bit build)
side_effects: Overwrites the global auto-goto parameters, resets goto status, and starts the named goto
  worker (function 2). The horizon check can refresh the cached location before a later error. Every full
  call also makes the shared diagnostic log writes.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: start_auto_goto_pixel request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: start_auto_goto_pixel
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      anyOf:
      - type: object
        required:
        - x
        - y
        properties:
          x:
            type: number
            description: Pixel X coordinate of the target in the full live-camera frame that the worker
              plate-solves (frame INFERRED). Origin, axis direction and accepted range are unresolved.
            x-confidence: INFERRED
            x-basis: static analysis of firmware 9.31, handler @0xe74e0, StartAutoGoto @0x16d5b0 (stored at
              param+152/+160 @0x16d97c), RetrySolve @0x172500 (64-bit build)
          y:
            type: number
            description: Pixel Y coordinate of the target in the full live-camera frame that the worker
              plate-solves (frame INFERRED). Origin, axis direction and accepted range are unresolved.
            x-confidence: INFERRED
            x-basis: static analysis of firmware 9.31, handler @0xe74e0, StartAutoGoto @0x16d5b0 (stored at
              param+152/+160 @0x16d97c), RetrySolve @0x172500 (64-bit build)
      - type: array
        minItems: 2
        prefixItems:
        - type: number
        - type: number
      description: 'Object with two required numeric members, or a positional array of the same two numbers
        in the order given by `required`; extra array elements are ignored. Absent, null, scalar, short
        array, missing or non-numeric member: error 108.'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe74e0, StartAutoGoto @0x16d5b0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 108
  trigger: Params missing, not an object/array of two numbers, or either member not a JSON number
  label: expected float param
- code: 268
  trigger: The goto worker thread is already running
  label: operation is in progress
- code: 209
  trigger: Either coordinate is within 0.1 of the sentinel -999
  label: invalid value
- code: 270
  trigger: Computed target altitude is at or below the horizon
  label: below horizon
- code: 210
  trigger: The target cannot be gone to (CannotGoto check)
  label: not supported
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: If the worker thread cannot be started, the thread-infrastructure error is forwarded; its
  code set is not established. Solve and goto failures arrive later as AutoGoto events (legacy direct
  states start, working, delay, complete, fail, or F states), not as reply codes.
examples:
- name: pixel
  summary: Goto a pixel target (shape per static analysis; values invented)
  of: request
  payload:
    id: 34
    method: start_auto_goto_pixel
    params:
      x: 960
      y: 540
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: start_auto_goto_pixel
    result: 0
    code: 0
    id: 34
- name: already-running
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: start_auto_goto_pixel
    error: operation is in progress
    code: 268
    id: 35
see_also:
- stop_auto_goto
- start_auto_goto
spec:
