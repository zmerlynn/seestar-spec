kind: method
name: set_view_plan_target_name
summary: Set the target name that the device uses for the current view and for autosaved captures.
description: Only on device process type 2. An empty target_name clears the stored view target name. A
  non-empty name is regularised as a filename, stored as the view target info, then copied (name and coordinates)
  to the global autosave settings. The inspected helper does not clear a pending match from iscope_match_target_name.
  The helper's return value is ignored, so no downstream error is reported. Registered in the 64-bit build
  only.
grade: MUTATOR / probable (64-bit build; absent from the 32-bit build)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xdee90, SetViewTargetName @0x3c0fd0 (64-bit build only)
side_effects: Changes the stored view target name and the global autosave target used to name captures.
  No worker is launched. No explicit timeout.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_view_plan_target_name request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_view_plan_target_name
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/SetViewPlanTargetNameParams.yaml
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
