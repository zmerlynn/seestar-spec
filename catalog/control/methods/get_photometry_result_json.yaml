reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 105
  trigger: name missing or not a string
  label: expected string
- code: 102
  trigger: empty or malformed name, header read failure
  label: bad name
- code: 255
  trigger: path not accessible
  label: no access
- code: 258
  trigger: file could not be opened
  label: open failed
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: On the 32-bit build the helpers and strings are present and the behaviour is INFERRED to
  match.
examples:
- name: request
  of: request
  payload:
    id: 91
    method: get_photometry_result_json
    params:
      name: Magnitude_example.csv
  summary: READ shape, not captured; values invented
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_photometry_result_json
    result:
      path: example/MyWorks/PhotoMetry/Magnitude_example.csv
      name: Magnitude_example.csv
      rows:
      - name: T1
        is_variable: false
        measured_magnitude: 12.3
    code: 0
    id: 91
  summary: values invented
