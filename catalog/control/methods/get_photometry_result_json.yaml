  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        type: object
        required:
        - path
        - name
        - rows
        properties:
          path:
            type: string
            description: Path of the file read.
            x-confidence: READ
            x-basis: static analysis of firmware 9.75, handler @0xf7f30 (64-bit build), @0x853bc (32-bit
              build)
          name:
