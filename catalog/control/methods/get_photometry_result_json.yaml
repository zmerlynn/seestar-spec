kind: method
name: get_photometry_result_json
summary: Read a saved photometry CSV as JSON rows (firmware 9.75).
description: New in firmware 9.75, app 3.4.0. Returns the rows of a Magnitude_*.csv file from the MyWorks
  photometry folder of the current image path. This is a different method from get_photometry_result.
  Read only.
grade: PURE GETTER / READ
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.75, handler @0xf7f30 (64-bit build), @0x853bc (32-bit build)
side_effects: None.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_photometry_result_json request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_photometry_result_json
      x-confidence: READ
      x-basis: static analysis of firmware 9.75, dispatcher table
    params:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: 'CSV file name: must start with Magnitude_, end with .csv and contain no slash
            or backslash. Missing or non-string 105; any other violation 102.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.75, handler @0xf7f30 (64-bit build), @0x853bc (32-bit
            build)
      x-confidence: READ
      x-basis: static analysis of firmware 9.75, handler @0xf7f30 (64-bit build), @0x853bc (32-bit build)
reply_success:
