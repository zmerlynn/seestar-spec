kind: method
name: set_app_setting
summary: Store arbitrary typed app-setting values in the device configuration.
description: Writes each member of the supplied object as a configuration entry in the app-setting group,
  typed by the JSON value. The device does not interpret the keys; they are a free store for the client
  app. Configuration write failures are ignored, so a success reply does not prove persistence. Read the
  values back with get_app_setting.
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcb350 (64-bit build); SettingConfig write
side_effects: Persists the supplied values to the settings XML under the app-setting group. Synchronous,
  no timeout.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_app_setting request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_app_setting
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/SetAppSettingParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcb350 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 107
  trigger: params absent, null, an empty array, or not an object
  label: expected object param
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: 'Write return values are ignored: no write-error reply exists. App usage: no app emitter
  was found.'
examples:
- name: store
  summary: Store two values (keys invented)
  of: request
  payload:
    id: 151
    method: set_app_setting
    params:
      example_flag: true
      example_label: north
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_app_setting
    result: 0
    code: 0
    id: 151
- name: no-params
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_app_setting
    error: expected object param
    code: 107
    id: 152
see_also:
- get_app_setting
spec:
- spec/control/device-state-and-settings.md#app-and-test-settings
