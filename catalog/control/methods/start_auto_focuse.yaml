kind: method
name: start_auto_focuse
summary: Start autofocus (method name is spelled start_auto_focuse).
description: 'Local branch reads no parameters. It logs a manual-start message, resets the autofocus
  result and buffers, in RTMP mode may stop an older autofocus thread, then starts the named
  autofocus worker thread or the ViewStar stage 1. The reply means the start was accepted, not that
  focusing finished; progress is reported by AutoFocus events. On wide-camera models in certain view
  modes the original request is forwarded to the peer processor and that reply is not described
  here. Needs an open focuser. Firmware 9.75, app 3.4.0 first checks that the wide camera can run
  autofocus, then uses the relay-only form of the common relay check (it relays to the peer process
  when needed and runs no occupancy probe, so no 203 or 524 comes from it; READ in 64-bit firmware
  9.75) instead of the 9.31 view-mode test, the wire effect is INFERRED and motion detection is
  paused during autofocus.'
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcc350, StartAutoFocus @0x268bb0 (64-bit build); tier
  INFERRED
side_effects: Resets autofocus state and starts an asynchronous autofocus worker, which moves the focuser
  and takes exposures.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: start_auto_focuse request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: start_auto_focuse
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read by the local handler. Clients SHOULD omit it. If the request is forwarded
        to the peer, what the peer reads is unresolved.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcc350 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 318
  trigger: Focuser is not open
  label: device not connected
- code: 268
  trigger: An autofocus thread is already running (outside RTMP mode)
  label: operation is in progress
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Errors from the ViewStar stage start, the named-thread start, or the peer relay are forwarded
  or unresolved; any other thread error code is reported with its table message and zero becomes 207.
examples:
- name: request
  of: request
  payload:
    id: 30
    method: start_auto_focuse
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: start_auto_focuse
    result: 0
    code: 0
    id: 30
- name: closed
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: start_auto_focuse
    error: device not connected
    code: 318
    id: 31
see_also:
- stop_auto_focuse
- open_focuser
- get_focuser_setting
spec:
- spec/control/focus-and-filter.md#autofocus
