kind: method
name: clear_stack
summary: Discard the accumulated stack and cached calibration frame counts.
description: Resets the cached stack and calibration frame counts and the selected calibration buffer,
  and when the current frame type is light clears the current light stack. The calibration image may be
  freed under a mutex. The call does not check whether Stack work is active or a camera is open, so it
  can change a result that is still accumulating. No force, wait or restart flag, file deletion or motor
  movement is established. Locks may block without a timeout. No request parameters are read.
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcad20, ClearStack @0x1926c0 (64-bit build)
side_effects: Clears the in-memory light stack and resets stack and calibration frame counts; may free
  the calibration image buffer.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: clear_stack request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: clear_stack
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcad20, ClearStack @0x1926c0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is reachable.
examples:
- name: clear
  of: request
  payload:
    id: 61
    method: clear_stack
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: clear_stack
    result: 0
    code: 0
    id: 61
see_also:
- start_stack
- stop_stack
- save_stack
- set_stack_type
- clear_batch_stack
spec:
- spec/control/stacking.md#sequence
