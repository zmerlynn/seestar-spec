kind: method
name: get_goto_solve_result
summary: Return the cached result of the last goto plate solve.
description: No params are read. Returns a copy of the stored solve result; it never starts a solve. The
  error reply 215 is returned when nothing is cached, not when the cached state is fail or solving. The
  grade reflects the whole request/reply path, which reaches the shared diagnostic logger; it does not
  by itself mean the method changes device settings.
grade: MUTATOR / established (full command-socket call; shared diagnostic writes; 64-bit and 32-bit builds)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xb8960 (64-bit build)
side_effects: Copies the cached solve JSON; no solve is started and no hardware is queried. Every call
  also performs shared request/reply diagnostic logging.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_goto_solve_result request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_goto_solve_result
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_goto_solve_result reply (success)
  required:
  - method
  - result
  - code
  - id
  properties:
    jsonrpc:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/jsonrpc
    Timestamp:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/Timestamp
    method:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/method
    result:
      type: object
      required:
      - state
      - duration_ms
      properties:
        state:
          type: string
          enum:
          - complete
          - solving
          - fail
          description: complete when both RA and Dec are outside the -999 sentinel band; solving when
            the solver thread is running; otherwise fail.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, FormatSolveRes
        duration_ms:
          type: integer
          description: Solve duration in milliseconds.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, FormatSolveRes
        ra_dec:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: 'State complete only: solved center, RA then Dec (INFERRED); units not established.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, FormatSolveRes
        fov:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: 'State complete only: field of view, width then height, degrees (INFERRED).'
          x-confidence: INFERRED
          x-basis: static analysis of firmware 9.31, FormatSolveRes
        focal_len:
          type: number
          description: 'State complete only: focal length, millimetres (INFERRED).'
          x-confidence: INFERRED
          x-basis: static analysis of firmware 9.31, FormatSolveRes
        angle:
          type: number
          description: 'State complete only: field rotation, degrees (INFERRED).'
          x-confidence: INFERRED
          x-basis: static analysis of firmware 9.31, FormatSolveRes
        image_id:
          type: integer
          description: 'State complete only: id of the solved image.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, FormatSolveRes
        star_number:
          type: integer
          description: Number of stars used; present in any state when the source value is not -1.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, FormatSolveRes
      description: 'Copy of the cached solve result (state, duration and, when complete, the solution).
        Cached: it can be older than the current solver state.'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb8960, FormatSolveRes
    code:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/code
    id:
      $ref: ../../common/schemas/Id.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 215
  trigger: The solve-result cache is empty
  label: no solve data
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: get
  summary: Bare request
  of: request
  payload:
    id: 141
    method: get_goto_solve_result
- name: ok
  summary: Values invented
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_goto_solve_result
    result:
      state: complete
      duration_ms: 2400
      ra_dec:
      - 12
      - 30
      fov:
      - 1
      - 2
      focal_len: 250
      angle: 15
      image_id: 7
      star_number: 120
    code: 0
    id: 141
- name: empty
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_goto_solve_result
    error: no solve data
    code: 215
    id: 142
see_also:
- iscope_start_view
- iscope_get_app_state
spec:
- spec/control/solving-and-annotation.md#plate-solving
