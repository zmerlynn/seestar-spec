kind: method
name: get_find_star_result
summary: Return the cached result of the last completed star-detection run.
description: Takes no parameters. Copies the cached result into the reply; it does not detect or refresh.
  Succeeds only when the cache status is 0, which requires a completed worker run (start_find_star resets
  it to 207 and stop_find_star does not clear it). The getter does not copy the cached status into the
  thread-local error, so a failed cache normally yields 207 rather than the worker status.
grade: PURE GETTER / probable (64-bit build; 32-bit build probable)
side_effect_tier: A
confidence: READ
basis: static analysis of firmware 9.31, handler @0xb7390, GetFindStarResult @0x269120, worker @0x269780
  (64-bit build)
side_effects: None beyond request-local data. No locks or timeout visible; concurrent snapshot consistency
  is unresolved.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_find_star_result request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_find_star_result
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb7390, GetFindStarResult @0x269120, worker
        @0x269780 (64-bit build)
reply_success:
  title: get_find_star_result reply (success)
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        $ref: ../schemas/GetFindStarResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xb7390, GetFindStarResult @0x269120, worker
          @0x269780 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 207
  trigger: Cache status is nonzero (no completed run); the worker status itself is not propagated
  label: fail to operate
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Per-thread error state initialised by other code in the call path could change the reported
  code; unresolved.
examples:
- name: query
  of: request
  payload:
    id: 141
    method: get_find_star_result
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_find_star_result
    result:
      image_id: 12
      stars:
      - pixelx: 512.5
        pixely: 300.25
        radius: 4.5
        hfd: 3.1
      pixelscale_arcsec: 2.4
    code: 0
    id: 141
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_find_star_result
    error: fail to operate
    code: 207
    id: 142
see_also:
- start_find_star
- stop_find_star
spec:
- spec/control/solving-and-annotation.md#find-star
