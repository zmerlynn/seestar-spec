kind: method
name: rm_polar_align_image
summary: Delete both saved polar-alignment WCS image files.
description: Removes the two saved slot files. Removal results are ignored, so the call succeeds even
  when files are missing. The stored solve dates and the slot selection are not reset.
grade: MUTATOR / established (64-bit and 32-bit builds, by command-socket invocation, which always writes shared diagnostics); the effect of the handler itself is probable
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcbce0, RmPA_WCS @0x160410 (64-bit build)
side_effects: Deletes the two pa_N WCS files from device storage.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: rm_polar_align_image request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: rm_polar_align_image
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcbce0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: The inspected handler returns no handler-specific error code. Missing or inaccessible files
  are not reported.
examples:
- name: remove
  of: request
  payload:
    id: 61
    method: rm_polar_align_image
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: rm_polar_align_image
    result: 0
    code: 0
    id: 61
see_also:
- set_polar_align_image
- get_polar_align_image
spec:
- spec/control/polar-alignment.md#results-and-image-slots
