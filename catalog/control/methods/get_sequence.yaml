kind: method
name: get_sequence
summary: Return one sequence entry by position in the map.
description: Looks the entry up by zero-based position, not by id. Negative or out-of-range indices give
  209. The grade reflects the whole request/reply path, which reaches the shared diagnostic logger; it
  does not by itself mean the method changes device settings.
grade: MUTATOR / established (full command-socket call; shared diagnostic writes; 64-bit and 32-bit builds)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
side_effects: Copies one entry under the sequence mutex. Every call also performs shared request/reply
  diagnostic logging.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_sequence request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_sequence
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      oneOf:
      - type: integer
      - type: array
        minItems: 1
        items:
          type: integer
      description: 'Required zero-based index into the sequence map in map order (not an entry id): an
        integer, or a positional array whose first element is used. Absent, null, empty array, object,
        or a non-integer (including float) gives 104.'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_sequence reply (success)
  required:
  - method
  - result
  - code
  - id
  properties:
    jsonrpc:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/jsonrpc
    Timestamp:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/Timestamp
    method:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/method
    result:
      type: object
      required:
      - id
      - type
      - filter
      - suffix
      - exp
      - gain
      - bin
      - repeat
      - lapsed
      - capture_index
      - enable
      - autoexp
      properties:
        id:
          type: integer
          description: Entry id.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        type:
          type: string
          enum:
          - light
          - dark
          - bias
          - flat
          - unknown
          description: Frame type name.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, frame type table @0xaacca0
        filter:
          type: integer
          description: Filter slot index.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        suffix:
          type: string
          description: File name suffix.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        exp:
          type: number
          description: Exposure; unit not established.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        gain:
          type: integer
          description: Gain; scale not established.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        bin:
          type: integer
          description: Binning factor (INFERRED).
          x-confidence: INFERRED
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        repeat:
          type: integer
          description: Frames to capture (INFERRED count).
          x-confidence: INFERRED
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        lapsed:
          type: integer
          description: Frames captured so far (INFERRED count); the progress that reset_sequence_progress
            clears.
          x-confidence: INFERRED
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        capture_index:
          type: integer
          description: Capture-control selector (INFERRED); meaning not established.
          x-confidence: INFERRED
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        enable:
          type: boolean
          description: Entry is active.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
        autoexp:
          type: boolean
          description: Auto exposure flag.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc1a20 (64-bit build)
      description: Entry at that index. All twelve members are always emitted.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xc1a20
    code:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/code
    id:
      $ref: ../../common/schemas/Id.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 104
  trigger: params is not an integer or an array whose first element is an integer
  label: expected int param
- code: 209
  trigger: No entry at that index (empty map, past the end, or negative)
  label: invalid value
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: first
  summary: Entry at index 0
  of: request
  payload:
    id: 81
    method: get_sequence
    params:
    - 0
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_sequence
    result:
      id: 1
      type: light
      filter: 0
      suffix: L
      exp: 10
      gain: 80
      bin: 1
      repeat: 30
      lapsed: 5
      capture_index: 0
      enable: true
      autoexp: false
    code: 0
    id: 81
- name: no-such-index
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_sequence
    error: invalid value
    code: 209
    id: 82
see_also:
- get_sequence_number
- set_sequence
- delete_sequence
spec:
- spec/control/legacy-plans-and-sequences/sequences.md#the-stand-alone-sequence-list
