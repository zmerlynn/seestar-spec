kind: method
name: set_3p_pa_setting
summary: Set the three-point polar-alignment mode and rotation angle.
description: Replaces the stored three-point alignment setting with the supplied members merged over the
  current ones and persists the fields that changed. There is no check that alignment is idle and no config
  write failure is reported.
grade: MUTATOR / established (64-bit and 32-bit builds, by command-socket invocation, which always writes shared diagnostics); the effect of the handler itself is probable
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcb820, Set3PPaSetting @0x120380 (64-bit build)
side_effects: Updates the shared setting and writes changed fields to the device config.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_3p_pa_setting request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_3p_pa_setting
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/Set3pPaSettingParams.yaml
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 107
  trigger: params absent, null, or not an object (including an array)
  label: expected object param
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: enable
  summary: Enable three-point mode
  of: request
  payload:
    id: 121
    method: set_3p_pa_setting
    params:
      is_pa_3p: true
      rotate_angle: 30
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_3p_pa_setting
    result: 0
    code: 0
    id: 121
- name: no-params
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_3p_pa_setting
    error: expected object param
    code: 107
    id: 122
see_also:
- get_3p_pa_setting
- start_polar_align
spec:
- spec/control/polar-alignment.md#settings
