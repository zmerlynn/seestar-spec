kind: method
name: test_connection
summary: 'Heartbeat: returns a fixed connected string.'
description: Returns the literal "server connected!" with no device state or latency members. Used by
  the app as a keep-alive on the control stream, sent without params. It does not validate the camera
  or mount. On the image sockets (4800/4801/4804) the same literal is sent as a framed text reply (imgType
  0, dataType 0; spec/media/image-sockets.md#reply-framing). READ.
grade: PURE GETTER / established (64-bit build; 32-bit build probable)
side_effect_tier: A
confidence: READ
basis: 'static analysis of firmware 9.31, handler @0xd2870 (64-bit build); image-socket handler string
  "server connected!" (finding #308)'
side_effects: None.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: test_connection request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: test_connection
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xd2870 (64-bit build)
reply_success:
  title: test_connection success reply
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        type: string
        const: server connected!
        description: Fixed literal.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xd2870 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler error path. The same method name is also sent by the app on a separate firmware-update
  channel; whether that channel replies with the same literal is not established.
examples:
- name: ping
  of: request
  payload:
    id: 110
    method: test_connection
- name: ok
  summary: Reply shape OBSERVED (about 159 ms while imaging, 2026-10-12); id invented
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: test_connection
    result: server connected!
    code: 0
    id: 110
see_also:
- get_controls
spec:
- spec/control/maintenance.md#diagnostic-and-dangerous-methods
- spec/media/image-sockets.md#readiness-gating-and-liveness
- spec/transport/ports.md#client-connection-order-and-readiness
- spec/control/session-handshake/liveness-and-ordering.md#heartbeats-and-the-idle-clock
