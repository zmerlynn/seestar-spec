kind: method
name: upload_refstar_info
summary: Store a list of reference stars on the device for later use.
description: Serialises the supplied refData array unchanged and writes it as the reference-star file
  (ref_stars.json) in the device's AI-processing temporary directory, creating the directory when needed.
  The device does not interpret the stars here. The file is read by the imager's own stacking worker; in the
  photometry stacking mode (capture type 2) it loads the file as the reference-star list. READ; that capture
  type 2 is the photometry/check stack mode is INFERRED. Synchronous writes without timeout. Firmware 9.75, app 3.4.0 writes ref_stars.json through a temporary file (name suffixed with the process id) and renames it; a rename failure removes the temporary file and gives 515. The handler gives 107 and 102 itself; 257, 258 and 218 still come from the directory-check and file-write helpers. READ (64-bit build). The 32-bit build has the temporary-file string; its codes are INFERRED the same.
grade: MUTATOR / established (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: 'static analysis of firmware 9.31, handler @0xe2f40, CheckDirConst @0x6ece40, WriteFile @0x6df730,
  reader StackFunc @0x19c3c0 with LoadPmRef @0x203460 (64-bit build); error sites: 257 at CheckDirConst
  @0x6ed018; 258 at WriteFile @0x6df71c; 218 at @0x6df640, @0x6df69c, @0x6df6d8'
side_effects: Creates the target directory if missing and writes (replaces) the reference-star file.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: upload_refstar_info request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: upload_refstar_info
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      type: object
      description: Required object. Needs refData, or the alias key "refData:" when refData is absent.
        Unknown keys ignored.
      anyOf:
      - required:
        - refData
      - required:
        - 'refData:'
      properties:
        refData:
          type: array
          items: {}
          description: 'Reference-star records. Elements are not parsed or validated; the whole
            array is serialised unchanged to the device''s reference-star file. Empty array allowed;
            no size bound. The app sends nearby-star records (app-side shape INFERRED, not enforced
            by the device).'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xe2f40 (64-bit build), key @0x730190
        'refData:':
          type: array
          items: {}
          description: Fallback alias key, literally including the trailing colon, read only when refData
            is absent. A wrong-typed refData does not fall back.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xe2f40 (64-bit build), key @0x730198
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe2f40 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 107
  trigger: params absent, null, positional array, or otherwise not an object
  label: expected object param
- code: 102
  trigger: Neither refData nor the alias key present, or refData is not an array
  label: invalid params
- code: 515
  trigger: 'Firmware 9.75: renaming the temporary file to ref_stars.json failed'
  label: rename ref star file fail
- code: 257
  trigger: The reference-star directory could not be created
  label: create directory failed
- code: 258
  trigger: The file could not be opened for writing
  label: open file failed
- code: 218
  trigger: A short write, or a flush or sync failure
  label: fail to write file
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: (Firmware 9.31 behaviour; 9.75 adds 515.) Failures of the directory check and of the file write return their error code as the method's
  error (257 from the directory check; 258 and 218 from the file write). The helper's 209 for an empty
  directory name is unreachable because the directory is a constant (INFERRED). No result member on handler
  errors.
examples:
- name: empty
  summary: Empty list
  of: request
  payload:
    id: 66
    method: upload_refstar_info
    params:
      refData: []
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: upload_refstar_info
    result: 0
    code: 0
    id: 66
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: upload_refstar_info
    error: invalid params
    code: 102
    id: 67
see_also: []
spec:
- spec/control/solving-and-annotation.md#ai-processing
