kind: method
name: stop_export_image
summary: Stop the running image export and return its progress counters.
description: Asks the export worker to stop (signalling and joining it, with no wait flag and no short
  timeout), then returns the cached success and total counters. Success does not guarantee that every
  selected entry was copied. No parameters are read and no camera is required. The worker emits a final
  ExportImage event with state complete even when stopped.
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xba010, StopExportImage @0x121680, GetExportImageStatus
  @0x1216a0 (64-bit build)
side_effects: Stops the export worker thread, which can block until it exits; may leave a partial copy.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: stop_export_image request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: stop_export_image
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xba010, StopExportImage @0x121680, GetExportImageStatus
        @0x1216a0 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: stop_export_image success reply
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    required:
    - result
    properties:
      result:
        $ref: ../schemas/StopExportImageResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xba010, StopExportImage @0x121680, GetExportImageStatus
          @0x1216a0 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is reachable.
examples:
- name: stop
  of: request
  payload:
    id: 121
    method: stop_export_image
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: stop_export_image
    result:
      success_frame: 3
      total_frame: 8
    code: 0
    id: 121
see_also:
- start_export_image
spec:
- spec/control/stacking.md#export-to-other-storage
