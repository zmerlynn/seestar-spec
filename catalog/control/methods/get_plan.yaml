kind: method
name: get_plan
summary: Read legacy autosave plans with progress and estimates.
description: Returns the legacy plans matching an optional plan_id / target_id / seq_id selector (all
  plans when omitted) with progress and estimate fields (remaining size and time for enabled plans, current
  ids, per-target error text). Disabled plans are included.
grade: MUTATOR / established (64-bit and 32-bit builds); it is a mutator because the estimate path writes shared caches.
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xb55e0, FormatPlans @0x3097c0 (64-bit build)
side_effects: Copies the global plan map under its lock. Estimating enabled plans refreshes shared camera-information
  caches (64-bit build) and writes to the logger, which can append or rotate log files. No plan is started
  and no hardware is moved. Camera-read failures are not turned into errors.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_plan request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_plan
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/LegacyPlanSelectorParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb55e0, FormatPlans @0x3097c0 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_plan success reply
  required:
  - method
  - result
  - code
  - id
  properties:
    jsonrpc:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/jsonrpc
    Timestamp:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/Timestamp
    method:
      type: string
      const: get_plan
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handle_request @0x6f9440
    result:
      $ref: ../schemas/LegacyPlanOutput.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb55e0, FormatPlans @0x3097c0 (64-bit build)
    code:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/code
    id:
      $ref: ../../common/schemas/Id.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 107
  trigger: Selector container is malformed (non-object first array element or other container)
  label: expected object param
- code: 209
  trigger: target_id given without plan_id, or seq_id without target_id (even if plan_id exists)
  label: invalid value
- code: 204
  trigger: The requested plan, target or sequence does not exist
  label: out of limit
- code: 268
  trigger: The plan loader thread is running
  label: operation is in progress
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: all
  summary: All plans
  of: request
  payload:
    id: 41
    method: get_plan
- name: one-target
  summary: One target (shape READ, values invented)
  of: request
  payload:
    id: 42
    method: get_plan
    params:
      plan_id: 1
      target_id: 1
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_plan
    result:
    - id: 1
      plan_name: Example plan
      merid_flip: true
      mount_go_home: true
      focuser_go_home: false
      shutdown_pi: false
      start_guide: true
      close_cooler: true
      wait_cooling: true
      enable: true
      left_size_m: 800.5
      left_time_sec: 5400
      total_time_sec: 5400
      cur_id: 1
      start_time:
        type: date
        hour: 21
      end_time:
        type: dawn
      targets:
      - delay_first: 0
        delay_between_frame: 0
        id: 1
        capture_index: 0
        extra_sec_per_target: 0
        left_time_sec: 5400
        total_time_sec: 5400
        code: 0
        enable: true
        group_by_slot: true
        target_name: Example target
        target_original_img: ''
        target_original_name: ''
        real_start_date: ''
        real_end_date: ''
        obj_type: ''
        left_size_m: 800.5
        error: no error
        cur_id: 1
        target_coord:
        - 12
        - 30
        seqs:
        - id: 1
          filter: 0
          gain: 80
          bin: 1
          repeat: 30
          lapsed: 0
          capture_index: 0
          type: light
          suffix: ''
          exp: 10
          enable: true
          autoexp: false
    code: 0
    id: 41
- name: ok-empty
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_plan
    result: []
    code: 0
    id: 43
- name: target-without-plan
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_plan
    error: invalid value
    code: 209
    id: 44
see_also:
