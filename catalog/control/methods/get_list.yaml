kind: method
name: get_list
summary: List the object lists in the persistent object-list configuration with their object counts.
description: Returns an array of {name, obj_number}. No parameters are read. The handler ignores the helper's
  return value and serializes whatever was collected, so a failed enumeration yields an empty array rather
  than an error. Not related to list_plan or the held ViewPlan.
grade: MUTATOR / established (64-bit and 32-bit builds)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xb4db0, ObjListConfig::Get @0x6c4a90 (64-bit build)
side_effects: Enumerates the XML configuration into local structures. The established write is creation
  of a configured lock file under the temporary directory (opened read-only with create, mode 0666; an
  existing file is simply opened); no list content is changed. Synchronous; no explicit timeout.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_list request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_list
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb4db0 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_list success reply
  description: Same envelope as the common success reply, except that result carries data.
  required:
  - method
  - result
  - code
  - id
  properties:
    jsonrpc:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/jsonrpc
    Timestamp:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/Timestamp
    method:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/method
    result:
      type: array
      description: One entry per list. An empty array is allowed (and is also what a failed enumeration
        yields).
      items:
        $ref: ../schemas/GetListEntry.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, get_list @0xb4db0 (64-bit build)
    code:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/code
    id:
      $ref: ../../common/schemas/Id.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is emitted.
examples:
- name: get
  of: request
  payload:
    id: 71
    method: get_list
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_list
    result:
    - name: Winter targets
      obj_number: 3
    - name: Planets
      obj_number: 0
    code: 0
    id: 71
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_list
    result: []
    code: 0
    id: 72
see_also:
- get_obj
- add_list
- del_list
- rename_list
spec:
- spec/control/object-lists.md#user-object-lists
