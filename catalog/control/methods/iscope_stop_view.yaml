kind: method
name: iscope_stop_view
summary: Stop the current view (full stop) or one named stage of it.
description: 'Without a usable stage string the whole view is stopped: view mode returns to none, device
  shoot status is cleared, binary sending stops and the view workers stop. With a stage string only that
  named function is stopped; an unknown or not-running name is not an error. A stopped function ends
  with a cancel event (no code or error on the wire; internal code 253, not sent); on a full stop the View
  event then repeats with mode none (application to View INFERRED). In one special full-stop
  case (main stacking active with the wide camera selected) the handler puts the wide camera to sleep,
  switches back to the main process and returns without writing result or code, so that reply carries
  only the envelope members. Stops join worker threads and can block; no total timeout is established.
  The grade reflects the whole request/reply path, which reaches the shared diagnostic logger; it does
  not by itself mean the method changes device settings.'
grade: MUTATOR / established (full command-socket call; shared diagnostic writes; 64-bit and 32-bit builds)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xde080 (64-bit build)
side_effects: Stops view stage workers or the whole view; full stop saves filter position, stops the named
  star worker or leaves the live-stream page, resets stack, mosaic and continuous-capture state on applicable
  branches and can close the focuser; stage Stack may clear photometry data; 64-bit local AutoExp stop
  records an aborted capture error. May relay to the second camera process (10000 ms per wait). Every
  call also performs shared request/reply diagnostic logging.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: iscope_stop_view request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: iscope_stop_view
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      type: object
      properties:
        stage:
          type: string
          description: 'Optional string. Any string, including empty or unknown, selects stage-stop; AutoExp,
            AutoGoto and Stack have explicit case-sensitive branches, everything else is passed to the
            stop-by-name helper without error. Names the app sends: 3PPA, AutoExp, DarkLibrary, AutoGoto,
            Initialise, ObjectTrack, ScanSun, Stack (these are app-sent names, not a firmware enum). 32-bit
            build lacks the AutoExp special case.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xde080, StopViewStage; app senders in BaseDeviceViewModel
      description: Optional. Only the stage member is read. Absent, null, scalar, array or empty-object
        params, and a missing or non-string stage, all take the full-stop path (no error). A positional
        array wrapping the object is not unwrapped, so it also performs a full stop.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xde080 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 536
  trigger: A ViewPlan worker is running (every input shape)
  label: view plan is already running
- code: 210
  trigger: '64-bit build: stage AutoExp on the main process while the current mode is star without wide
    support, or the mode id is 6 or above'
  label: not supported
- code: 300
  trigger: Relay to the other process has no user-data context
  label: internal error
- code: 207
  trigger: A relay failure left the error code zero
  label: fail to operate
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Relay slave errors are copied through; the full relay error universe is not established.
examples:
- name: full-stop
  summary: Stop the whole view
  of: request
  payload:
    id: 31
    method: iscope_stop_view
- name: stop-stage
  summary: Stop one stage (name is one the app sends)
  of: request
  payload:
    id: 32
    method: iscope_stop_view
    params:
      stage: AutoGoto
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: iscope_stop_view
    result: 0
    code: 0
    id: 32
- name: plan-running
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: iscope_stop_view
    error: view plan is already running
    code: 536
    id: 33
see_also:
- iscope_start_view
- iscope_start_stack
- clear_view_plan
spec:
- spec/control/viewing-and-exposure.md#starting-and-stopping-a-view
