kind: method
name: test
summary: Developer diagnostic that loads a fixed image (64-bit build) or reference file (32-bit build)
  and discards it.
description: 'Takes no parameters. The 64-bit build allocates a full-frame buffer, loads a fixed
  stacked image into it through the wide-mosaic stacked-image reader, frees it and returns the
  helper result as a JSON boolean; false is still a code 0 success. The 32-bit build instead loads a
  fixed photometry reference file into a temporary vector and returns integer 0 unconditionally. The
  two builds implement different tests and the result type differs by build. No app emitter was
  found.'
grade: MUTATOR / established (both builds)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xd31e0, WideMosaicGetStackImage @0x18ad70 (64-bit build);
  handler @0x67834, LoadPmRef @0x18a490 (32-bit build)
side_effects: Reads a fixed file into request-local memory. Transitive diagnostic logging can write log
  files and mutate shared logging state. No persistent image write is established. Synchronous, no timeout.
  Allocation failure on the 64-bit build may throw; the exception-to-wire behaviour is unresolved.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: test request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: test
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xd31e0, WideMosaicGetStackImage @0x18ad70 (64-bit
        build); handler @0x67834, LoadPmRef @0x18a490 (32-bit build)
reply_success:
  title: test reply (success)
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        type:
        - boolean
        - integer
        description: 'Build dependent. 64-bit build: boolean returned by the image loader (false is still
          a code 0 success). 32-bit build: integer 0.'
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xd31e0, WideMosaicGetStackImage @0x18ad70
          (64-bit build); handler @0x67834, LoadPmRef @0x18a490 (32-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: run
  of: request
  payload:
    id: 71
    method: test
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: test
    result: true
    code: 0
    id: 71
see_also: []
spec:
- spec/control/maintenance.md#diagnostic-and-dangerous-methods
