kind: method
name: iscope_start_view
summary: Switch the device into a view mode (star, scenery, moon, sun, planet, solar system), optionally
  with a target.
description: Starts the requested view worker. Changes view, camera, page and control state, can stop
  the previous worker and exposure, and can move the focuser. On wide-camera-capable models (star mode)
  the request may be relayed to the other camera process, in which case the reply is the relayed reply
  rather than a locally built one. A success reply means the request was accepted and the worker launched,
  not that the view is ready. Downstream device and driver error codes are not limited to the table below.
  The grade reflects the whole request/reply path, which reaches the shared diagnostic logger; it does
  not by itself mean the method changes device settings. Firmware 9.75, app 3.4.0 adds the members goto_capt_type,
  goto_capture_settings and stack_exp_ms and the codes 104 and 209 on them; their types and meaning were
  not decoded. Mosaic goto now has a source mode that restarts a normal stack after the goto (see stacking.md).
grade: MUTATOR / established (full command-socket call; shared diagnostic writes; 64-bit and 32-bit builds)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xde500 (64-bit build); firmware 9.75 members from the
  9.75 reports
side_effects: Saves target and autosave state, changes view/page/control state, may stop the prior worker
  and exposure, may open and move the focuser, sets the working indicator (64-bit build), and may relay
  requests to the second camera process, each wait up to 10000 ms with no total bound established. Every
  call also performs shared request/reply diagnostic logging.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: iscope_start_view request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: iscope_start_view
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          description: 'Required string naming the view mode: star, scenery, moon, sun, planet, solar_sys,
            none (ASCII case-insensitive). Absent, null or wrong type gives 105. An unrecognised string
            maps to the same internal value as none, which StartView rejects with 204; accepted ids are
            0-5.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xde500, get_view_mode_id @0x3bfd50, table
            @0xaadda8
        target_type:
          type: string
          description: 'Optional string, read only when mode is solar_sys: moon, sun or planet. Missing
            or wrong type, or any other name, falls back to sun. Ignored for other modes.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xde500, IsSolarSysMode @0x2eaac0
        target_ra_dec:
          type: array
          items:
            type: number
          description: 'Optional two-element array: RA in decimal hours, then Dec in decimal degrees (READ:
            stored unconverted; the goto worker multiplies RA by 15). Coordinates are taken as epoch of
            date (JNow), not J2000 (INFERRED: the firmware''s own plan path precesses J2000 targets to
            the current date before starting a view; no epoch flag exists), so a client SHOULD precess
            J2000 positions first. Each element is an integer or float token; extra elements ignored.
            Missing, non-array, short or malformed arrays generate no error; the first coordinate may
            be applied even if the second fails (no rollback). No range checks.'
          x-default: '[-999, -999] (sentinel, no target)'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, ParseTargetInfo @0x40a270, RA x15 in AutoGotoFunc
            at @0x17323c; epoch INFERRED from getViewPlanTargetInfoJnow
        target_name:
          type: string
          description: Optional string, default empty. Missing or wrong type ignored. A nonempty name
            is passed through filename sanitising before being saved as target and autosave state; the
            exact normalisation is not established. No length limit in the parser.
          x-default: ''
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, ParseTargetInfo @0x40a270, StartView @0x3c1f50
        lp_filter:
          type:
          - boolean
          - integer
          description: Optional boolean or integer (0 false, nonzero true); other types ignored. The 64-bit
            build forces the flag false when the stack setting for auto light-pollution enhancement is
            false.
          x-default: false
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, ParseTargetInfo @0x40a270, bool_param @0x6f58f0
        star_type:
          type: integer
          description: Optional integer; wrong type ignored. No enum or range check; valid values and
            meaning not established. Not sent by the app.
          x-default: -1
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, ParseTargetInfo @0x40a270
        mosaic:
          type: object
          properties:
            star_map_angle:
              type: number
              description: Optional number, default -999 (sentinel). A present but non-numeric value gives
                102. No range check. Degrees (INFERRED); zero direction and sign unresolved. When absent,
                capture setup resets the mosaic parameters (scale 1, angle 0), so a mosaic needs all three
                members (INFERRED).
              x-default: -999
              x-confidence: READ
              x-basis: static analysis of firmware 9.31, ParseMosaic @0x1a1180
            scale:
              type: number
              description: Optional number, default -999 (sentinel). A present but non-numeric value gives
                102. When absent, angle is not read. No range check or clamp. Dimensionless multiplier
                of the camera frame size for the mosaic canvas; mosaic enabled when abs(scale) > 1.01
                or abs(angle) > 0.1.
              x-default: -999
              x-confidence: READ
              x-basis: static analysis of firmware 9.31, ParseMosaic @0x1a1180
            angle:
              type: number
              description: Number, read only when scale is present and parsed; then missing, null or non-numeric
                gives 102. Otherwise ignored (default -999). No bounds. Degrees (INFERRED, not established
                by the parser); truncated to an integer for the grid planner.
              x-default: -999
              x-confidence: READ
              x-basis: static analysis of firmware 9.31, ParseMosaic @0x1a1180
          description: Optional object, parsed only after both leading target_ra_dec elements parsed successfully.
            Absent, null or non-object is ignored.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, ParseTargetInfo @0x40a270, ParseMosaic @0x1a1180
          x-required-when: 'mosaic.angle: required when mosaic.scale is present'
        selected_cam:
          type: string
          description: 'Optional string: View or SecondView (case-insensitive). Read only on the main-process
            star path with wide-camera support; there a present non-string gives 105 and an unknown name
            209. Ignored on other paths. Missing keeps the current selection.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xde500, SelectCam @0xaf280
        wide_mosaic_angle:
          type: number
          description: Optional number; malformed ignored. Read only for the wide-camera process on the
            star path. Degrees (INFERRED).
          x-default: -999
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xde500 (64-bit and 32-bit builds)
        main_stack_exp_us:
          type: integer
          description: '64-bit build only: optional integer exposure override read only for the wide-camera
            process on the star path. Missing or wrong type sets -1; values <= 0 normalise to -1. Microseconds
            (INFERRED from the name). Not sent by the app; a main-process relay may inject it.'
          x-default: -1
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xde500 (64-bit build); no read in the 32-bit
            handler
        goto_capt_type:
          description: 'Firmware 9.75, app 3.4.0: optional goto setting. Type, range and effect were not
            decoded; 104 and 209 are the reported codes.'
          x-confidence: READ; type unresolved
          x-basis: static analysis of firmware 9.75, app 3.4.0 reports, iscope_start_view handler (64-bit
            build)
        goto_capture_settings:
          description: 'Firmware 9.75, app 3.4.0: optional goto setting. Type, range and effect were not
            decoded; 104 and 209 are the reported codes.'
          x-confidence: READ; type unresolved
          x-basis: static analysis of firmware 9.75, app 3.4.0 reports, iscope_start_view handler (64-bit
            build)
        stack_exp_ms:
          description: 'Firmware 9.75, app 3.4.0: optional goto setting. Type, range and effect were not
            decoded; 104 and 209 are the reported codes.'
          x-confidence: READ; type unresolved
          x-basis: static analysis of firmware 9.75, app 3.4.0 reports, iscope_start_view handler (64-bit
            build)
      description: Required object. Missing, null, scalar or array params give 107 (checked after the
        ViewPlan guard). A positional array wrapping the object is not accepted. Unknown members are ignored.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xde500 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 536
  trigger: A ViewPlan worker is running (checked before params; also from camera selection if a non-dual
    plan starts in a race)
  label: view plan is already running
- code: 107
  trigger: params missing, null or not an object
  label: expected object param
- code: 105
  trigger: mode missing or not a string; or selected_cam present but not a string on its active branch
  label: expected string param
- code: 102
  trigger: mosaic.star_map_angle or mosaic.scale malformed, or mosaic.angle missing or malformed when
    scale is present
  label: invalid params
- code: 204
  trigger: Mode id above 5 (none, or an unrecognised mode string)
  label: out of limit
- code: 209
  trigger: selected_cam names an unknown camera
  label: invalid value
- code: 109
  trigger: Camera lookup is negative after a successful camera selection
  label: unexpected param
- code: 524
  trigger: Wide-camera star path requested while the main view function is running, not asleep, and the
    stack status query is false
  label: function conflict
- code: 318
  trigger: No open camera when the star stage is started
  label: device not connected
- code: 212
  trigger: Named worker could not be started
  label: fail to create thread
- code: 203
  trigger: Guider can_goto response contains result false
  label: equipment is moving
- code: 300
  trigger: Relay to the other process has no user-data context
  label: internal error
- code: 207
  trigger: A downstream failure left the error code zero
  label: fail to operate
- code: 104
  trigger: 'Firmware 9.75: a new goto member has the wrong type (association INFERRED)'
  label: expected int
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Downstream StartView, ViewStarSleep and relay failures serialise the thread error code; their
  code set is not established. One caller branch can append two error fragments (duplicate error/code
  members).
examples:
- name: star-view
  summary: Start star mode on the first camera with a target (values invented)
  of: request
  payload:
    id: 21
    method: iscope_start_view
    params:
      mode: star
      selected_cam: View
      target_ra_dec:
      - 12
      - 30
      target_name: Example target
      lp_filter: false
- name: scenery-view
  summary: Start scenery mode
  of: request
  payload:
    id: 22
    method: iscope_start_view
    params:
      mode: scenery
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: iscope_start_view
    result: 0
    code: 0
    id: 21
- name: plan-running
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: iscope_start_view
    error: view plan is already running
    code: 536
    id: 23
