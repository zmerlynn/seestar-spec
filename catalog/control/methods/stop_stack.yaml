kind: method
name: stop_stack
summary: Stop the Stack function worker.
description: 'Records an ''aborted'' capture error, then stops the function named Stack. The result of
  the stop is ignored: the reply is success even when no such function was running. The stop helper may
  wait for or join the worker without a bounded timeout. No request parameters are read.'
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcadf0, StopStack @0x191bc0 (64-bit build)
side_effects: Sets the capture error to aborted and stops the Stack worker thread, which can block until
  the worker exits.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: stop_stack request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: stop_stack
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcadf0, StopStack @0x191bc0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is reachable.
examples:
- name: stop
  of: request
  payload:
    id: 51
    method: stop_stack
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: stop_stack
    result: 0
    code: 0
    id: 51
see_also:
- start_stack
- clear_stack
spec:
- spec/control/stacking.md#sequence
