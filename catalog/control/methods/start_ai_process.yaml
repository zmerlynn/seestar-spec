kind: method
name: start_ai_process
summary: Start the AI image-processing worker on the current or a named image.
description: Depending on view mode and master-process selection the 64-bit build may relay the request
  to the peer process before any local validation. Locally it validates the parameters, stops any previous
  AI worker (possibly blocking), expands name, checks the file is accessible, loads the image, computes
  the estimate and starts the named worker. A success reply acknowledges the thread start, not completion.
  On completion the AIProcess function event carries ori_name and dst_name strings (the formatter emits
  only in the complete state); exact timing and the output file names are unresolved. Firmware 9.75, app 3.4.0 replaces the old view-mode test with the relay-only form of the common relay check (it relays to the peer process when needed and runs no occupancy probe, so no 203 or 524 comes from it; READ in 64-bit firmware 9.75), the wire effect is INFERRED and the 32-bit build was not checked.
grade: MUTATOR / probable (64-bit and 32-bit builds)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xdb4b0, ParserDenoiseParams @0xaf380, startDeNoise
  @0x3f16b0 (64-bit build)
side_effects: Stops any previous AI worker, loads an image, starts the AI worker thread which later writes
  processed output.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: start_ai_process request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: start_ai_process
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/StartAiProcessParams.yaml
reply_success:
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        $ref: ../schemas/StartAiProcessResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xdb4b0, ParserDenoiseParams @0xaf380, startDeNoise
          @0x3f16b0 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 105
  trigger: name present but not a string
  label: expected string param
- code: 102
  trigger: crop present but not an array, or dbe malformed (not an array, non-integer element, odd length)
  label: invalid params
- code: 104
  trigger: A crop element among the first eight is not an integer
  label: expected int param
- code: 108
  trigger: brightness, contrast or saturation missing or not a number
  label: expected float param
- code: 212
  trigger: Worker thread could not be created
  label: fail to create thread
- code: 300
  trigger: 'Relay: main-process user context is null'
  label: internal error
- code: 207
  trigger: Image access, load or start failure with no code set (default)
  label: fail to operate
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Image load and slave-transport error code sets are unresolved.
examples:
- name: defaults
  summary: Zero adjustments, whole current image (values invented)
  of: request
  payload:
    id: 41
    method: start_ai_process
    params:
      brightness: 0
      contrast: 0
      saturation: 0
      crop: []
      dbe: []
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: start_ai_process
    result:
      estimated_sec: 20
    code: 0
    id: 41
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: start_ai_process
    error: expected float param
    code: 108
    id: 42
see_also:
- check_ai_process
- stop_func
spec:
- spec/control/solving-and-annotation.md#ai-processing
