kind: method
name: pi_station_list
summary: List the saved Wi-Fi networks of the device.
description: Runs the packaged network script to list the networks saved in the device's Wi-Fi configuration
  (not scan results) and returns their names. Despite being a list, on models other than the Plus and Mini
  the call first makes the supplicant reload its configuration (see side effects), so it is not
  observation-safe on all models. The 32-bit network script lacks the detailed listing action, so only plain
  names are expected there (INFERRED).
grade: MUTATOR / established (64-bit and 32-bit builds); it is a mutator because the packaged script can run a reconfigure step.
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xe3d10, ns_net::pi_station_list @0x700760 (64-bit build)
side_effects: Synchronously runs a shell script (list_config, falling back to list). The device passes 1 on
  Plus and Mini models and 0 otherwise; the packaged scripts call a Wi-Fi supplicant reconfigure before
  listing unless the argument is 1, so other models have their network configuration reloaded, which can
  briefly disturb an active station link; this is not a guaranteed disconnection. ret_obj changes only the reply wrapping. The process read can block with no established
  deadline.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: pi_station_list request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: pi_station_list
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      type:
      - object
      - array
      - boolean
      - integer
      properties:
        ret_obj:
          type:
          - boolean
          - integer
          x-default: false
          description: 'Wrap the reply array as {value: array}. Integer 0 is false, nonzero true. A malformed
            value is ignored.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xe3d10, ns_net::pi_station_list @0x700760
            (64-bit build)
      description: Optional. An object with ret_obj, or a positional [boolean-or-integer]; a bare scalar
        behaves as defaults. Read only after the listing succeeded.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe3d10, ns_net::pi_station_list @0x700760 (64-bit
        build)
