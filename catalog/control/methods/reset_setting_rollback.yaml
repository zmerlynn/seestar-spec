kind: method
name: reset_setting_rollback
summary: Discard the staged settings reset (firmware 9.75).
description: New in firmware 9.75, app 3.4.0. Cancels a staged transaction. Only the second-camera process
  accepts it; elsewhere it replies 210. Clients normally use reset_setting, which drives these phases
  itself.
grade: MUTATOR / READ
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.75, handler @0xf4350 (64-bit build), @0x6add0 (32-bit build)
side_effects: Discards the pending transaction. The device-side restore on a failed apply happens inside
  commit, not here.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: reset_setting_rollback request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: reset_setting_rollback
      x-confidence: READ
      x-basis: static analysis of firmware 9.75, dispatcher table
    params:
      type: object
      required:
      - transaction_id
      properties:
        transaction_id:
          type: integer
          description: Identifier given to reset_setting_prepare.
          x-confidence: READ
          x-basis: static analysis of firmware 9.75, handler @0xf4350 (64-bit build), @0x6add0 (32-bit
            build)
      x-confidence: READ
      x-basis: static analysis of firmware 9.75, handler @0xf4350 (64-bit build), @0x6add0 (32-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 210
  trigger: process is not the second-camera process
  label: wrong process
- code: 107
  trigger: params is not an object
  label: expected object
- code: 209
  trigger: transaction_id missing or not an integer, no pending transaction, or id mismatch
  label: bad transaction
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No event is emitted.
examples:
- name: request
  of: request
  payload:
    id: 83
    method: reset_setting_rollback
    params:
      transaction_id: 1
  summary: READ shape, not captured; values invented
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: reset_setting_rollback
    result: 0
    code: 0
    id: 83
see_also:
- reset_setting
- reset_setting_prepare
- reset_setting_commit
spec:
- spec/control/function-states.md#settings-reset
