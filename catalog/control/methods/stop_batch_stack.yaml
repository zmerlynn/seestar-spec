kind: method
name: stop_batch_stack
summary: Stop the batch stacking worker.
description: Signals and joins the BatchStack worker before replying; there is no wait or force flag,
  no active-worker precondition and no short timeout, and request parameters are ignored. The reply is
  success even when no batch was running. Running batches report progress through function-state events
  installed by start_batch_stack.
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xca030, StopBatchStack @0x3a65e0 (64-bit build)
side_effects: Stops the BatchStack worker thread, which can block until it exits.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: stop_batch_stack request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: stop_batch_stack
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xca030, StopBatchStack @0x3a65e0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is reachable.
examples:
- name: stop
  of: request
  payload:
    id: 141
    method: stop_batch_stack
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: stop_batch_stack
    result: 0
    code: 0
    id: 141
see_also:
- start_batch_stack
- clear_batch_stack
spec:
- spec/control/stacking.md#batch-stack
