kind: method
name: check_internet
summary: Test internet connectivity from the device (also tries to set the clock via NTP first).
description: Runs the device connectivity check, which first attempts a time synchronisation with sntp
  via sudo (this can set the system clock), then makes one reachability probe; probes rotate among a ping
  of a public DNS address, a ping of a vendor cloud host and an HTTPS request to a vendor endpoint. If NTP
  succeeded but the probe failed, one more probe is made on the next target. The NTP step and each probe
  are bounded at 4 s, so the worst case is about 12 s plus process start-up (INFERRED); clients SHOULD allow
  at least 15 s. The optional timeout_sec is type-checked but ignored in both builds; the fixed internal
  argument of 2 only enables the one retry and is not a timeout. Failure to connect is reported as connected
  false, never as an error.
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xe3360, RemoteCheckInternetAvailable @0x1a24c0, AirRemote::syncSystemTimeWithNTP
  @0x432a90, AirRemote::checkInternetAvailable @0x432bf0, AirRemote::checkInternet @0x432220 (64-bit build)
side_effects: Runs an NTP sync command that can change the system clock, then network connectivity probes.
  Blocks until done.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: check_internet request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: check_internet
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      oneOf:
      - type: object
        properties:
          timeout_sec:
            type: integer
            description: 'Requested timeout in seconds. Type-checked but its value is never used: the
              handler always calls the check with a fixed argument of 2, which enables one retry and is not a
              timeout.'
            x-confidence: READ
            x-basis: static analysis of firmware 9.31, handler @0xe3360 (64-bit build), key @0x730240
        additionalProperties: true
        description: Keyed form.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xe3360 (64-bit build)
      - type: array
        items:
          type: integer
          description: 'Requested timeout in seconds. Type-checked but its value is never used: the handler
            always calls the check with a fixed argument of 2, which enables one retry and is not a timeout.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xe3360 (64-bit build), key @0x730240
        description: 'Positional form: first element is timeout_sec.'
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xe3360 (64-bit build)
      description: Optional. Missing, null, unrecognised container, empty array or missing key falls back
        without error; a present non-integer timeout_sec is rejected with 104.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe3360 (64-bit build), Params @0xff9f0
reply_success:
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    title: check_internet reply (success)
    properties:
      result:
        $ref: ../schemas/CheckInternetResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xe3360 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 104
  trigger: timeout_sec present but not an integer
  label: expected int param
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Network and NTP failures become connected false, not an error reply. No result member on
  the 104 path.
examples:
- name: bare
  summary: Bare request
  of: request
  payload:
    id: 63
    method: check_internet
- name: timeout
  summary: Timeout is accepted but ignored
  of: request
  payload:
    id: 64
    method: check_internet
    params:
      timeout_sec: 5
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: check_internet
    result:
      connected: true
    code: 0
    id: 63
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: check_internet
    error: expected int param
    code: 104
    id: 65
see_also: []
spec:
- spec/control/network.md#internet-check
