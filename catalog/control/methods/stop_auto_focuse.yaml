kind: method
name: stop_auto_focuse
summary: Cancel autofocus (method name is spelled stop_auto_focuse).
description: Local branch reads no parameters. It sets a capture error code (253), logs a manual-cancel
  message and calls StopAutoFocus(true); stopping the worker thread can set a stop flag, signal and join
  the worker, with no request-supplied wait flag and no bounded short timeout. The reply is always success
  after that call. On wide-camera models in certain view modes the request is forwarded to the peer processor
  instead. Firmware 9.75, app 3.4.0 uses the relay-only form of the common relay check (it relays to the peer process when needed and runs no occupancy probe, so no 203 or 524 comes from it; READ in 64-bit firmware 9.75) instead of the 9.31 view-mode test, the stop still sets 253 and stops autofocus, the wire effect is INFERRED.
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcc160, StopAutoFocus @0x268ca0 (64-bit build); tier
  INFERRED
side_effects: Stops the autofocus worker thread and records a capture error state; the focuser stops as
  the worker ends.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: stop_auto_focuse request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: stop_auto_focuse
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read by the local handler. Clients SHOULD omit it. If the request is forwarded
        to the peer, what the peer reads is unresolved.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcc160 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No local error path; the local branch always replies success. Peer relay failures are unresolved.
examples:
- name: request
  of: request
  payload:
    id: 32
    method: stop_auto_focuse
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: stop_auto_focuse
    result: 0
    code: 0
    id: 32
see_also:
- start_auto_focuse
- stop_focuser
spec:
- spec/control/focus-and-filter.md#autofocus
