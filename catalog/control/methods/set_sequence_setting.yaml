kind: method
name: set_sequence_setting
summary: Update the autosave and sequence behaviour settings.
description: params is an object, or a positional array whose first element is the object. Members are
  independent patches over the current settings. The new settings are saved. The grade reflects the whole
  request/reply path, which reaches the shared diagnostic logger; it does not by itself mean the method
  changes device settings.
grade: MUTATOR / established (full command-socket call; shared diagnostic writes; 64-bit and 32-bit builds)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcfca0 (64-bit build)
side_effects: Replaces the shared autosave settings and persists them; affects scheduling and end-of-sequence
  behaviour. Every call also performs shared request/reply diagnostic logging.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_sequence_setting request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_sequence_setting
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      oneOf:
      - $ref: ../schemas/SetSequenceSettingParams.yaml
      - type: array
        minItems: 1
        items:
          $ref: ../schemas/SetSequenceSettingParams.yaml
      description: Required settings object, or array whose first element is the object. Missing, null,
        empty array, scalar or non-object first element gives 107.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcfca0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 107
  trigger: params (or its first array element) is not an object
  label: expected object param
- code: 224
  trigger: delay_first, delay_between_frame or group_by_slot would change while sequences cannot be modified;
    other members bypass the gate
  label: cannot edit sequence unless reset the progress
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: set
  summary: Park and shut down after the sequence (values invented)
  of: request
  payload:
    id: 121
    method: set_sequence_setting
    params:
      delay_first: 5
      delay_between_frame: 2
      group_by_slot: false
      merid_flip: true
      group_name: Example group
      park_mount: true
      shutdown_pi: false
      close_cooler: true
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_sequence_setting
    result: 0
    code: 0
    id: 121
- name: bad-params
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_sequence_setting
    error: expected object param
    code: 107
    id: 122
see_also:
- get_sequence_setting
- set_sequence
spec:
- spec/control/legacy-plans-and-sequences/sequences.md#the-stand-alone-sequence-list
