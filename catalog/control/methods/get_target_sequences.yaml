kind: method
name: get_target_sequences
summary: Read the capture sequence settings of the current autosave target.
description: Returns delays, end-of-run flags, a size and time estimate and the list of sequence slots
  for the current target. On page 6 with a current target the cached setting is rewritten from that target
  first; otherwise the retained default is returned, which need not be a freshly populated live setting.
  No request parameters are read. left_time_sec is undefined when left_size_m is 0.
grade: MUTATOR / established (64-bit and 32-bit builds); it is a mutator because the call writes a shared cache.
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit build)
side_effects: Initializes or refreshes a function-static autosave setting cache, and the size estimate
  refreshes camera information caches and writes log output. No plan is applied and no worker is started.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_target_sequences request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_target_sequences
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array take the same path. Clients SHOULD
        omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
        build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_target_sequences success reply
  required:
  - method
  - result
  - code
  - id
  properties:
    jsonrpc:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/jsonrpc
    Timestamp:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/Timestamp
    method:
      type: string
      const: get_target_sequences
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handle_request @0x6f9440
    result:
      type: object
      required:
      - delay_first
      - delay_between_frame
      - group_by_slot
      - merid_flip
      - group_name
      - park_mount
      - shutdown_pi
      - close_cooler
      - left_size_m
      - left_time_sec
      - slots
      properties:
        delay_first:
          type: integer
          description: Delay before the first frame. Units are not established.
          x-confidence: READ (units unresolved)
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        delay_between_frame:
          type: integer
          description: Delay between frames. Units are not established.
          x-confidence: READ (units unresolved)
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        group_by_slot:
          type: boolean
          description: Group captures by slot.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        merid_flip:
          type: boolean
          description: Meridian flip allowed.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        group_name:
          type: string
          description: Group name.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        park_mount:
          type: boolean
          description: Park the mount at the end.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        shutdown_pi:
          type: boolean
          description: Shut down at the end.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        close_cooler:
          type: boolean
          description: Cooler off at the end.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        left_size_m:
          type: number
          description: Estimated size of the enabled sequences in binary megabytes (1024 x 1024 bytes).
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        left_time_sec:
          type: integer
          description: Estimated remaining capture time in whole seconds (truncated). Undefined when the
            camera frame-size query fails, which is the case when left_size_m is 0; the handler then sends
            an uninitialised value. A client MUST ignore left_time_sec when left_size_m is 0.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0 (emit from sp+388 @0xc391c), GetSequenceSizeM
            @0x20edb0 (early return before the store, store @0x20eec0) (64-bit build)
        target_coord:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: '[ra, dec] numbers; present only when both differ from the -999 sentinel by about
            0.1 or more. Order and units RA hours / Dec degrees are INFERRED; no conversion is performed
            by the producer.'
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
        slots:
          type: array
          items:
            type: object
            required:
            - id
            - type
            - suffix
            - filter
            - gain
            - bin
            - repeat
            - lapsed
            - capture_index
            - exp
            - enable
            - autoexp
            properties:
              id:
                type: integer
                description: Slot id.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              filter:
                type: integer
                description: Filter index.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              gain:
                type: integer
                description: Gain.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              bin:
                type: integer
                description: Binning.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              repeat:
                type: integer
                description: Frames to capture.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              lapsed:
                type: integer
                description: Frames captured.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              capture_index:
                type: integer
                description: Progress index.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              type:
                type: string
                description: Frame type name (light, dark, bias, flat, unknown).
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              suffix:
                type: string
                description: File name suffix.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              exp:
                type: number
                description: Exposure in seconds.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              enable:
                type: boolean
                description: Slot enabled.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
              autoexp:
                type: boolean
                description: Auto exposure.
                x-confidence: READ
                x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50
                  (64-bit build)
          description: Always emitted, possibly empty.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
            build)
      description: Capture sequence settings of the current target, or the retained autosave default when
        no target is current.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xc34a0, GetAutosaveSetting @0x20ff50 (64-bit
        build)
    code:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/code
    id:
      $ref: ../../common/schemas/Id.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
