kind: method
name: reset_sequence_progress
summary: Reset the captured-frame progress of every sequence entry to zero.
description: No params are read. Entries, their repeat counts and settings are kept; only the progress
  counters are zeroed, and an imaging log line is written. Resetting progress is what makes a partly captured
  sequence editable again (see error 224 on set_sequence). The reset is not saved, but it does not need to be;
  the stored per-sequence records include progress, yet the start-up loader does not read it back, so every
  entry has zero progress after an imager restart whether or not it was reset (READ, 64-bit; 32-bit not checked). The grade reflects the whole request/reply
  path, which reaches the shared diagnostic logger; it does not by itself mean the method changes device
  settings.
grade: MUTATOR / established (full command-socket call; shared diagnostic writes; 64-bit and 32-bit builds)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xd0170, ResetSeqProgress @0x20ec20 (no save), SaveSequence
  @0x20e550 (sole caller SetSequence @0x21a5e0), LoadSequence @0x219dc0 (called from LoadSetting @0x131590 in DevInit
  @0x132050; enumerates setting2/imager/sequences; reads id, capture_index, type, filter, suffix, exp, gain,
  bin, repeat, enable, autoexp but not lapsed, which defaults to 0) (64-bit build)
side_effects: Zeroes per-entry progress under the sequence mutex and appends to the imaging log; no save
  to settings; progress is not loaded back at start-up, so it is zero after a restart anyway (READ). Every call also performs shared request/reply
  diagnostic logging.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: reset_sequence_progress request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: reset_sequence_progress
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 206
  trigger: The capture thread is running and the exposure mode is 2 (sequence capture)
  label: capture is active
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: reset
  summary: Bare request
  of: request
  payload:
    id: 111
    method: reset_sequence_progress
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: reset_sequence_progress
    result: 0
    code: 0
    id: 111
- name: capturing
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: reset_sequence_progress
    error: capture is active
    code: 206
    id: 112
see_also:
- set_sequence
- clear_sequence
- get_sequence
spec:
- spec/control/legacy-plans-and-sequences/sequences.md#the-stand-alone-sequence-list
