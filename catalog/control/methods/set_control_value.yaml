kind: method
name: set_control_value
summary: Set one camera control (gain, exposure, target temperature and others) by name.
description: Sets the named camera control under the camera lock. On the 64-bit build, the exact spelling
  TargetTemp additionally updates a cached target temperature and persists a camera-specific setting;
  other casings resolve the control but skip that special case (32-bit build casing behaviour not established).
  Exposure and gain changes queue delayed configuration writes before the lower-level setter reports success,
  so a failed call does not establish that nothing changed. The ISP exposure control divides the effective
  integer by one million before the SDK call; the inspected ISP gain branch logs and reports success without
  an SDK gain update. Values are integers in fixed units (READ, camera library, except exposure), namely exposure
  in microseconds (INFERRED); gain in tenths of a dB on multiplicative-gain sensors, raw analogue gain
  otherwise; offset in raw black-level units; target temperature in degrees C, clamped to -40..30; cooler
  power in percent; red/blue white balance as a gain with 100 as unity, affecting only pixel format 3.
  The name is matched without regard to case against the imager's control-name table (26 real entries, ids
  0..25; a static scan of the table also reads one further row past id 25, which is a scan artifact, not
  a 27th control id). Gain, Exposure, Red,
  Blue and MonoBin are handled specially (MonoBin only stores the mono-bin setting); any other name must
  resolve to an id in the device's control table (see get_controls), otherwise 210. The device makes no range
  check against the get_controls limits; out-of-range handling is the camera library's and is unresolved.
  Setting Temperature (read-only) returns success with no effect (READ, 64-bit build). Gain, Exposure, Red and
  Blue (device ids 0, 1, 19, 20) map to camera-library control ids 0, 1, 3 and 4; CoolPowerPerc, TargetTemp and
  CoolerOn (device ids 5, 6, 7) map to camera-library control ids 15, 16 and 17. Setting CoolerOn to an "on"
  value additionally sets camera-library control id 22 (fan speed) to 255 or 127, depending on a condition
  not further resolved. ISP_Exposure (id 25) scales by 1/1,000,000 before the same library call as Exposure;
  ISP_Gain (id 24) only logs and makes no library call (as above); HPC (id 23) calls the library's hot-pixel-
  correction control. Confirmed unchanged in firmware 9.75 on both the 64-bit and 32-bit builds (identical
  instruction counts; only relocation differences).
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xe89a0, SetControlVal @0x11dff0, camera SetControlVal
  @0x153ac0, special ids and map find @0x153c9c..0x153c34, per-id setter @0x151c50 (64-bit build); camera library control-set dispatch and exposure-to-lines conversion, from its
  debug information; ISP exposure branch calls ASI_ISP_SetManExpGain, HPC branch calls ASI_CAM_SetHPC,
  CoolerOn "on" branch additionally calls the fan-speed setter with camera-library control id 22 (64-bit
  build); confirmed unchanged in firmware 9.75 (identical instruction counts, relocation-only differences,
  both 64-bit and 32-bit builds)
side_effects: Changes camera controls; queues or persists per-page control settings (and the target-temperature
  setting) possibly before a later failure; no rollback is established.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_control_value request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_control_value
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/SetControlValueParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe89a0, SetControlVal @0x11dff0, camera SetControlVal
        @0x153ac0 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 105
  trigger: name missing or not a string (including absent, null or scalar params)
  label: expected string param
- code: 109
  trigger: val is null, an object or an array
  label: unexpected param
- code: 318
  trigger: Camera absent or closed, or unavailable camera id
  label: device not connected
- code: 210
  trigger: Name unknown, or its id not in the device's control table (for example Bandwidth, Gamma)
  label: not supported
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Failures inside the camera setter are not an exhaustively audited closed list; the handler
  forwards whatever application code the helper set. Camera library return codes are internal and never
  reach the wire; a library failure is reported as a fixed application code, typically 318. Limits come
  from get_controls but are not enforced by the device; library handling of out-of-range values is unresolved.
examples:
- name: gain
  summary: Object form (values invented)
  of: request
  payload:
    id: 50
    method: set_control_value
    params:
      name: Gain
      val: 80
- name: positional
  summary: Positional form
  of: request
  payload:
    id: 51
    method: set_control_value
    params:
    - Exposure
    - 10000
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_control_value
    result: 0
    code: 0
    id: 50
- name: bad-val
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_control_value
    error: unexpected param
    code: 109
    id: 52
see_also:
- get_control_value
- get_controls
- set_page
spec:
- spec/control/viewing-and-exposure.md#camera-and-isp-settings
