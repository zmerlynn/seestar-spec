kind: method
name: stop_auto_goto
summary: Stop the auto-goto worker.
description: No parameters are read. Sets the shared capture error to 253 (aborted) when the capture state
  allows, then stops the goto worker thread. The stop can wait for the worker and does not promise an
  instantaneous physical halt. The stop status is ignored, so the reply is always success.
grade: MUTATOR / established (D64 and D32 command-socket invocation)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, stop_auto_goto @0xcb540, StopAutoGoto @0x16e200 (64-bit build)
side_effects: Conditionally overwrites the capture error with 253 and stops the named goto worker thread,
  which may block until the worker exits (no finite deadline established). Every full call also makes
  the shared diagnostic log writes.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: stop_auto_goto request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: stop_auto_goto
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, stop_auto_goto @0xcb540, StopAutoGoto @0x16e200 (64-bit
        build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is reachable. The 253 value is a capture-state value set by this
  handler, not an RPC error reply.
examples:
- name: stop
  of: request
  payload:
    id: 36
    method: stop_auto_goto
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: stop_auto_goto
    result: 0
    code: 0
    id: 36
see_also:
- start_auto_goto
- start_auto_goto_pixel
spec:
- spec/control/solving-and-annotation.md#auto-goto
- spec/control/mount-and-motion/goto-and-manual-motion.md#solved-goto-start_auto_goto
