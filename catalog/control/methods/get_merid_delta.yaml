kind: method
name: get_merid_delta
summary: Report the time to the target meridian crossing and the configured meridian limits.
description: Takes no parameters. Despite the getter name, the call refreshes shared state (the coordinate
  cache when older than 5000 ms, and static snapshots of the meridian settings), so it is classified MUTATOR.
  The hour delta is h = RA - LST, positive before the target crosses the meridian (east), negative after
  (west); beyond 6 h it is measured to the lower meridian. LST comes from the guider scope_get_ra_dec reply.
  A valid cached coordinate is required; otherwise it fails with 207. The error reply carries none of
  the result members. No app emitter detail is available.
grade: MUTATOR / established (both builds)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xb9b00, GetTargetDeltaHour @0x1882e0, CalcMeridDelta @0x1875c0,
  GetRADecDegree @0x180430 (64-bit build)
side_effects: Takes a mutex (waiting without timeout if held), refreshes the coordinate cache when older
  than 5000 ms, reads the meridian settings and writes static snapshots of the over and before minutes,
  including on the recent-cache path. No setting write or motion.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_merid_delta request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_merid_delta
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xb9b00, GetTargetDeltaHour @0x1882e0 (64-bit
        build)
reply_success:
  title: get_merid_delta reply (success)
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - type: object
    properties:
      result:
        $ref: ../schemas/GetMeridDeltaResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xb9b00, GetTargetDeltaHour @0x1882e0 (64-bit
          build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 207
  trigger: Cached hour delta is within 0.1 of the -999 sentinel (no valid coordinates)
  label: fail to operate
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: query
  of: request
  payload:
    id: 91
    method: get_merid_delta
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_merid_delta
    result:
      target_merid_delta_min: 312.5
      merid_over_min: 10
      merid_before_min: 5
      is_below_horizon: false
    code: 0
    id: 91
- name: error
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_merid_delta
    error: fail to operate
    code: 207
    id: 92
see_also: []
spec:
- spec/control/mount-and-motion/tracking-park-and-state.md#meridian-flip
