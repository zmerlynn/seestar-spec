kind: method
name: add_list
summary: Create a named object list in the persistent object-list configuration.
description: Creates a list whose display name is the supplied string. The stored key is derived from
  a timestamp and the name is stored as the key's value, so names need not be valid XML identifiers; any
  string, including an empty one, is accepted (a client SHOULD reject empty names itself). A duplicate
  display name (exact string compare) is rejected with 225. This is the object-list store, distinct
  from the legacy plan store and from the held ViewPlan.
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcd1f0, ObjListConfig::AddList @0x6c3600 (64-bit build)
side_effects: Creates a new list entry in the persistent XML configuration, synchronously. No event is
  emitted by the handler.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: add_list request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: add_list
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      oneOf:
      - type: string
      - type: array
        minItems: 1
        items:
          type: string
      description: The list display name, as a bare string or as a one-element array whose first element
        is used (extra elements ignored). Absent, null, empty array or a non-string gives 105. No length
        check; the empty string is accepted and stored as a list named "" (markup escaping on round trip
        INFERRED from the XML library).
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcd1f0, json_array2obj @0x6fa450 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 105
  trigger: params is absent, null, an empty array, or not a string (or one-element array holding a string)
  label: expected string param
- code: 225
  trigger: A list with the same display name already exists
  label: xml item already exists
- code: 234
  trigger: The device's object-list store has no file configured (a device-side fault; not caused by the
    list name)
  label: xml file name is empty
- code: 226
  trigger: Creating the XML key failed
  label: fail to create xml key
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: The helper sets 236 while enumerating an empty or failed store but continues creating the
  list, so 236 is not an unconditional reply and may be followed by success. The close result is ignored;
  persistence failures below the helper are not established as RPC errors.
examples:
- name: create
  of: request
  payload:
    id: 21
    method: add_list
    params: Winter targets
- name: create-array-form
  summary: One-element array form (first element used)
  of: request
  payload:
    id: 22
    method: add_list
    params:
    - Winter targets
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: add_list
    result: 0
    code: 0
    id: 21
- name: duplicate
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: add_list
    error: xml item already exists
    code: 225
    id: 23
see_also:
- add_obj
- del_list
- rename_list
- get_list
spec:
- spec/control/object-lists.md#user-object-lists
