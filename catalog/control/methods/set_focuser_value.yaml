kind: method
name: set_focuser_value
summary: Set a focuser control value (backlash or step-register reset).
description: 'Requires an open focuser. reset_step converts the requested UI step with the cached
  scaling, writes the hardware position register (eaf_set_position) and updates the cached logical
  position, hardware position and remainder; this resets the position counter and is not
  demonstrated motor travel. backlash calls the focuser backlash setter, which in the 64-bit build
  is a stub that always fails, so an open focuser always replies 300 for backlash there. In the
  32-bit build the backend is chosen when the focuser is opened. One backend is a stub that also
  fails (300), the other stores the backlash value in the device configuration and succeeds when the
  focuser is open, so there backlash can succeed and persist (READ). max_step has no setter (210).
  No rollback and no wait.'
grade: MUTATOR / probable (64-bit build; 32-bit build differs for backlash only, where it can persist the
  value (READ))
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xe7e10, SetValue @0x15c660 (64-bit build); SetValue @0xdef24
  (32-bit build, nonzero backend result maps to 300); eaf_set_backlash is a function pointer set by eaf_open;
  dw9800 backend @0x2f3010 returns 10, default backend @0x2f17bc writes "backlash" via set_conf_int (0
  ok, 2 write failed, 5 not open); tier INFERRED
side_effects: reset_step rewrites the focuser position register and cached position state; a failed backlash
  call only writes diagnostic log state.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: set_focuser_value request
  required:
  - id
  - method
  - params
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: set_focuser_value
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/SetFocuserValueParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe7e10 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 105
  trigger: name missing or not a string (including scalar or empty params)
  label: expected string param
- code: 104
  trigger: val missing or not an integer or boolean
  label: expected int param
- code: 109
  trigger: name matches none of the control names
  label: unexpected param
- code: 318
  trigger: Recognised control but the focuser is not open
  label: device not connected
- code: 210
  trigger: max_step setter requested (unsupported)
  label: not supported
- code: 300
  trigger: Driver set call fails (always for backlash in the 64-bit build) or reset scaling maxima are
    not positive
  label: internal error
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
examples:
- name: request
  of: request
  payload:
    id: 17
    method: set_focuser_value
    params:
      name: reset_step
      val: 1200
- name: positional
  summary: Positional form
  of: request
  payload:
    id: 18
    method: set_focuser_value
    params:
    - reset_step
    - 1200
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_focuser_value
    result: 0
    code: 0
    id: 17
- name: backlash-fails
  summary: Backlash on an open focuser (64-bit build)
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: set_focuser_value
    error: internal error
    code: 300
    id: 19
see_also:
- get_focuser_value
- get_focuser_position
- move_focuser
