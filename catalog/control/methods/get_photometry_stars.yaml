kind: method
name: get_photometry_stars
summary: Read the cached photometry star records of one image.
description: 'Looks up the cached photometry stars for the selected image under the photometry mutex and
  returns them as result.stars. Read-only apart from diagnostic logging: it does not start photometry
  or touch the camera. A found image with an empty star list fails without a handler-set code and is reported
  as 207.'
grade: MUTATOR / established (64-bit build; 32-bit build established)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, handler @0xe2d10 (64-bit build)
side_effects: Locks the photometry mutex (may block, no timeout) and reads cached stars and plot save
  metadata. The only write is the shared diagnostic log (empty cache, default or latest selection, missing
  id, empty star data), which strictly makes the call a mutator even when file logging is disabled.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_photometry_stars request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_photometry_stars
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      anyOf:
      - $ref: ../schemas/GetPhotometryStarsParams.yaml
      - type: array
        description: Positional form [image_id]; extra elements ignored.
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xe2d10 (64-bit build)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xe2d10 (64-bit build)
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_photometry_stars success reply
  allOf:
  - $ref: ../../common/schemas/ReplySuccessWith.yaml
  - properties:
      result:
        $ref: ../schemas/GetPhotometryStarsResult.yaml
        x-confidence: READ
        x-basis: static analysis of firmware 9.31, handler @0xe2d10 (64-bit build)
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 104
  trigger: image_id present with a non-integer type (including null)
  label: expected int param
- code: 207
  trigger: Cached image map is empty, or the found image has no stars
  label: fail to operate
- code: 200
  trigger: Requested (wrapped) image id not found
  label: invalid id
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Code 200 here is reused with the message invalid id although the cause is a missing image.
  No partial result is emitted on error.
examples:
- name: latest
  summary: Latest cached image
  of: request
  payload:
    id: 101
    method: get_photometry_stars
- name: by-id
  of: request
  payload:
    id: 102
    method: get_photometry_stars
    params:
      image_id: 3
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_photometry_stars
    result:
      stars:
      - pix:
        - 512.5
        - 384.25
        radec_deg:
        - 210.8
        - 54.3
        ref_mag: 0
        measure_mag: 12.4
        err: 0.03
        MJD: 60000.5
        loc_date: '2026-01-31 21:15:00'
        id: star-1
        name: Example target
        star_type: target
        is_reference: false
        save: false
    code: 0
    id: 102
- name: bad-image-id
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_photometry_stars
    error: expected int param
    code: 104
    id: 103
see_also:
- get_photometry_plot
- get_saved_photometry_stars
- check_photometry
spec:
- spec/control/solving-and-annotation.md#photometry
