kind: method
name: remote_disjoin
summary: Leave the remote (cloud relay) network and forget the stored join.
description: Removes the stored remote-join file (result ignored), clears the auto-connect flag, calls
  the leave-network library function and then notifies the remote state as not joined even if the leave
  call returned an error. No rollback. The app uses it as its remove-remote action, passing no parameters
  (whether the field is omitted on the wire is not established).
  Firmware 9.75 (64-bit build, READ), behaviour and error codes are unchanged from firmware 9.31.
grade: MUTATOR / probable (64-bit build; 32-bit build probable)
side_effect_tier: C
confidence: READ
basis: static analysis of firmware 9.31, handler @0xcb0e0, RemoteDisjoin @0x1a2450 (64-bit build); firmware 9.75 (app 3.4.0, 64-bit build) cloud-link resolver report
side_effects: Deletes the stored remote-join file, clears auto-connect and leaves the relay network; broadcasts
  joined state false.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: remote_disjoin request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: remote_disjoin
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, scalar, object and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0xcb0e0, RemoteDisjoin @0x1a2450 (64-bit build)
reply_success:
  $ref: ../../common/schemas/ReplySuccess.yaml
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 207
  trigger: The leave-network call returned nonzero
  label: fail to operate
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: Leave-call timeout is unresolved.
examples:
- name: leave
  of: request
  payload:
    id: 65
    method: remote_disjoin
- name: ok
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: remote_disjoin
    result: 0
    code: 0
    id: 65
- name: failed
  of: reply_error
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: remote_disjoin
    error: fail to operate
    code: 207
    id: 66
see_also:
- remote_join
- remote_disconnect
spec:
- spec/auth/account-login/boundaries.md#firmware-boundary
- spec/control/network.md#remote-access-enrolment
