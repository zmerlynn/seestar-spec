kind: method
name: get_3p_pa_state
summary: Read the current three-point polar-alignment status (stage, flags, progress, error).
description: Returns the same status structure that the 3PPA event carries. The stage is retained after
  a pause or stop, so a stopped run can still report its last algorithm stage. No parameters are read.
  Documented against the 64-bit build; 32-bit parity is not fully established.
grade: MUTATOR / established (the handler itself only reads state; the grade reflects the shared diagnostic
  log writes made by every full call)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, get_3p_pa_state @0xb79f0, FormatPaStatus @0x161860 (64-bit build;
  32-bit build probable)
side_effects: None beyond the shared diagnostic log writes. Copies the polar-align status and reads capture/solver
  progress and clocks into local output.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_3p_pa_state request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_3p_pa_state
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, get_3p_pa_state @0xb79f0, FormatPaStatus @0x161860
reply_success:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_3p_pa_state reply (success)
  required:
  - method
  - result
  - code
  - id
  properties:
    jsonrpc:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/jsonrpc
    Timestamp:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/Timestamp
    method:
      type: string
      const: get_3p_pa_state
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handle_request @0x6f9440
    result:
      $ref: ../schemas/Get3pPaStateResult.yaml
    code:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/code
    id:
      $ref: ../../common/schemas/ReplySuccess.yaml#/properties/id
reply_error:
  $ref: ../../common/schemas/ReplyError.yaml
errors:
- code: 200
  trigger: 'Dispatcher: request has no id'
  label: invalid id
- code: 100
  trigger: 'Dispatcher: method missing or not a string'
  label: invalid request
errors_note: No handler-specific error is reachable; missing progress is represented by omitted members,
  not by an error reply.
examples:
- name: query
  summary: Query (shape per static analysis; value invented)
  of: request
  payload:
    id: 21
    method: get_3p_pa_state
- name: exposing
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_3p_pa_state
    result:
      state: exp1
      state_code: 2
      auto_move: true
      auto_update: false
      paused: false
      detail:
        lapse_ms: 1500
        total_ms: 4000
      pa_error:
        total: 0.5
        x: 0.3
        y: 0.4
        total_arcsec: 1800
        x_arcsec: 1080
        y_arcsec: 1440
      lapse_ms: 9000
      retry_cnt: 0
    code: 0
    id: 21
- name: idle
  of: reply_success
  payload:
    jsonrpc: '2.0'
    Timestamp: '1234.123456789'
    method: get_3p_pa_state
    result:
      state: idle
      state_code: 0
      auto_move: false
      auto_update: false
      paused: true
    code: 0
    id: 22
see_also: []
