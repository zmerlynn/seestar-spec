kind: event
name: SaveImage
summary: State of saving the current image, with the saved name on success.
description: 'Producers: the save worker, the block save and the RTSP image save. Direct events:
  start, complete with filename and fullname on success, and save fail. Function-state family (F):
  state is always written; stage only when non-empty; lapse_ms when the timer is started or the
  state is terminal; code and error at fail even when the stored code is 0 (cancel omits them);
  route optional. A null or nameless detail sends nothing, and non-working notifications can be
  suppressed while the function cache still changes, so a receiver cannot rely on seeing every
  transition. State family (S): caller-supplied state literal; error and code only when the supplied
  code is greater than 0. The terminal event can arrive after the save_image reply. Channels: imager
  4700 and auxiliary 4702 (forwarded to 4700). No reply-before-event order is established: the RPC
  reply that starts the worker and the worker''s events can arrive in either order. No fixed
  cadence.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, NotifySaveImgOk @0x11a070, SaveImgFunc @0x12bd40, StartSaveBlock
  @0x12ab80, SaveRtspImgFunc @0x2f73b0 (64-bit build)
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: SaveImage event
  type: object
  discriminator: Event
  description: State members plus the saved names.
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: SaveImage
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SaveImgFunc @0x12bd40
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    state:
      type: string
      enum:
      - idle
      - working
      - complete
      - fail
      - cancel
      - start
      - save fail
      description: 'Function producer: idle, working, complete, fail, cancel. Direct producers: start,
        complete and the literal save fail (with a space; do not normalise it to fail).'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0; SaveImgFunc @0x12bd40, StartSaveBlock
        @0x12ab80, SaveRtspImgFunc @0x2f73b0
    stage:
      type: string
      description: Only when a non-empty stage string is held.
      x-required-when: non-empty stage string held
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    lapse_ms:
      type: integer
      description: Elapsed milliseconds, independent of Timestamp. Working (or any state with a start
        and no end time, including complete) uses current monotonic minus start; other terminal states
        use end minus start.
      x-required-when: 'function producer: timer started (working) or terminal state'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    code:
      type: integer
      description: 'Function producer: at fail even if 0. Direct producers: only when the checked save
        failure code is > 0; some direct failure paths pass 0 and so carry no code/error despite a failure-like
        state.'
      x-required-when: function fail; direct failure with code > 0
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    error:
      type: string
      description: Message for code; present with code. Lookup failure gives fail to operate.
      x-required-when: function fail; direct failure with code > 0
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    route:
      type: array
      items:
        type: string
      description: Function-tree ancestry (for example View, Stack) built at send time. May be absent;
        not an address.
      x-required-when: optional; absent is a legitimate branch
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintFunParent @0x6e46c0
    filename:
      type: string
      description: Saved file base name.
      x-required-when: 'successful save (save-success notifier)'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifySaveImgOk @0x11a070
    fullname:
      type: string
      description: Saved file full name/path.
      x-required-when: 'successful save (save-success notifier)'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifySaveImgOk @0x11a070
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, NotifySaveImgOk @0x11a070
examples:
- name: complete
  summary: Saved (READ shape; values invented)
  of: payload
  payload:
    Event: SaveImage
    Timestamp: '1234.123456789'
    state: complete
    filename: Example_0001.jpg
    fullname: MyWorks/Example/Example_0001.jpg
- name: save-fail
  summary: Direct failure without code (READ shape)
  of: payload
  payload:
    Event: SaveImage
    Timestamp: '1234.123456789'
    state: save fail
see_also:
- save_image
- get_img_file_info
spec:
- spec/media/video.md#snapshots-from-the-stream
