kind: event
name: AutoGotoStep
summary: Mount-error notification raised during an auto-goto step.
description: 'Custom producer mount-error notifier, called when the mount reports an error during
  auto-goto. state is the literal fail and the event carries tag, page, func, count, error and code;
  presence conditions for the individual members are not detailed in the evidence, so only state is
  marked required. Channel I (TCP 4700). Delivery: ordinary broadcast to every retained socket of
  the emitting server (master, guest and never-verified sockets alike); no cadence, delivery or
  ordering guarantee relative to RPC replies or other events. APK 3.3.2 defines the name as a
  constant only; no consumer branch is established.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: AutoGotoStep event
  type: object
  discriminator: Event
  description: Custom mount-error event.
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: AutoGotoStep
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, Ev constructor @0x6f74c0; NotifyMountErr @0x16ede0 (64-bit build)
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    tag:
      type: string
      description: Source tag.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
    page:
      type: string
      description: Page.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
    func:
      type: string
      description: Goto function step name.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
    state:
      type: string
      enum:
      - fail
      description: Always fail in the inspected producer.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
    count:
      type: integer
      description: Attempt count.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
    error:
      type: string
      description: Message from the error lookup.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
    code:
      type: integer
      description: Mount failure code.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, NotifyMountErr @0x16ede0 (64-bit build)
examples:
- name: fail
  summary: Mount error during goto (READ shape; values invented)
  of: payload
  payload:
    Event: AutoGotoStep
    Timestamp: '1234.123456789'
    tag: example
    page: preview
    func: example
    state: fail
    count: 1
    error: example error
    code: 207
see_also:
- AutoGoto
- start_auto_goto
- stop_auto_goto
- get_app_state
