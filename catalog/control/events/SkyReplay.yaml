kind: event
name: SkyReplay
summary: State of the sky replay recorder (firmware 9.75).
description: 'New in firmware 9.75, app 3.4.0. The function name is SkyReplay and the worker sends function-state events (READ). The initial state string is idle and the other is recording. The feature is force-disabled in firmware 9.75 (the enable getter always reports false and the setter clears the stored flag), so whether any event is emitted on a real device is unresolved. Session cap: 600 frames. The envelope is the shared function-state envelope (INFERRED). A receiver MUST NOT depend on seeing any transition.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ; envelope INFERRED
basis: static analysis of firmware 9.75, resolver reports, skyReplayFunc @0x1d1bb0, printSkyReplayState @0x1d3700 (64-bit build)
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: SkyReplay event
  type: object
  discriminator: Event
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: SkyReplay
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.75, resolver reports, skyReplayFunc @0x1d1bb0, printSkyReplayState @0x1d3700 (64-bit build)
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    state:
      type: string
      enum:
      - idle
      - working
      - complete
      - fail
      - cancel
      description: Function-state name; INFERRED to follow the shared function-state formatter.
      x-confidence: INFERRED
      x-basis: static analysis of firmware 9.75, resolver reports, skyReplayFunc @0x1d1bb0, printSkyReplayState @0x1d3700 (64-bit build); state set assumed from the shared function-state formatter
    camera_id:
      type: integer
      description: Camera the session records (value meaning INFERRED).
      x-confidence: READ; meaning INFERRED
      x-basis: static analysis of firmware 9.75, resolver reports, skyReplayFunc @0x1d1bb0, printSkyReplayState @0x1d3700 (64-bit build)
    recorded_frame_count:
      type: integer
      description: Frames recorded so far in the session.
      x-confidence: READ
      x-basis: static analysis of firmware 9.75, resolver reports, skyReplayFunc @0x1d1bb0, printSkyReplayState @0x1d3700 (64-bit build)
    video_frame_count:
      type: integer
      description: Frames in the video being built.
      x-confidence: READ
      x-basis: static analysis of firmware 9.75, resolver reports, skyReplayFunc @0x1d1bb0, printSkyReplayState @0x1d3700 (64-bit build)
  x-confidence: READ; envelope INFERRED
  x-basis: static analysis of firmware 9.75, resolver reports, skyReplayFunc @0x1d1bb0, printSkyReplayState @0x1d3700 (64-bit build)
examples:
- name: example
  summary: INFERRED envelope, not captured; values invented
  of: payload
  payload:
    Event: SkyReplay
    Timestamp: '1234.123456789'
    state: working
    camera_id: 0
    recorded_frame_count: 12
    video_frame_count: 12
see_also:
- set_setting
- get_setting
spec:
