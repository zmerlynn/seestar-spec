kind: event
name: RTSP
summary: State of the RTSP live stream, with stream port and ROI scale.
description: 'Function producer (the camera stream function) plus a direct producer on stream/ROI
  changes. Function-state family: state is always written; stage only when non-empty; lapse_ms when
  the timer is started or the state is terminal; code and error at fail even when the stored code is
  0 (cancel omits them); route optional. A null or nameless detail sends nothing, and non-working
  notifications can be suppressed while the function cache still changes, so a receiver cannot rely
  on seeing every transition. The formatter adds roi_index (64-bit: only when the scale is close to
  1, 2 or 4), roi_scale (64-bit build only, always present there) and port (both builds); the direct
  ROI producer sends working with View ancestry in route. The JSON event and the RTSP media are
  separate channels. The RTSP server on the reported port requires no authentication, has no idle
  timeout and needs no keepalive (OPTIONS only if one is sent); see spec/media/video.md R3c and R3d
  (READ). OBSERVED (2026-10-12, firmware not matched to 9.31): an RTSP working event during scenery
  playback; the complete packet, route, ROI members and port were not captured. Channels: imager
  4700 and auxiliary 4702 (forwarded to 4700). No universal timer. No reply-before-event order is
  established: the RPC reply that starts the worker and the worker''s events can arrive in either
  order. No fixed cadence. The APK event-socket class does not open a second event connection.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ; working state OBSERVED (2026-10-12)
basis: 'static analysis of firmware 9.31, PrintRtspState @0x158820, SendRtmpRoiRtspEvent @0x2f2030 (64-bit
  build); state OBSERVED (2026-10-12); CamRtxpFunc producer; port from the rtsp_port setting; "roi_scale"
  string absent from the 32-bit binary (finding #359); 32-bit PrintRtspState @0xd78f0 writes roi_index
  and port through the integer stream path, no GetRtmpRoiIndexCompat call'
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: RTSP event
  type: object
  discriminator: Event
  description: Function-state members plus stream members.
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: RTSP
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintRtspState @0x158820
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    state:
      type: string
      enum:
      - idle
      - working
      - complete
      - fail
      - cancel
      description: Function-state name; the direct ROI producer sends working. working OBSERVED once (2026-10-12).
      x-confidence: READ; working OBSERVED (2026-10-12)
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0; PrintRtspState @0x158820;
        SendRtmpRoiRtspEvent @0x2f2030
    stage:
      type: string
      description: Only when a non-empty stage string is held.
      x-required-when: non-empty stage string held
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    lapse_ms:
      type: integer
      description: Elapsed milliseconds, independent of Timestamp. Working (or any state with a start
        and no end time, including complete) uses current monotonic minus start; other terminal states
        use end minus start.
      x-required-when: 'function producer: timer started (working) or terminal state'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    code:
      type: integer
      description: 'Function producer: present when state is fail, even if the stored code is 0. cancel
        omits it.'
      x-required-when: state is fail (function producer)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    error:
      type: string
      description: Message for code; present with code. Lookup failure gives fail to operate.
      x-required-when: state is fail (function producer)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    route:
      type: array
      items:
        type: string
      description: Function ancestry; the direct ROI producer explicitly adds the View ancestry. May be
        absent on the function path.
      x-required-when: optional; absent is a legitimate branch
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintFunParent @0x6e46c0
    roi_index:
      type: integer
      description: 'Compatibility ROI scale index. 64-bit build: present only when roi_scale is close
        to 1, 2 or 4 (index 0, 1, 2); the indices for 2 and 4 are INFERRED. 32-bit build: emitted as an integer
        (READ).'
      x-required-when: '64-bit: roi_scale close to 1, 2 or 4; 32-bit: emitted'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintRtspState @0x158820
    roi_scale:
      type: number
      description: Continuous ROI scale. Always present on the 64-bit build; absent on the 32-bit build,
        so clients treat it as optional.
      x-required-when: 64-bit build (always)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintRtspState @0x158820
    port:
      type: integer
      description: RTSP media stream port from the configured RTSP port setting (default 4554), on both
        builds; the media itself is a separate channel. Integer on both builds (READ).
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintRtspState @0x158820
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, PrintRtspState @0x158820
examples:
- name: working
  summary: Stream running (state OBSERVED; other members READ shape, values invented)
  of: payload
  payload:
    Event: RTSP
    Timestamp: '1234.123456789'
    state: working
    lapse_ms: 3000
    roi_index: 0
    roi_scale: 1.0
    port: 4554
    route:
    - View
see_also:
- get_setting
- set_setting
- iscope_get_app_state
spec:
- spec/media/video.md#rtsp-event
