kind: event
name: BalanceSensor
summary: Tilt/accelerometer sample with a validity code, sent from the 100 ms sensor timer when it changes.
description: 'Broadcast on TCP 4700 (channel I) from the sensor sampling timer, which is initialized with
  a 100 ms initial and repeat interval. A try-lock and processing guards can skip ticks, and only selected
  changed or valid balance branches send, so 100 ms is not a guarantee of 10 events per second. The stream
  is not client-controlled: a background housekeeping thread of the imager enables the g-sensor and arms the
  timer when it starts, and deletes the timer when it exits (READ; that it runs for the life of the imager is
  INFERRED). No method starts or stops it. code is 0 for a valid reading and 1 when the sensor could not be
  read, in which case x, y, z and angle are zero. On the 64-bit build the first valid sample is sent; later samples are sent only when angle (tilt from vertical, degrees) differs from the last sent value by more than 0.26 and the 2-degree level lies between the two; a failed read is sent once (READ; 32-bit not checked). The packer is the same as for
  the balance_sensor member of get_device_state. code is an embedded status, not an RPC error code; there
  is no state member. Family: custom. APK consumers: DeviceEventPart (balance sensor DTO) and DeviceService
  sensor consumers. The APK compass-sensor DTO is a separate consumer type, not something this packer
  emits.'
grade: PURE GETTER
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, sendSensorData @0x132ca0, packBalanceSensorData @0x1261a0, RefreshPiTemp
  thread @0x137790 (timer @0x13785c, teardown @0x1379cc) (64-bit build)
side_effects: Observation only.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: BalanceSensor event
  type: object
  discriminator: Event
  required:
  - Event
  - Timestamp
  - code
  - data
  properties:
    Event:
      type: string
      const: BalanceSensor
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, sendSensorData @0x132ca0
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    code:
      type: integer
      enum:
      - 0
      - 1
      description: Validity of the reading, the inverse of the packer's valid flag. 0 valid reading; 1 the
        sensor could not be read (data members then zero).
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, packBalanceSensorData @0x1261a0 (valid byte XOR 1 @0x126448),
        sendSensorData read-error branch @0x13364c
    data:
      type: object
      description: Always packed.
      required:
      - x
      - y
      - z
      - angle
      properties:
        x:
          type: number
          description: Sensor x component; scaling unresolved.
          x-confidence: READ; unit unresolved
          x-basis: static analysis of firmware 9.31, packBalanceSensorData @0x1261a0
        y:
          type: number
          description: Sensor y component; scaling unresolved.
          x-confidence: READ; unit unresolved
          x-basis: static analysis of firmware 9.31, packBalanceSensorData @0x1261a0
        z:
          type: number
          description: Sensor z component; scaling unresolved.
          x-confidence: READ; unit unresolved
          x-basis: static analysis of firmware 9.31, packBalanceSensorData @0x1261a0
        angle:
          type: number
          description: Tilt angle in degrees, computed by the producer from the axis components.
          x-confidence: READ
          x-basis: static analysis of firmware 9.31, packBalanceSensorData @0x1261a0
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, packBalanceSensorData @0x1261a0
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, sendSensorData @0x132ca0
