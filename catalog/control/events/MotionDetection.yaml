kind: event
name: MotionDetection
summary: State of the standalone motion detector (firmware 9.75, 64-bit only).
description: New in firmware 9.75, app 3.4.0, 64-bit build only. The function name is MotionDetection, registered when the detector is started alone (set_motion_detection) and by the smart-follow and motion-monitor workers. The detector worker sends function-state events (READ); its state printer adds one top-level member, points, an array of objects with integer x, y, width and height, converted from detector results by the preview-size ratios (READ, firmware 9.75 64-bit build); an empty collection is sent as points:[]. It is sent through the shared function-state envelope. Physical interpretation, coordinate origin and detection accuracy are unresolved. A receiver MUST NOT depend on seeing every transition.
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ; envelope INFERRED
basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build)
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: MotionDetection event
  type: object
  discriminator: Event
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: MotionDetection
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build)
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    state:
      type: string
      enum:
      - idle
      - working
      - complete
      - fail
      - cancel
      description: Function-state name; INFERRED to follow the shared function-state formatter.
      x-confidence: INFERRED
      x-basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build); state set assumed from the shared function-state formatter
    points:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
            description: Integer x of the detected region, scaled by the preview-size ratio.
            x-confidence: READ; meaning unresolved
            x-basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build); element layout re-read 2026-10-18
          y:
            type: integer
            description: Integer y of the detected region, scaled by the preview-size ratio.
            x-confidence: READ; meaning unresolved
            x-basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build); element layout re-read 2026-10-18
          width:
            type: integer
            description: Integer width of the detected region, scaled by the preview-size ratio.
            x-confidence: READ; meaning unresolved
            x-basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build); element layout re-read 2026-10-18
          height:
            type: integer
            description: Integer height of the detected region, scaled by the preview-size ratio.
            x-confidence: READ; meaning unresolved
            x-basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build); element layout re-read 2026-10-18
      description: Detected regions, each with integer x, y, width and height scaled by the preview-size ratios; empty as []. Physical interpretation and coordinate origin are unresolved.
      x-confidence: READ (element shape); meaning unresolved
      x-basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build)
  x-confidence: READ; envelope INFERRED
  x-basis: static analysis of firmware 9.75, resolver reports, motionDetectionFunc @0x46b190, printMotionDetectionState @0x469e80 (64-bit build)
examples:
- name: example
  summary: INFERRED envelope, not captured; values invented
  of: payload
  payload:
    Event: MotionDetection
    Timestamp: '1234.123456789'
    state: working
    points: []
