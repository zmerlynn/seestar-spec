kind: event
name: ScanSun
summary: State of the sun/moon scan worker.
description: 'The Sun-scan starter starts a named function initialised as ScanSun; it refuses with
  524 unless the view mode is 2, 3 or 4 and no other function holds the slot. The worker computes
  the body position, does a child ScopeGoto, and on S30 Plus-class units then fetches a get_go_cmd
  command list from the peer unit and sends each command to the mount, then stops the mount.
  Function-state family (F): state is always written; stage only when non-empty; lapse_ms when the
  timer is started or the state is terminal; code and error at fail even when the stored code is 0
  (cancel omits them); route optional. A null or nameless detail sends nothing, and non-working
  notifications can be suppressed while the function cache still changes, so a receiver cannot rely
  on seeing every transition. The event carries only the function-state members; the function detail
  is built with the name alone and no extra-member callback (READ). Begin/end transitions; no event
  timer. Recipients: all retained 4700 sockets. No reply-before-event order is established: the RPC
  reply that starts the worker and the worker''s events can arrive in either order. No fixed
  cadence. The event name is the name the starter gives the function; the start_scan_planet handler
  itself emits no event.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, StartScanSun @0x2efae0, ScanSunFunc @0x2e55a0, FindSun::ScanSun
  @0x227f00, static initializer @0xa2e04 (64-bit build)
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: ScanSun event
  type: object
  discriminator: Event
  description: Function-state members only.
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: ScanSun
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, StartScanSun @0x2efae0
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    state:
      type: string
      enum:
      - idle
      - working
      - complete
      - fail
      - cancel
      description: Function-state name. idle is an initial/restored state and is not automatically sent;
        unknown internal codes fall back to idle. A formatter supporting a state does not mean every run
        visits it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0; StartScanSun @0x2efae0
    stage:
      type: string
      description: Only when a non-empty stage string is held.
      x-required-when: non-empty stage string held
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    lapse_ms:
      type: integer
      description: Elapsed milliseconds, independent of Timestamp. Working (or any state with a start
        and no end time, including complete) uses current monotonic minus start; other terminal states
        use end minus start.
      x-required-when: 'function producer: timer started (working) or terminal state'
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    code:
      type: integer
      description: 'Function producer: present when state is fail, even if the stored code is 0. cancel
        omits it.'
      x-required-when: state is fail (function producer)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    error:
      type: string
      description: Message for code; present with code. Lookup failure gives fail to operate.
      x-required-when: state is fail (function producer)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0
    route:
      type: array
      items:
        type: string
      description: Function-tree ancestry (for example View, Stack) built at send time. May be absent;
        not an address.
      x-required-when: optional; absent is a legitimate branch
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintFunParent @0x6e46c0
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, StartScanSun @0x2efae0, SendFuncEvent @0x6e4e20
examples:
- name: working
  summary: Scan running (READ shape; values invented)
  of: payload
  payload:
    Event: ScanSun
    Timestamp: '1234.123456789'
    state: working
    lapse_ms: 4200
    route:
    - ScanSun
see_also:
- start_scan_planet
- iscope_stop_view
- is_func_occupy_mount
- get_go_cmd
