kind: event
name: Sleep
summary: Function-state notification of the view Sleep stage.
description: 'Sent from the view worker for the sleep stage (view stage 4, selected by
  start_view_star_sleep). No formatter adds task members beyond F. Function-state family (F): the
  event formatter formats the named function detail. state is always present; stage only when
  non-empty; lapse_ms while the timer runs or at a terminal state; error and code at fail (even when
  the stored code is zero; lookup failure gives ''fail to operate''); cancel omits code and error;
  route is optional function ancestry. The sender does no deduplication and needs no preceding
  working event. Detail flags can suppress the working or non-working sends while the cached
  function tree still changes, so a receiver can miss transitions. Channel I (TCP 4700). Delivery:
  ordinary broadcast to every retained socket of the emitting server (master, guest and
  never-verified sockets alike); no cadence, delivery or ordering guarantee relative to RPC replies
  or other events. APK 3.3.2 consumes it (handled in the continuous-exposure branch of the legacy
  dispatcher). Lifecycle: working when the stage starts; on exit cancel when the view worker is
  stopped by request (a new view or stop; internal code 253, not sent), otherwise complete or fail
  by the stored code. The stage only waits while it runs. Emission READ; state-name mapping
  INFERRED.'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, ViewFunc @0x3c5a10, sleep stage @0x3c5d64, FUNC_STATE_GUARD @0x6e5280
  / @0x6e53b0 (64-bit build)
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: Sleep event
  type: object
  discriminator: Event
  description: F-family event; no task members established.
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: Sleep
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, Ev constructor @0x6f74c0; ViewFunc @0x3c5a10 (64-bit build)
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    state:
      type: string
      enum:
      - idle
      - working
      - complete
      - fail
      - cancel
      description: F state table; unknown internal codes fall back to idle.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0, state-name table @0xae9468
    stage:
      type: string
      description: Only when the detail holds a non-empty stage string; value set unresolved.
      x-required-when: stage string non-empty
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SendFuncEvent @0x6e4e20, FormatFuncDetail @0x6e1ce0
    lapse_ms:
      type: integer
      description: 'Elapsed milliseconds (signed 32-bit low bits): current monotonic time minus start while working
        or started-but-unfinished, otherwise end minus start. Independent of Timestamp.'
      x-required-when: timer started (working) or terminal state
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SendFuncEvent @0x6e4e20, FormatFuncDetail @0x6e1ce0
    error:
      type: string
      description: Message for code.
      x-required-when: state is fail (F formatter)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SendFuncEvent @0x6e4e20, FormatFuncDetail @0x6e1ce0
    code:
      type: integer
      description: Stored error code; present at fail even when zero.
      x-required-when: state is fail (F formatter)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SendFuncEvent @0x6e4e20, FormatFuncDetail @0x6e1ce0
    route:
      type: array
      items:
        type: string
      description: Function-ancestry names at send time (for example View, Stack); may be absent. Not an address.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintFunParent @0x6e46c0
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, ViewFunc @0x3c5a10 (64-bit build)
examples:
- name: working
  summary: Started (READ shape; values invented)
  of: payload
  payload:
    Event: Sleep
    Timestamp: '1234.123456789'
    state: working
    lapse_ms: 0
- name: fail
  summary: Failed (READ shape; values invented)
  of: payload
  payload:
    Event: Sleep
    Timestamp: '1234.123456789'
    state: fail
    error: fail to operate
    code: 207
    lapse_ms: 1530
see_also:
- start_view_star_sleep
- iscope_stop_view
- iscope_get_app_state
spec:
- spec/control/power-and-storage.md#shutdown-reboot-and-sleep
