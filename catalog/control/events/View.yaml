kind: event
name: View
summary: Function-state notification of the main view function, with view mode and target metadata.
description: 'Sent by the view worker and the named view-stage transitions (no timer). In the main
  imager process the view detail is named View; in the auxiliary (wide) process the same function is
  named SecondView. Function-state family (F): the event formatter formats the named function
  detail. state is always present; stage only when non-empty; lapse_ms while the timer runs or at a
  terminal state; error and code at fail (even when the stored code is zero; lookup failure gives
  ''fail to operate''); cancel omits code and error; route is optional function ancestry. The sender
  does no deduplication and needs no preceding working event. Detail flags can suppress the working
  or non-working sends while the cached function tree still changes, so a receiver can miss
  transitions. Members beyond the F set come from the stage formatter installed on the detail
  (star-view formatter: mode, cam_id, target fields, gain; RTSP/view formatter: manual_exp,
  planet_correction, scan_planet_tip); which ones appear depends on the stage and camera, so all are
  optional. Child function states (AutoFocus, AutoGoto, Stack and so on) are nested only in the full
  function-tree print of iscope_get_app_state / get_view_state, not in a standalone event; they send
  their own events. A full stop (iscope_stop_view without a stage, or close_camera) ends the View
  function with cancel (no code or error on the wire; internal code 253, not sent); the
  thread-wrapper rule is READ, its application to View INFERRED. With a non-none current mode the
  stop then resets the mode to none and re-sends the View detail without assigning a new state, so a
  terminal state can repeat with changed view fields. Channel I (TCP 4700). Delivery: ordinary
  broadcast to every retained socket of the emitting server (master, guest and never-verified
  sockets alike); no cadence, delivery or ordering guarantee relative to RPC replies or other
  events. APK 3.3.2 consumes it (legacy and event-type dispatchers; the event-type path rejects
  app-state events without route).'
grade: PURE GETTER (observation only)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, ViewFunc @0x3c5a10, thread-wrapper terminal logic @0x6e58a0, StopView
  re-send @0x3c133c, PrintViewMode @0x3c3500, PrintTargetInfo @0x3c4340,
  PrintViewStarInfo @0x3c4f20, PrintViewRtmpInfo @0x2f44a0 (64-bit build); same three mode members in the 32-bit
  build
side_effects: Observation only for the receiver.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: View event
  type: object
  discriminator: Event
  description: F-family view event plus view formatter members.
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: View
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, Ev constructor @0x6f74c0; ViewFunc @0x3c5a10, SendFuncEvent @0x6e4e20
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    state:
      type: string
      enum:
      - idle
      - working
      - complete
      - fail
      - cancel
      description: F state table; unknown internal codes fall back to idle.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, FormatFuncDetail @0x6e1ce0, state-name table @0xae9468
    stage:
      type: string
      description: Only when the detail holds a non-empty stage string; value set unresolved.
      x-required-when: stage string non-empty
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SendFuncEvent @0x6e4e20, FormatFuncDetail @0x6e1ce0
    lapse_ms:
      type: integer
      description: 'Elapsed milliseconds (signed 32-bit low bits): current monotonic time minus start while working
        or started-but-unfinished, otherwise end minus start. Independent of Timestamp.'
      x-required-when: timer started (working) or terminal state
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SendFuncEvent @0x6e4e20, FormatFuncDetail @0x6e1ce0
    error:
      type: string
      description: Message for code.
      x-required-when: state is fail (F formatter)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SendFuncEvent @0x6e4e20, FormatFuncDetail @0x6e1ce0
    code:
      type: integer
      description: Stored error code; present at fail even when zero.
      x-required-when: state is fail (F formatter)
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, SendFuncEvent @0x6e4e20, FormatFuncDetail @0x6e1ce0
    route:
      type: array
      items:
        type: string
      description: Function-ancestry names at send time (for example View, Stack); may be absent. Not an address.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintFunParent @0x6e46c0
    mode:
      type: string
      description: View mode name from the view-name table (star, scenery, moon, sun, planet, solar_sys, none; fallback
        unknown). Solar-system ids serialize as solar_sys with target_type naming the body.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintViewMode @0x3c3500, view-name table @0xaadda8
    target_type:
      type: string
      description: 'Solar-system mode only: moon, sun or planet; unknown fallback.'
      x-required-when: solar-system view modes
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintViewMode @0x3c3500
    cam_id:
      type: integer
      description: Camera id; no enumeration established.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintViewMode @0x3c3500
    star_type:
      type: integer
      description: Only when the stored star type is non-negative; enum not established.
      x-required-when: stored star_type >= 0
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintTargetInfo @0x3c4340
    target_name:
      type: string
      description: Only when the target name is non-empty.
      x-required-when: target name non-empty
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintTargetInfo @0x3c4340
    target_ra_dec:
      type: array
      items:
        type: number
      minItems: 2
      maxItems: 2
      description: 'Two numbers when both stored coordinates differ from the -999 sentinel: RA in decimal
        hours, then Dec in decimal degrees, as given to iscope_start_view (READ); epoch of date (INFERRED).'
      x-required-when: both coordinates set
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintTargetInfo @0x3c4340
    lp_filter:
      type: boolean
      description: Target light-pollution filter flag (INFERRED meaning).
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintTargetInfo @0x3c4340
    gain:
      type: integer
      description: Only when the camera gain control read succeeds; scale unresolved.
      x-required-when: gain control read succeeds
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintViewStarInfo @0x3c4f20
    manual_exp:
      type: boolean
      description: From the view RTSP formatter.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintViewRtmpInfo @0x2f44a0 (64-bit build)
    planet_correction:
      type: boolean
      description: From the view RTSP formatter.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintViewRtmpInfo @0x2f44a0 (64-bit build)
    scan_planet_tip:
      type: boolean
      description: From the view RTSP formatter.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, PrintViewRtmpInfo @0x2f44a0 (64-bit build)
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, ViewFunc @0x3c5a10, SendFuncEvent @0x6e4e20
examples:
- name: working-star
  summary: Star view running (READ shape; values invented)
  of: payload
  payload:
    Event: View
    Timestamp: '1234.123456789'
    state: working
    lapse_ms: 15230
    mode: star
    cam_id: 0
    target_name: Example target
    target_ra_dec:
    - 5.5
    - 22.0
    lp_filter: false
    gain: 80
- name: cancel
  summary: View stopped (READ shape; values invented)
  of: payload
  payload:
    Event: View
    Timestamp: '1234.123456789'
    state: cancel
    lapse_ms: 302114
    mode: none
    cam_id: 0
    lp_filter: false
see_also:
- iscope_start_view
- iscope_stop_view
- get_view_state
- iscope_get_app_state
