kind: event
name: RestartGuide
summary: Imager restarts guiding after a goto or a retry.
description: S family, emitted by the imager (not forwarded from the guider). The imager's start-guide
  worker reports start, complete or fail when it restarts guiding after a goto or on retry. error and
  code only for a supplied code greater than zero. Broadcast on TCP 4700 to every retained socket. The
  app defines the name as a constant but no event branch handling it is established. A 32-bit counterpart
  exists.
grade: PURE GETTER (observation only; receiving the event changes nothing)
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, StartGuideFunc @0x17a110 (64-bit build); 32-bit counterpart present
side_effects: None for the receiver; the device sends this without a request.
payload:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: RestartGuide event
  type: object
  discriminator: Event
  description: Guide-restart transition.
  required:
  - Event
  - Timestamp
  - state
  properties:
    Event:
      type: string
      const: RestartGuide
      description: Discriminator.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, StartGuideFunc @0x17a110
    Timestamp:
      type: string
      description: Decimal string with nine fractional digits from a monotonic clock; not a calendar time.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, getTimestamp @0x6d7a60
    state:
      type: string
      enum:
      - start
      - complete
      - fail
      description: Legacy literal.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, StartGuideFunc @0x17a110
    error:
      type: string
      description: Message for code. The S helper writes it only when the caller supplies a code greater
        than zero.
      x-required-when: caller-supplied code > 0
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyState @0xb0430
    code:
      type: integer
      description: Written only when the caller supplies a code greater than zero; never written as 0
        by this helper.
      x-required-when: caller-supplied code > 0
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, NotifyState @0xb0430
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, StartGuideFunc @0x17a110
examples:
- name: start
  summary: Restart begins (READ shape)
  of: payload
  payload:
    Event: RestartGuide
    Timestamp: '1234.123456789'
    state: start
- name: complete
  summary: Guiding restarted (READ shape)
  of: payload
  payload:
    Event: RestartGuide
    Timestamp: '1234.123456789'
    state: complete
see_also:
- guider/guide
- guider/get_func_state
spec:
- spec/control/events/variants-and-consumers.md#defined-but-never-dispatched
- spec/control/events-overview.md
