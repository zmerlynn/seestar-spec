kind: method
name: get_photometry_img
summary: 'Image socket: return the current photometry image as image bytes.'
description: 'Image-socket (4800/4804) method. Under a lock the handler copies the current photometry
  image into a request-local buffer and sends it: JPEG (imgType 4) in Jpg mode (error text `convert jpg
  failed` if conversion fails), otherwise always zip-compressed raw (dataType 3). READ. It reads an
  already-produced image; it does not recompute it or mutate shared state. The raw path always goes
  through a temporary scratch file on device storage, so under the strict convention it is a MUTATOR with
  observation-safe (tier B) effects. The 32-bit build matches (READ), apart from log wording and
  image-library version.'
grade: 'MUTATOR / established (scratch file on the raw path; 64-bit build, 32-bit build matches (READ))'
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, imager binary image table (serves 4800/4804), handler @0x115570
  (64-bit build), @0xa817c (32-bit build); static analysis of app 3.3.2, MainFileManager.getMeteringPic;
  GetPhotoMetryImg(IMG_DATA&), shouldTransferJpg/convertImageToJpg, unconditional compression on the raw
  path, reponse_result; JPEG path, convertImageToJpg passes an empty target path to IMG_DATA::ToJPG,
  whose imwrite/Save branches run only for a non-empty path (CFG check, 64-bit build); raw path
  (unconditional), IMG_DATA::Compress @0x6a2d10 (64-bit) / @0x67236c (32-bit), WriteFile of a scratch
  file, run_popen of a zip command, ReadFile, remove
side_effects: 'Copies the photometry image into a request-local buffer under a mutex, converts it to JPEG
  or zip-compresses it, then responds with the bytes. No shared-state mutation or hardware access. READ;
  the 32-bit build matches (READ). JPEG conversion encodes in memory: the conversion routine writes a
  file only when it is given a target path, and this handler passes none. READ (64-bit build; the 32-bit
  build has the same call structure, READ). On the raw path (always compressed): zip compression of raw
  output writes the raw bytes to a fixed-name scratch file in the imager''s private data directory, runs
  an external zip compressor on it, reads the archive back and deletes both files before replying. READ.
  Nothing persists, so the effect is observation-safe (tier B), but the handler is a MUTATOR under the
  strict convention, as for get_server_log. Because the scratch name is fixed, two compressed raw
  requests served at the same time could interfere; INFERRED.'
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_photometry_img request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_photometry_img
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, imager binary image table (serves 4800/4804), handler
        @0x115570 (64-bit build), @0xa817c (32-bit build)
    params:
      description: Not read by the handler. The app sends no params member. Clients SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, imager image handlers (64-bit build); static analysis
        of app 3.3.2, MainFileManager.getMeteringPic
reply_success:
  title: get_photometry_img success reply
  description: 'Not an ordinary command reply. The photometry image: JPEG (imgType 4) in Jpg mode, otherwise
    zip-compressed raw (dataType 3). 80-byte big-endian header (spec/media/image-sockets.md#reply-framing),
    then the payload; errors are text replies with dataType 1.'
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, imager binary image table (serves 4800/4804), handler @0x115570
    (64-bit build), @0xa817c (32-bit build)
reply_error:
  title: get_photometry_img error reply
  description: 'Text reply (imgType 0, dataType 1): `convert jpg failed` when JPEG conversion fails in
    Jpg mode. No top-level JSON code member.'
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, imager binary image table (serves 4800/4804), handler @0x115570
    (64-bit build), @0xa817c (32-bit build)
errors: []
errors_note: No numeric code reaches the client. The known handler error is the text `convert jpg failed`;
  other failure texts of this handler were not listed.
examples:
- name: request
  of: request
  payload:
    id: 1
    method: get_photometry_img
see_also:
- get_current_img
- get_stacked_img
spec:
- spec/media/image-sockets.md#registered-methods
