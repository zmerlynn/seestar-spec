kind: method
name: get_fits_file
summary: Fetch an image file from the device, optionally compressed.
description: Served by the imager process (4801). Params select a file by `name` and a `compress` flag.
  `name` is used as given if it contains a known image-folder name, otherwise it is taken relative to
  the image root; the device does not normalise the path or reject `..` components (READ), so confinement
  to the image store is not enforced (INFERRED). The reply is the file data, raw or zip-compressed (imgType
  6), or a text error; file-size and file-read failures return a message. The compression path (subprocess,
  temporary file, native effects) is unresolved, as is the compress default on each build.
grade: 'MUTATOR / established (64-bit imager build: conditional diagnostics; 32-bit build matches (READ))'
side_effect_tier: D
confidence: READ
basis: 'static analysis of firmware 9.31, handler @0x1f3480 (64-bit imager build); path rule: four image-folder
  substring checks, then concatenation with the image root; no realpath or ".." test'
side_effects: Writes native diagnostic output. Further file, image, database and compression effects are
  unresolved (tier D).
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_fits_file request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_fits_file
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, dispatcher table
    params:
      $ref: ../schemas/GetFitsFileParams.yaml
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, handler @0x1f3480 (64-bit imager build)
reply_success:
  title: get_fits_file success reply
  description: Raw (dataType 2) or zip-compressed (dataType 3) file data, imgType 6. Not an ordinary JSON
    result envelope. 80-byte big-endian header (spec/media/image-sockets.md#reply-framing), then the
    payload; errors are text replies with dataType 1.
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, handler @0x1f3480 (64-bit imager build)
reply_error:
  title: get_fits_file error reply
  description: 'Text reply (imgType 0, dataType 1): the payload is the fixed text for the error code (spec/media/files-and-album.md#parameter-rules-read-handlers,
    R9). No top-level JSON code member.'
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, handler @0x1f3480 (64-bit imager build)
errors:
- code: 105
  trigger: name missing or not a string
  label: expected string param
- code: 258
  trigger: File cannot be opened or read (condition INFERRED from the code's text; an earlier reading
    as an allocation failure is not confirmed)
  label: open file failed
examples:
- name: object-form
  of: request
  payload:
    id: 41
    method: get_fits_file
    params:
      name: example.fit
      compress: true
- name: array-form
  of: request
  payload:
    id: 42
    method: get_fits_file
    params:
    - example.fit
    - 0
see_also: []
spec:
- spec/media/files-and-album.md#parameter-rules-read-handlers
