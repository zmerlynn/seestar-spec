kind: method
name: get_camera_img
summary: Fetch the current camera image as a binary transfer.
description: Params are not consumed. Registered in the imager image table of both builds; the response
  is the current camera image as uncompressed raw (dataType 2) or the text "there is no image now", not
  ordinary command JSON. READ. The 32-bit build follows the same handler flow over a different camera-driver
  backend and lacks the 64-bit wide-camera denoise and newer-model branches (READ). Acknowledgement semantics
  are unresolved.
grade: MUTATOR / established (64-bit build; 32-bit build same handler flow on a different camera-driver
  backend (READ))
side_effect_tier: D
confidence: READ
basis: static analysis of firmware 9.31, imager handler @0x113620 (64-bit build), ReadCamImg @0x2136c0
  (64-bit, ASI_CAM_GetImage/GetImageCrop, wide-denoise and S30Plus/S80 branches); 32-bit closure uses ASICAM_*
  / v4l2 with hpct/raw conversion instead
side_effects: Reads the camera image; reallocates the retained camera image object (a cache effect) and
  logs diagnostics on crop-read failure or frame mismatch. Full camera and ISP descendants are not bounded.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_camera_img request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_camera_img
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, imager image table (64-bit and 32-bit builds)
    params:
      description: Not read. Omission, null, object, scalar and array all take the same path. Clients
        SHOULD omit it.
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, imager handler @0x113620 (64-bit build)
reply_success:
  title: get_camera_img success reply
  description: Not an ordinary command reply. The current camera image as uncompressed raw (dataType 2).
    80-byte big-endian header (spec/media/image-sockets.md#reply-framing), then the payload; errors
    are text replies with dataType 1.
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, imager handler @0x113620 (64-bit build), ReadCamImg @0x2136c0
reply_error:
  title: get_camera_img failure reply
  description: 'Text reply (imgType 0, dataType 1): `there is no image now`. No top-level JSON code member.'
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, imager handler @0x113620 (64-bit build), ReadCamImg @0x2136c0
errors: []
errors_note: No numeric error code was recovered for the direct handler; textual errors only. Dispatcher
  errors do not apply to this endpoint as established.
examples:
- name: request
  of: request
  payload:
    id: 1
    method: get_camera_img
see_also:
- get_auto_focus_img
spec:
- spec/media/image-sockets.md#registered-methods
