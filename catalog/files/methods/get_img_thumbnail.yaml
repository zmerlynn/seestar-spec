kind: method
name: get_img_thumbnail
summary: 'File channel: read a stored image''s thumbnail from disk and return it.'
description: 'File-channel (4801) method. Resolves `name` under the image root and returns the stored
  thumbnail of the file, or the folder''s thumbnail when `name` is a folder, read into a request-local
  buffer. A missing or invalid path gives a text error carrying the current error code. READ. Filesystem
  read only: PURE GETTER / tier B. The 32-bit build matches (READ), apart from log wording.'
grade: 'PURE GETTER / probable (64-bit build; 32-bit build matches (READ))'
side_effect_tier: B
confidence: READ
basis: static analysis of firmware 9.31, imager file table (serves 4801), handler @0x1f4ea0 (64-bit build),
  @0x184288 (32-bit build); static analysis of app 3.3.2, RemotePhotoEntity command builder; FillPath,
  IsDir, GetFileFolderThbnlName (folder case), Load into a request-local IMG_DATA, reponse_result; jrpc_error
  with err_code/get_err_string on path errors
side_effects: Resolves a request path, checks whether it is a folder, reads the stored thumbnail from
  disk into a request-local buffer, then responds. Filesystem read only; no write. READ; the 32-bit build matches (READ).
  The pure-getter grade stays probable.
request:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  title: get_img_thumbnail request
  required:
  - id
  - method
  properties:
    id:
      $ref: ../../common/schemas/Id.yaml
    method:
      type: string
      const: get_img_thumbnail
      x-confidence: READ
      x-basis: static analysis of firmware 9.31, imager file table (serves 4801), handler @0x1f4ea0 (64-bit
        build), @0x184288 (32-bit build)
    params:
      type: object
      description: Object form sent by the app. Device-side parsing is unresolved.
      required:
      - name
      properties:
        name:
          type: string
          description: Remote file path, as listed by get_albums (INFERRED source).
          x-confidence: READ
          x-basis: static analysis of app 3.3.2, RemotePhotoEntity command builder
      x-confidence: READ
      x-basis: static analysis of app 3.3.2, RemotePhotoEntity command builder
reply_success:
  title: get_img_thumbnail success reply
  description: The stored thumbnail of the file, or of the folder when `name` is a folder. Not an ordinary
    command reply. 80-byte big-endian header (spec/media/image-sockets.md#reply-framing), then the payload;
    errors are text replies with dataType 1.
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, imager file table (serves 4801), handler @0x1f4ea0 (64-bit
    build), @0x184288 (32-bit build)
reply_error:
  title: get_img_thumbnail error reply
  description: 'Text reply (imgType 0, dataType 1): the payload is the fixed text for the error code (spec/media/files-and-album.md#parameter-rules-read-handlers,
    R9). No top-level JSON code member.'
  x-confidence: READ
  x-basis: static analysis of firmware 9.31, imager file table (serves 4801), handler @0x1f4ea0 (64-bit
    build), @0x184288 (32-bit build)
errors: []
errors_note: No numeric code was listed for this handler; failures are text replies.
examples:
- name: request
  of: request
  payload:
    id: 1
    method: get_img_thumbnail
    params:
      name: MyWorks/example.jpg
see_also:
